<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TyQuest Retro</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            overscroll-behavior-y: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* Enforce strict full-screen fixed layout to prevent page-level scroll */
        html, body, #root {
            width: 100%;
            height: 100%;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .pixel-box {
            border: 4px solid var(--app-border);
            box-shadow: 4px 4px 0px rgba(0,0,0,0.25);
            border-radius: 4px;
        }

        .pixel-box-sm {
            border: 2px solid var(--app-border);
            box-shadow: 2px 2px 0px rgba(0,0,0,0.25);
            border-radius: 2px;
        }

        .font-arcade { font-family: 'Silkscreen', 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', 'Noto Color Emoji', cursive; }
        .font-sans { font-family: 'Silkscreen', 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', 'Noto Color Emoji', cursive; } /* Unified to Silkscreen */

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
            100% { transform: translateY(0px); }
        }
        .animate-float { animation: float 3s ease-in-out infinite; }

        @keyframes pop {
            0% { transform: scale(0.9); opacity: 0; }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop { animation: pop 0.2s ease-out forwards; }

        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 24px); }
        .pt-safe { padding-top: env(safe-area-inset-top, 12px); }
        
        @keyframes confettiFall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }
        .confetti-piece {
            position: fixed;
            top: 0;
            z-index: 9999;
            pointer-events: none;
            animation: confettiFall 2.5s ease-out forwards;
        }

        /* Clean Date Input Fix */
        input[type="date"] {
            box-sizing: border-box;
            appearance: none;
            -webkit-appearance: none;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        const { useState, useEffect, useMemo } = React;

        class SoundManager {
            constructor() {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            }
            playTone(freq, type, duration, vol = 0.1) {
                if (this.ctx.state === 'suspended') this.ctx.resume();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + duration);
            }
            playBlip(freq = 400) { this.playTone(freq, 'square', 0.1, 0.05); }
            playCoin() {
                this.playTone(987.77, 'square', 0.1, 0.05);
                setTimeout(() => this.playTone(1318.51, 'square', 0.3, 0.05), 100);
            }
            playMagic() {
                this.playTone(400, 'sine', 0.1, 0.05);
                setTimeout(() => this.playTone(600, 'sine', 0.1, 0.05), 50);
                setTimeout(() => this.playTone(800, 'sine', 0.2, 0.05), 100);
            }
            playError() { this.playTone(150, 'sawtooth', 0.2, 0.05); }
        }
        const sound = new SoundManager();

        const RETRO_THEMES = {
            snes16bit: {
                id: 'snes16bit', name: '16-Bit Town', isDark: false, cost: 0,
                bg: '#edd9c0', windowBg: '#fffbf0', hudBg: '#3d253b', hudText: '#fce4a6',
                border: '#1b122c', primary: '#477d61', colTodo: '#d88554', colDoing: '#4d8093', colDone: '#4b7d5f', tagBg: '#ebcfad'
            },
            sageWordnest: {
                id: 'sageWordnest', name: 'Sage Wordnest', isDark: false, cost: 50,
                bg: '#b9cc9f', windowBg: '#e6ebd8', hudBg: '#2b3b24', hudText: '#e6ebd8',
                border: '#2b3b24', primary: '#425a37', colTodo: '#a3b888', colDoing: '#92a777', colDone: '#819666', tagBg: '#c5d6af'
            },
            cyberArcade: {
                id: 'cyberArcade', name: 'Neon Arcade', isDark: true, cost: 100,
                bg: '#05020a', windowBg: '#130b29', hudBg: '#0f051c', hudText: '#00f0ff',
                border: '#f000ff', primary: '#00f0ff', colTodo: '#ff0055', colDoing: '#9d00ff', colDone: '#00ffaa', tagBg: '#2a1758'
            },
            cozyCafe: {
                id: 'cozyCafe', name: 'Cantina', isDark: false, cost: 250,
                bg: '#e6ccb8', windowBg: '#f5e6d3', hudBg: '#5c3a21', hudText: '#f5e6d3',
                border: '#4a2c17', primary: '#c45a33', colTodo: '#d48a6a', colDoing: '#bd7246', colDone: '#8f5331', tagBg: '#d9c2ad'
            }
        };

        const SHOP_REWARDS = [
            { id: 'r1', name: 'Buy a Coffee Treat', cost: 25 },
            { id: 'r2', name: '20 Min Guilt-Free Doomscroll', cost: 50 },
            { id: 'r3', name: 'Get Out of a Chore Free', cost: 150 },
            { id: 'r4', name: "Husband's Back Massage Pass", cost: 200 },
            { id: 'r5', name: '1 Hour Guilt-Free Gaming', cost: 75 },
            { id: 'r6', name: 'Pajama Day (Weekend)', cost: 300 },
            { id: 'r7', name: 'Buy Hobby Supplies ($20 Limit)', cost: 500 },
            { id: 'r8', name: 'Takeout Dinner of Choice', cost: 400 }
        ];

        const HeroAvatar = () => (
            <svg width="40" height="40" viewBox="0 0 16 16" className="pixel-box bg-[#87CEEB]" style={{ borderColor: 'var(--app-border)' }}>
                <rect x="5" y="5" width="6" height="6" fill="#FFDFC4"/> {/* Skin */}
                <rect x="4" y="3" width="8" height="3" fill="#5C3A21"/> {/* Hair */}
                <rect x="4" y="6" width="2" height="2" fill="#5C3A21"/>
                <rect x="10" y="6" width="2" height="2" fill="#5C3A21"/>
                <rect x="6" y="7" width="1" height="1" fill="#000"/> {/* Eye */}
                <rect x="9" y="7" width="1" height="1" fill="#000"/> {/* Eye */}
                <rect x="7" y="9" width="2" height="1" fill="#E88A8A"/> {/* Mouth */}
                <rect x="4" y="11" width="8" height="5" fill="#4ade80"/> {/* Shirt */}
            </svg>
        );

        const IconBoard = ({ active }) => (
            <svg width="24" height="24" viewBox="0 0 16 16" fill="currentColor" className={`transition-opacity ${active ? "opacity-100" : "opacity-40"}`}>
                <rect x="1" y="2" width="4" height="12" />
                <rect x="6" y="2" width="4" height="8" />
                <rect x="11" y="2" width="4" height="10" />
            </svg>
        );

        const IconList = ({ active }) => (
            <svg width="24" height="24" viewBox="0 0 16 16" fill="currentColor" className={`transition-opacity ${active ? "opacity-100" : "opacity-40"}`}>
                <rect x="2" y="3" width="3" height="3" />
                <rect x="6" y="3" width="8" height="3" />
                <rect x="2" y="8" width="3" height="3" />
                <rect x="6" y="8" width="8" height="3" />
            </svg>
        );

        const IconShop = ({ active }) => (
            <svg width="24" height="24" viewBox="0 0 16 16" fill="currentColor" className={`transition-opacity ${active ? "opacity-100" : "opacity-40"}`}>
                <rect x="3" y="2" width="10" height="3" />
                <rect x="2" y="5" width="12" height="9" />
                <rect x="6" y="9" width="4" height="5" fill="var(--app-hudBg, #000)" opacity="0.6" />
            </svg>
        );

        const IconLibrary = ({ active }) => (
            <svg width="24" height="24" viewBox="0 0 16 16" fill="currentColor" className={`transition-opacity ${active ? "opacity-100" : "opacity-40"}`}>
                <rect x="2" y="2" width="3" height="12" />
                <rect x="6" y="3" width="3" height="11" />
                <rect x="10" y="2" width="4" height="12" />
                <rect x="3" y="4" width="1" height="2" fill="var(--app-hudBg, #000)" opacity="0.6"/>
                <rect x="7" y="5" width="1" height="2" fill="var(--app-hudBg, #000)" opacity="0.6"/>
                <rect x="11" y="4" width="2" height="1" fill="var(--app-hudBg, #000)" opacity="0.6"/>
            </svg>
        );

        const IconBoss = () => (
            <svg width="24" height="24" viewBox="0 0 16 16" fill="currentColor" className="text-red-500 animate-pulse">
                <rect x="4" y="2" width="8" height="8" />
                <rect x="5" y="10" width="6" height="4" />
                <rect x="5" y="5" width="2" height="2" fill="var(--app-hudBg, #000)"/>
                <rect x="9" y="5" width="2" height="2" fill="var(--app-hudBg, #000)"/>
                <rect x="7" y="8" width="2" height="1" fill="var(--app-hudBg, #000)"/>
                <rect x="5" y="11" width="1" height="3" fill="var(--app-hudBg, #000)"/>
                <rect x="7" y="11" width="2" height="3" fill="var(--app-hudBg, #000)"/>
                <rect x="10" y="11" width="1" height="3" fill="var(--app-hudBg, #000)"/>
            </svg>
        );

        const IconChevronUp = () => (
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="square">
                <polyline points="18 15 12 9 6 15"></polyline>
            </svg>
        );

        const IconChevronDown = () => (
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="square">
                <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
        );

        const DB_NAME = 'TyQuestDB';
        const STORE_NAME = 'appData';

        const initDB = () => {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, 1);
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME);
                    }
                };
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        };

        const saveToDB = async (key, data) => {
            try {
                const db = await initDB();
                const tx = db.transaction(STORE_NAME, 'readwrite');
                tx.objectStore(STORE_NAME).put(data, key);
            } catch (e) { console.error('IDB Save Error:', e); }
        };

        const loadFromDB = async (key) => {
            try {
                const db = await initDB();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(STORE_NAME, 'readonly');
                    const req = tx.objectStore(STORE_NAME).get(key);
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => reject(req.error);
                });
            } catch (e) { return null; }
        };

        const getTodayStr = () => new Date().toISOString().split('T')[0];
        const getTomorrowStr = () => {
            const d = new Date();
            d.setDate(d.getDate() + 1);
            return d.toISOString().split('T')[0];
        };

        const Confetti = ({ trigger }) => {
            const [particles, setParticles] = React.useState([]);
            
            React.useEffect(() => {
                if (trigger > 0) {
                    const colors = ['#fde047', '#4ade80', '#60a5fa', '#f87171', '#c084fc'];
                    const newParticles = Array.from({ length: 40 }).map((_, i) => ({
                        id: Date.now() + i,
                        left: Math.random() * 100 + 'vw',
                        color: colors[Math.floor(Math.random() * colors.length)],
                        size: Math.random() * 6 + 4 + 'px',
                        delay: Math.random() * 0.2 + 's',
                        duration: Math.random() * 1 + 1.5 + 's',
                        shape: Math.random() > 0.5 ? '50%' : '0%'
                    }));
                    setParticles(newParticles);
                    const timer = setTimeout(() => setParticles([]), 3000);
                    return () => clearTimeout(timer);
                }
            }, [trigger]);

            if (particles.length === 0) return null;
            return (
                <div className="fixed inset-0 pointer-events-none z-[200] overflow-hidden">
                    {particles.map(p => (
                        <div key={p.id} className="confetti-piece pixel-box-sm border-black/20" style={{
                            left: p.left,
                            backgroundColor: p.color,
                            width: p.size,
                            height: p.size,
                            borderRadius: p.shape,
                            animationDelay: p.delay,
                            animationDuration: p.duration
                        }} />
                    ))}
                </div>
            );
        };

        function App() {
            const [isDataLoaded, setIsDataLoaded] = useState(false);
            
            // Dummy Data Initialization
            const initialTasks = [
                { id: 't1', text: 'Slay the laundry dragon', status: 'todo', boardId: 'house', dueDate: getTodayStr(), subtasks: [{id: 's1', text: 'Wash clothes', done: true}, {id: 's2', text: 'Fold and put away', done: false}] },
                { id: 't2', text: 'Visit Potion Master (Dentist)', status: 'todo', boardId: 'general', dueDate: getTomorrowStr(), subtasks: [] },
                { id: 't3', text: 'Cook HP Ration Meals for week', status: 'doing', boardId: 'house', dueDate: getTodayStr(), subtasks: [] },
                { id: 't4', text: 'Pay the troll toll (Electric bill)', status: 'done', boardId: 'general', dueDate: getTodayStr(), completedAt: getTodayStr(), subtasks: [] }
            ];

            const initialBoards = [
                { id: 'all', name: 'ALL QUESTS' },
                { id: 'house', name: 'HOUSEKEEPING' },
                { id: 'fitness', name: 'TRAINING' }
            ];

            const initialLibraryCategories = [
                { id: 'cat1', name: 'GAMES TO PLAY', emoji: '🎮' },
                { id: 'cat2', name: 'BOOKS TO READ', emoji: '📚' },
                { id: 'cat3', name: 'MOVIES', emoji: '🎬' }
            ];

            const [tasks, setTasks] = useState([]);
            const [boards, setBoards] = useState([]);
            const [activeBoardId, setActiveBoardId] = useState('all');
            const [activeTab, setActiveTab] = useState('board'); 
            
            const [libraryItems, setLibraryItems] = useState([]);
            const [libraryCategories, setLibraryCategories] = useState([]);
            const [activeLibCat, setActiveLibCat] = useState('all');
            
            const [xp, setXp] = useState(0);
            const [level, setLevel] = useState(1);
            const [gold, setGold] = useState(0);
            
            const [themeKey, setThemeKey] = useState('snes16bit');
            const [unlockedThemes, setUnlockedThemes] = useState(['snes16bit']);

            const [isNavVisible, setIsNavVisible] = useState(true);
            const [showStatsModal, setShowStatsModal] = useState(false);
            const [isAddingQuest, setIsAddingQuest] = useState(false);
            const [showSubtasksInput, setShowSubtasksInput] = useState(false);
            const [isManagingBoard, setIsManagingBoard] = useState(false);
            const [isAddingLibCat, setIsAddingLibCat] = useState(false);
            const [focusTaskId, setFocusTaskId] = useState(null);
            const [confettiTrigger, setConfettiTrigger] = useState(0);

            // Level calculation
            useEffect(() => {
                setLevel(Math.floor(xp / 100) + 1);
            }, [xp]);

            // Note: Auto Dark Mode forcibly overriding themes was removed here to fix 
            // the user being locked out of equipping purchased themes after 8 PM.

            useEffect(() => {
                const loadData = async () => {
                    const savedTasks = await loadFromDB('tq_tasks');
                    const savedBoards = await loadFromDB('tq_boards');
                    const savedXp = await loadFromDB('tq_xp');
                    const savedGold = await loadFromDB('tq_gold');
                    const savedTheme = await loadFromDB('tq_theme');
                    const savedUnlockedThemes = await loadFromDB('tq_unlocked_themes');
                    const savedLibItems = await loadFromDB('tq_lib_items');
                    const savedLibCats = await loadFromDB('tq_lib_cats');

                    if (savedTasks && savedTasks.length > 0) { setTasks(savedTasks); } else { setTasks(initialTasks); }
                    if (savedBoards && savedBoards.length > 0) { setBoards(savedBoards); } else { setBoards(initialBoards); }
                    
                    if (savedLibItems) { setLibraryItems(savedLibItems); }
                    if (savedLibCats && savedLibCats.length > 0) { setLibraryCategories(savedLibCats); } else { setLibraryCategories(initialLibraryCategories); }

                    if (savedXp !== null && !isNaN(parseInt(savedXp, 10))) { setXp(parseInt(savedXp, 10)); } else { setXp(0); }
                    if (savedGold !== null && !isNaN(parseInt(savedGold, 10))) { setGold(parseInt(savedGold, 10)); } else { setGold(0); }
                    
                    if (savedTheme) setThemeKey(savedTheme);
                    if (savedUnlockedThemes) setUnlockedThemes(savedUnlockedThemes);

                    setIsDataLoaded(true);
                };
                loadData();
            }, []);

            useEffect(() => {
                if (!isDataLoaded) return;
                saveToDB('tq_tasks', tasks);
                saveToDB('tq_boards', boards);
                saveToDB('tq_xp', xp.toString());
                saveToDB('tq_gold', gold.toString());
                saveToDB('tq_theme', themeKey);
                saveToDB('tq_unlocked_themes', unlockedThemes);
                saveToDB('tq_lib_items', libraryItems);
                saveToDB('tq_lib_cats', libraryCategories);
            }, [tasks, boards, xp, gold, themeKey, unlockedThemes, libraryItems, libraryCategories, isDataLoaded]);

            const activeTheme = RETRO_THEMES[themeKey] || RETRO_THEMES.snes16bit;

            const handleAddTask = (text, date, boardId, subtasksArr) => {
                const newTask = {
                    id: Date.now().toString(),
                    text,
                    status: 'todo',
                    boardId: boardId === 'all' ? 'general' : boardId,
                    dueDate: date,
                    subtasks: subtasksArr || []
                };
                setTasks([newTask, ...tasks]);
                sound.playBlip(600);
                setIsAddingQuest(false);
                setShowSubtasksInput(false);
            };

            const handleToggleTaskStatus = (task) => {
                if (task.status === 'done') return; // Prevent reverting from 'done'

                let nextStatus = 'doing';
                if (task.status === 'todo') nextStatus = 'doing';
                else if (task.status === 'doing') nextStatus = 'done';

                setTasks(tasks.map(t => {
                    if (t.id === task.id) {
                        return { ...t, status: nextStatus, completedAt: nextStatus === 'done' ? getTodayStr() : t.completedAt };
                    }
                    return t;
                }));

                if (nextStatus === 'done') {
                    sound.playCoin();
                    setXp(prev => prev + 50);
                    setGold(prev => prev + 10);
                    setConfettiTrigger(prev => prev + 1);
                } else {
                    sound.playBlip(300);
                }
                
                if (focusTaskId === task.id && nextStatus === 'done') {
                    setFocusTaskId(null);
                }
            };

            const handleDefeatBoss = (taskId) => {
                // Instantly complete task from any state when attacked in Boss Mode
                setTasks(tasks.map(t => t.id === taskId ? { ...t, status: 'done', completedAt: getTodayStr() } : t));
                sound.playCoin();
                setXp(prev => prev + 50);
                setGold(prev => prev + 10);
                setConfettiTrigger(prev => prev + 1);
                setFocusTaskId(null);
            };

            const handleToggleSubtask = (taskId, subIdx) => {
                setTasks(tasks.map(t => {
                    if (t.id !== taskId) return t;
                    const newSubs = [...t.subtasks];
                    const wasDone = newSubs[subIdx].done;
                    newSubs[subIdx].done = !wasDone;
                    
                    if (!wasDone) {
                        sound.playBlip(700);
                        setXp(prev => prev + 5);
                        setGold(prev => prev + 1);
                    }
                    
                    return { ...t, subtasks: newSubs };
                }));
            };

            const handleDeleteTask = (id) => {
                sound.playError();
                setTasks(tasks.filter(t => t.id !== id));
            };

            const handleRerollTask = (id) => {
                if (gold < 5) {
                    sound.playError();
                    alert("Not enough Gold!");
                    return;
                }
                setGold(prev => prev - 5);
                sound.playMagic();
                setTasks(tasks.map(t => t.id === id ? { ...t, dueDate: getTomorrowStr() } : t));
            };

            const handleBuyReward = (cost) => {
                if (gold >= cost) {
                    setGold(prev => prev - cost);
                    sound.playCoin();
                } else {
                    sound.playError();
                }
            };

            const handleBuyTheme = (themeId, cost) => {
                if (gold >= cost) {
                    setGold(prev => prev - cost);
                    setUnlockedThemes([...unlockedThemes, themeId]);
                    setThemeKey(themeId);
                    sound.playCoin();
                } else {
                    sound.playError();
                }
            };

            const handleDeleteBoard = (boardId) => {
                if (boardId === 'all') return;
                setTasks(tasks.map(t => t.boardId === boardId ? { ...t, boardId: 'general' } : t));
                setBoards(boards.filter(b => b.id !== boardId));
                setActiveBoardId('all');
                sound.playError();
            };

            const handleAddLibItem = (e) => {
                e.preventDefault();
                const text = e.target.itemText.value.trim();
                if (!text) return;
                const targetCat = activeLibCat === 'all' ? (libraryCategories[0]?.id || 'cat1') : activeLibCat;
                const newItem = { id: 'l_'+Date.now(), text, categoryId: targetCat, done: false };
                setLibraryItems([newItem, ...libraryItems]);
                e.target.reset();
                sound.playBlip(600);
            };

            const handleToggleLibItem = (id) => {
                setLibraryItems(libraryItems.map(i => i.id === id ? {...i, done: !i.done} : i));
                sound.playBlip(300);
            };

            const handleDeleteLibItem = (id) => {
                setLibraryItems(libraryItems.filter(i => i.id !== id));
                sound.playError();
            };

            const handleAddLibCategory = (e) => {
                e.preventDefault();
                const name = e.target.catName.value.trim().toUpperCase();
                const emoji = e.target.catEmoji.value.trim();
                if (!name) return;
                const newCat = { id: 'c_'+Date.now(), name, emoji };
                setLibraryCategories([...libraryCategories, newCat]);
                setActiveLibCat(newCat.id);
                setIsAddingLibCat(false);
                sound.playCoin();
            };

            const handleDeleteLibCategory = (id) => {
                setLibraryCategories(libraryCategories.filter(c => c.id !== id));
                setLibraryItems(libraryItems.filter(i => i.categoryId !== id));
                setActiveLibCat('all');
                sound.playError();
            };

            const filteredTasks = useMemo(() => {
                if (activeBoardId === 'all') return tasks;

                                            <svg width="48" height="48" viewBox="0 0 16 16" fill="white">
                                                <rect x="4" y="2" width="8" height="8" />
                                                <rect x="5" y="10" width="6" height="4" />
                                                <rect x="5" y="5" width="2" height="2" fill="var(--app-hudBg, #000)"/>
                                                <rect x="9" y="5" width="2" height="2" fill="var(--app-hudBg, #000)"/>
                                                <rect x="7" y="8" width="2" height="1" fill="var(--app-hudBg, #000)"/>
                                            </svg>
                                        </div>
                                        <p className="text-sm leading-loose mb-6 break-words">{tasks.find(t => t.id === focusTaskId).text}</p>
                                        
                                        <div className="flex gap-4 mt-6">
                                            <button 
                                                onClick={() => handleDefeatBoss(focusTaskId)}
                                                className="flex-1 bg-red-500 text-white pixel-box-sm py-4 active:bg-white active:text-red-500 text-xs"
                                            >
                                                ATTACK
                                            </button>
                                            <button 
                                                onClick={() => { sound.playError(); setFocusTaskId(null); }}
                                                className="flex-1 bg-gray-700 text-white pixel-box-sm py-4 active:bg-gray-500 text-xs"
                                            >
                                                FLEE
                                            </button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {}
                    {isAddingQuest && (
                        <div className="fixed inset-0 z-[60] bg-black/60 backdrop-blur-sm flex items-end sm:items-center justify-center p-4">
                            <div className="w-full max-w-md pixel-box bg-white p-6 animate-pop pb-safe max-h-[90vh] overflow-y-auto hide-scrollbar" style={{ backgroundColor: activeTheme.windowBg }}>
                                <h2 className="text-sm mb-4">NEW QUEST</h2>
                                <form onSubmit={(e) => {
                                    e.preventDefault();
                                    const fd = new FormData(e.target);
                                    
                                    const subs = [];
                                    if(fd.get('sub1') && fd.get('sub1').trim()) subs.push({id: 's1_'+Date.now(), text: fd.get('sub1').trim(), done: false});
                                    if(fd.get('sub2') && fd.get('sub2').trim()) subs.push({id: 's2_'+Date.now(), text: fd.get('sub2').trim(), done: false});
                                    if(fd.get('sub3') && fd.get('sub3').trim()) subs.push({id: 's3_'+Date.now(), text: fd.get('sub3').trim(), done: false});

                                    handleAddTask(fd.get('text'), fd.get('date'), fd.get('boardId'), subs);
                                }}>
                                    <textarea 
                                        name="text" required autoFocus
                                        placeholder="What needs doing?"
                                        className="w-full pixel-box-sm p-3 text-sm mb-4 min-h-[80px] bg-white text-black focus:outline-none"
                                    ></textarea>

                                    {!showSubtasksInput ? (
                                        <button 
                                            type="button" 
                                            onClick={() => setShowSubtasksInput(true)} 
                                            className="w-full pixel-box-sm py-3 text-[10px] bg-white/50 text-black mb-4 border-dashed border-2 active:bg-gray-100"
                                        >
                                            + ADD SUBTASKS
                                        </button>
                                    ) : (
                                        <div className="mb-4 space-y-2">
                                            <div className="flex justify-between items-center opacity-70">
                                                <p className="text-[8px]">SUBTASKS (OPTIONAL)</p>
                                                <button type="button" onClick={() => setShowSubtasksInput(false)} className="text-red-500 text-[10px]">X</button>
                                            </div>
                                            <input type="text" name="sub1" placeholder="- Subtask 1" className="w-full pixel-box-sm p-2 text-xs bg-white/70 text-black focus:outline-none" />
                                            <input type="text" name="sub2" placeholder="- Subtask 2" className="w-full pixel-box-sm p-2 text-xs bg-white/70 text-black focus:outline-none" />
                                            <input type="text" name="sub3" placeholder="- Subtask 3" className="w-full pixel-box-sm p-2 text-xs bg-white/70 text-black focus:outline-none" />
                                        </div>
                                    )}
                                    
                                    <div className="flex gap-2 mb-4">
                                        <button type="button" onClick={(e) => { e.currentTarget.parentElement.nextElementSibling.value = getTodayStr(); }} className="flex-1 pixel-box-sm py-2 text-[10px] bg-gray-200 text-black active:bg-yellow-400">TODAY</button>
                                        <button type="button" onClick={(e) => { e.currentTarget.parentElement.nextElementSibling.value = getTomorrowStr(); }} className="flex-1 pixel-box-sm py-2 text-[10px] bg-gray-200 text-black active:bg-yellow-400">TMRW</button>
                                    </div>
                                    <div className="w-full mb-4">
                                        <input type="date" name="date" defaultValue={getTodayStr()} className="w-full pixel-box-sm p-3 text-[10px] bg-white text-black block" />
                                    </div>
                                    
                                    <select name="boardId" defaultValue={activeBoardId} className="w-full pixel-box-sm p-3 text-[10px] mb-6 bg-white text-black">
                                        {boards.map(b => <option key={b.id} value={b.id}>{b.name}</option>)}
                                    </select>
                                    
                                    <div className="flex gap-3">
                                        <button type="button" onClick={() => { sound.playBlip(); setIsAddingQuest(false); setShowSubtasksInput(false); }} className="flex-1 pixel-box-sm py-3 text-xs bg-gray-300 text-black active:scale-95">CANCEL</button>
                                        <button type="submit" className="flex-1 pixel-box-sm py-3 text-xs bg-green-500 text-white active:scale-95">SAVE</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* --- MANAGE BOARD MODAL --- */}
                    {isManagingBoard && (
                        <div className="fixed inset-0 z-[60] bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="w-full max-w-md pixel-box bg-white p-6 animate-pop" style={{ backgroundColor: activeTheme.windowBg }}>
                                <h2 className="text-sm mb-4">CREATE BOARD</h2>
                                <form onSubmit={(e) => {
                                    e.preventDefault();
                                    const fd = new FormData(e.target);
                                    const newBoard = { id: 'b_'+Date.now(), name: fd.get('name').toUpperCase() };
                                    setBoards([...boards, newBoard]);
                                    setActiveBoardId(newBoard.id);
                                    sound.playCoin();
                                    setIsManagingBoard(false);
                                }}>
                                    <input type="text" name="name" required placeholder="BOARD NAME" maxLength="15" className="w-full pixel-box-sm p-3 text-[10px] mb-6 bg-white text-black focus:outline-none" />
                                    <div className="flex gap-3">
                                        <button type="button" onClick={() => { sound.playBlip(); setIsManagingBoard(false); }} className="flex-1 pixel-box-sm py-3 text-xs bg-gray-300 text-black active:scale-95">CANCEL</button>
                                        <button type="submit" className="flex-1 pixel-box-sm py-3 text-xs bg-blue-500 text-white active:scale-95">CREATE</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* --- MANAGE LIBRARY LIST MODAL --- */}
                    {isAddingLibCat && (
                        <div className="fixed inset-0 z-[60] bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="w-full max-w-md pixel-box bg-white p-6 animate-pop" style={{ backgroundColor: activeTheme.windowBg }}>
                                <h2 className="text-sm mb-4">CREATE LIST</h2>
                                <form onSubmit={handleAddLibCategory}>
                                    <div className="flex gap-2 mb-6">
                                        <input type="text" name="catEmoji" placeholder="📁" className="w-14 text-center pixel-box-sm p-3 text-sm bg-white text-black focus:outline-none font-sans" title="List Emoji" />
                                        <input type="text" name="catName" required placeholder="LIST NAME" maxLength="15" className="flex-1 pixel-box-sm p-3 text-[10px] bg-white text-black focus:outline-none" />
                                    </div>
                                    <div className="flex gap-3">
                                        <button type="button" onClick={() => { sound.playBlip(); setIsAddingLibCat(false); }} className="flex-1 pixel-box-sm py-3 text-xs bg-gray-300 text-black active:scale-95">CANCEL</button>
                                        <button type="submit" className="flex-1 pixel-box-sm py-3 text-xs bg-blue-500 text-white active:scale-95">CREATE</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    <Confetti trigger={confettiTrigger} />

                </div>
            );

            function TaskCard({ task, compact = false }) {
                const isOverdue = task.dueDate && task.dueDate < getTodayStr() && task.status !== 'done';
                const isDone = task.status === 'done';
                
                return (
                    <div className={`pixel-box p-3 relative group transition-opacity ${isDone ? 'opacity-50' : 'bg-white text-black'}`} style={{ backgroundColor: isDone ? activeTheme.tagBg : activeTheme.windowBg }}>
                        
                        <button 
                            onClick={() => handleDeleteTask(task.id)} 
                            className="absolute top-2 right-2 w-6 h-6 flex items-center justify-center pixel-box-sm bg-red-500 text-white text-[10px] opacity-70 hover:opacity-100 active:scale-90 z-10 transition-opacity"
                            title="Delete Quest"
                        >
                            X
                        </button>

                        <div className="flex items-start gap-3">
                            <button 
                                onClick={() => !isDone && handleToggleTaskStatus(task)}
                                disabled={isDone}
                                className={`w-6 h-6 flex-shrink-0 pixel-box-sm flex items-center justify-center text-xs mt-0.5 ${isDone ? 'bg-black text-white cursor-default' : 'bg-white active:scale-90'}`}
                            >
                                {task.status === 'doing' ? 'O' : task.status === 'done' ? 'X' : ''}
                            </button>
                            
                            <div className="flex-1 min-w-0 pr-8">
                                <p className={`text-sm mb-2 break-words leading-tight ${isDone ? 'line-through' : ''}`}>
                                    {task.text}
                                </p>
                                
                                {task.subtasks && task.subtasks.length > 0 && (
                                    <div className="mb-3 space-y-1.5 border-l-2 pl-2" style={{ borderColor: activeTheme.border }}>
                                        {task.subtasks.map((sub, idx) => (
                                            <div key={sub.id} className="flex items-center gap-2">
                                                <button
                                                    onClick={(e) => { e.stopPropagation(); !isDone && handleToggleSubtask(task.id, idx); }}
                                                    disabled={isDone}
                                                    className={`w-3.5 h-3.5 flex-shrink-0 pixel-box-sm flex items-center justify-center ${sub.done ? 'bg-green-500 text-white' : 'bg-white'} ${isDone ? 'cursor-default opacity-70' : ''}`}
                                                >
                                                    {sub.done && <span className="text-[8px] leading-none">X</span>}
                                                </button>
                                                <span className={`text-xs leading-tight ${sub.done ? 'line-through opacity-50' : ''}`}>{sub.text}</span>
                                            </div>
                                        ))}
                                    </div>
                                )}
                                
                                <div className="flex flex-wrap gap-2 items-center">
                                    <span className="bg-yellow-200 text-black px-1.5 py-0.5 pixel-box-sm text-[8px]">+50XP</span>
                                    {task.dueDate && !isDone && (
                                        <span className={`px-1.5 py-0.5 pixel-box-sm text-[8px] flex items-center gap-1 ${isOverdue ? 'bg-red-500 text-white animate-pulse' : 'bg-white text-black'}`}>
                                            📅 {task.dueDate === getTodayStr() ? 'TODAY' : task.dueDate === getTomorrowStr() ? 'TMRW' : task.dueDate}
                                        </span>
                                    )}
                                    {isDone && task.completedAt && (
                                        <span className="px-1.5 py-0.5 pixel-box-sm text-[8px] flex items-center gap-1 bg-black/10 text-inherit opacity-75">
                                            ✓ {task.completedAt}
                                        </span>
                                    )}
                                    {activeBoardId === 'all' && task.boardId !== 'general' && (
                                        <span className="px-1.5 py-0.5 pixel-box-sm text-[8px] bg-blue-200 text-black">
                                            {boards.find(b => b.id === task.boardId)?.name || 'Board'}
                                        </span>
                                    )}
                                </div>
                            </div>
                        </div>

                        {isOverdue && (
                            <div className="mt-3 pt-3 border-t-2 border-black/10 flex justify-center items-center opacity-0 group-hover:opacity-100 focus-within:opacity-100 transition-opacity">
                                <button onClick={() => handleRerollTask(task.id)} className="bg-purple-500 text-white px-3 py-1.5 pixel-box-sm text-[10px] active:scale-95 flex items-center gap-1">
                                    🎲 REROLL (5G)
                                </button>
                            </div>
                        )}
                    </div>
                );
            }

            function getTaskGroup(dateStr) {
                if (!dateStr) return 'No Date';
                if (dateStr === getTodayStr()) return 'Today';
                if (dateStr === getTomorrowStr()) return 'Tomorrow';
                if (dateStr < getTodayStr()) return 'Overdue';
                return 'Upcoming';
            }
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
