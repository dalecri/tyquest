<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TyQuest Retro</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&family=VT323&family=JetBrains+Mono:wght@400;700&family=IBM+Plex+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            overscroll-behavior-y: none;
            -webkit-tap-highlight-color: transparent;
        }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .pixel-box {
            border: 4px solid var(--app-border);
            box-shadow: 4px 4px 0px rgba(0,0,0,0.25);
            border-radius: 4px;
        }

        .pixel-box-sm {
            border: 2px solid var(--app-border);
            box-shadow: 2px 2px 0px rgba(0,0,0,0.25);
            border-radius: 2px;
        }

        .font-arcade { font-family: var(--pixel-font, 'Silkscreen'), cursive; }
        .font-sans { font-family: 'JetBrains Mono', monospace; }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
            100% { transform: translateY(0px); }
        }
        .animate-float { animation: float 3s ease-in-out infinite; }

        @keyframes pop {
            0% { transform: scale(0.9); opacity: 0; }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop { animation: pop 0.2s ease-out forwards; }

        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 24px); }
        .pt-safe { padding-top: env(safe-area-inset-top, 12px); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- AUDIO ENGINE ---
        class SoundManager {
            constructor() {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            }
            playTone(freq, type, duration, vol = 0.1) {
                if (this.ctx.state === 'suspended') this.ctx.resume();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + duration);
            }
            playBlip(freq = 400) { this.playTone(freq, 'square', 0.1, 0.05); }
            playCoin() {
                this.playTone(987.77, 'square', 0.1, 0.05);
                setTimeout(() => this.playTone(1318.51, 'square', 0.3, 0.05), 100);
            }
            playMagic() {
                this.playTone(400, 'sine', 0.1, 0.05);
                setTimeout(() => this.playTone(600, 'sine', 0.1, 0.05), 50);
                setTimeout(() => this.playTone(800, 'sine', 0.2, 0.05), 100);
            }
            playError() { this.playTone(150, 'sawtooth', 0.2, 0.05); }
        }
        const sound = new SoundManager();

        // --- CONSTANTS & THEMES ---
        const RETRO_THEMES = {
            snes16bit: {
                id: 'snes16bit', name: '16-Bit Town', isDark: false, cost: 0,
                bg: '#edd9c0', windowBg: '#fffbf0', hudBg: '#3d253b', hudText: '#fce4a6',
                border: '#1b122c', primary: '#477d61', colTodo: '#d88554', colDoing: '#4d8093', colDone: '#4b7d5f', tagBg: '#ebcfad'
            },
            sageWordnest: {
                id: 'sageWordnest', name: 'Sage Wordnest', isDark: false, cost: 50,
                bg: '#b9cc9f', windowBg: '#e6ebd8', hudBg: '#2b3b24', hudText: '#e6ebd8',
                border: '#2b3b24', primary: '#425a37', colTodo: '#a3b888', colDoing: '#92a777', colDone: '#819666', tagBg: '#c5d6af'
            },
            cyberArcade: {
                id: 'cyberArcade', name: 'Neon Arcade', isDark: true, cost: 100,
                bg: '#140c24', windowBg: '#21163a', hudBg: '#090414', hudText: '#00f0ff',
                border: '#ff007f', primary: '#00f0ff', colTodo: '#e02875', colDoing: '#8c25e2', colDone: '#00b894', tagBg: '#2f1f52'
            },
            cozyCafe: {
                id: 'cozyCafe', name: 'Cozy Cafe', isDark: false, cost: 250,
                bg: '#d7bfa6', windowBg: '#f2e8dc', hudBg: '#4a3b32', hudText: '#f2e8dc',
                border: '#332620', primary: '#8c6b5d', colTodo: '#c49a7c', colDoing: '#a87b5d', colDone: '#825b42', tagBg: '#e3d2c1'
            }
        };
        
        const APP_FONTS = {
            silkscreen: "'Silkscreen', cursive",
            vt323: "'VT323', monospace",
            jetbrains: "'JetBrains Mono', monospace",
            plex: "'IBM Plex Mono', monospace"
        };

        const SHOP_REWARDS = [
            { id: 'r1', name: 'Buy a Coffee Treat', cost: 25, icon: '☕' },
            { id: 'r2', name: '20 Min Guilt-Free Doomscroll', cost: 50, icon: '📱' },
            { id: 'r3', name: 'Get Out of a Chore Free', cost: 150, icon: '🃏' },
            { id: 'r4', name: "Husband's Back Massage Pass", cost: 200, icon: '💆‍♂️' },
            { id: 'r5', name: '1 Hour Guilt-Free Gaming', cost: 75, icon: '🎮' },
            { id: 'r6', name: 'Pajama Day (Weekend)', cost: 300, icon: '🛏️' },
            { id: 'r7', name: 'Buy Hobby Supplies ($20 Limit)', cost: 500, icon: '🎨' },
            { id: 'r8', name: 'Takeout Dinner of Choice', cost: 400, icon: '🍕' }
        ];

        // --- INDEXEDDB SETUP ---
        const DB_NAME = 'TyQuestDB';
        const STORE_NAME = 'appData';

        const initDB = () => {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, 1);
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME);
                    }
                };
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        };

        const saveToDB = async (key, data) => {
            try {
                const db = await initDB();
                const tx = db.transaction(STORE_NAME, 'readwrite');
                tx.objectStore(STORE_NAME).put(data, key);
            } catch (e) { console.error('IDB Save Error:', e); }
        };

        const loadFromDB = async (key) => {
            try {
                const db = await initDB();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(STORE_NAME, 'readonly');
                    const req = tx.objectStore(STORE_NAME).get(key);
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => reject(req.error);
                });
            } catch (e) { return null; }
        };

        // --- UTILS ---
        const getTodayStr = () => new Date().toISOString().split('T')[0];
        const getTomorrowStr = () => {
            const d = new Date();
            d.setDate(d.getDate() + 1);
            return d.toISOString().split('T')[0];
        };

        // --- MAIN APP COMPONENT ---
        function App() {
            const [isDataLoaded, setIsDataLoaded] = useState(false);
            
            // Dummy Data Initialization
            const initialTasks = [
                { id: 't1', text: 'Slay the laundry dragon', status: 'todo', boardId: 'house', dueDate: getTodayStr(), subtasks: [{id: 's1', text: 'Wash clothes', done: true}, {id: 's2', text: 'Fold and put away', done: false}] },
                { id: 't2', text: 'Visit Potion Master (Dentist)', status: 'todo', boardId: 'general', dueDate: getTomorrowStr(), subtasks: [] },
                { id: 't3', text: 'Cook HP Ration Meals for week', status: 'doing', boardId: 'house', dueDate: getTodayStr(), subtasks: [] },
                { id: 't4', text: 'Pay the troll toll (Electric bill)', status: 'done', boardId: 'general', dueDate: getTodayStr(), subtasks: [] },
                { id: 't5', text: 'Take out the recycling', status: 'done', boardId: 'house', dueDate: getTodayStr(), subtasks: [] },
                { id: 't6', text: 'File tax scrolls', status: 'todo', boardId: 'general', dueDate: '2026-08-01', subtasks: [] }, // Overdue
                { id: 't7', text: 'Buy new running shoes', status: 'todo', boardId: 'fitness', dueDate: getTomorrowStr(), subtasks: [] }
            ];

            const initialBoards = [
                { id: 'all', name: 'ALL QUESTS', icon: '⚔️' },
                { id: 'house', name: 'HOUSEKEEPING', icon: '🧹' },
                { id: 'fitness', name: 'TRAINING', icon: '🏋️' }
            ];

            const [tasks, setTasks] = useState([]);
            const [boards, setBoards] = useState([]);
            const [activeBoardId, setActiveBoardId] = useState('all');
            const [activeTab, setActiveTab] = useState('board'); // board, list, shop
            
            const [xp, setXp] = useState(0);
            const [level, setLevel] = useState(1);
            const [gold, setGold] = useState(0);
            
            const [themeKey, setThemeKey] = useState('snes16bit');
            const [unlockedThemes, setUnlockedThemes] = useState(['snes16bit']);
            const [appFont, setAppFont] = useState('silkscreen');

            const [isHeaderExpanded, setIsHeaderExpanded] = useState(false);
            const [isAddingQuest, setIsAddingQuest] = useState(false);
            const [isManagingBoard, setIsManagingBoard] = useState(false);
            const [focusTaskId, setFocusTaskId] = useState(null);

            // Level calculation
            useEffect(() => {
                setLevel(Math.floor(xp / 100) + 1);
            }, [xp]);

            // Auto Dark Mode
            useEffect(() => {
                const checkTime = () => {
                    const currentHour = new Date().getHours();
                    if (currentHour >= 20 || currentHour < 6) {
                        if (themeKey === 'snes16bit' || themeKey === 'sageWordnest') {
                            if (unlockedThemes.includes('cyberArcade')) {
                                setThemeKey('cyberArcade');
                            }
                        }
                    }
                };
                checkTime();
            }, [themeKey, unlockedThemes]);

            // Data Loading
            useEffect(() => {
                const loadData = async () => {
                    const savedTasks = await loadFromDB('tq_tasks');
                    const savedBoards = await loadFromDB('tq_boards');
                    const savedXp = await loadFromDB('tq_xp');
                    const savedGold = await loadFromDB('tq_gold');
                    const savedTheme = await loadFromDB('tq_theme');
                    const savedUnlockedThemes = await loadFromDB('tq_unlocked_themes');
                    const savedFont = await loadFromDB('tq_font');

                    if (savedTasks && savedTasks.length > 0) { setTasks(savedTasks); } else { setTasks(initialTasks); }
                    if (savedBoards && savedBoards.length > 0) { setBoards(savedBoards); } else { setBoards(initialBoards); }
                    
                    // Fix NaN checking for loaded numbers
                    if (savedXp !== null && !isNaN(parseInt(savedXp, 10))) { setXp(parseInt(savedXp, 10)); } else { setXp(0); }
                    if (savedGold !== null && !isNaN(parseInt(savedGold, 10))) { setGold(parseInt(savedGold, 10)); } else { setGold(0); }
                    
                    if (savedTheme) setThemeKey(savedTheme);
                    if (savedUnlockedThemes) setUnlockedThemes(savedUnlockedThemes);
                    if (savedFont) setAppFont(savedFont);

                    setIsDataLoaded(true);
                };
                loadData();
            }, []);

            // Data Saving
            useEffect(() => {
                if (!isDataLoaded) return;
                saveToDB('tq_tasks', tasks);
                saveToDB('tq_boards', boards);
                saveToDB('tq_xp', xp.toString());
                saveToDB('tq_gold', gold.toString());
                saveToDB('tq_theme', themeKey);
                saveToDB('tq_unlocked_themes', unlockedThemes);
                saveToDB('tq_font', appFont);
            }, [tasks, boards, xp, gold, themeKey, unlockedThemes, appFont, isDataLoaded]);

            const activeTheme = RETRO_THEMES[themeKey] || RETRO_THEMES.snes16bit;

            // --- ACTIONS ---
            const handleAddTask = (text, date, boardId, subtasksArr) => {
                const newTask = {
                    id: Date.now().toString(),
                    text,
                    status: 'todo',
                    boardId: boardId === 'all' ? 'general' : boardId,
                    dueDate: date,
                    subtasks: subtasksArr || []
                };
                setTasks([newTask, ...tasks]);
                sound.playBlip(600);
                setIsAddingQuest(false);
            };

            const handleToggleTaskStatus = (task) => {
                let nextStatus = 'doing';
                if (task.status === 'todo') nextStatus = 'doing';
                else if (task.status === 'doing') nextStatus = 'done';
                else if (task.status === 'done') nextStatus = 'todo';

                setTasks(tasks.map(t => t.id === task.id ? { ...t, status: nextStatus } : t));

                if (nextStatus === 'done') {
                    sound.playCoin();
                    setXp(prev => prev + 50);
                    setGold(prev => prev + 10);
                } else {
                    sound.playBlip(300);
                }
                
                if (focusTaskId === task.id && nextStatus === 'done') {
                    setFocusTaskId(null);
                }
            };

            const handleToggleSubtask = (taskId, subIdx) => {
                setTasks(tasks.map(t => {
                    if (t.id !== taskId) return t;
                    const newSubs = [...t.subtasks];
                    const wasDone = newSubs[subIdx].done;
                    newSubs[subIdx].done = !wasDone;
                    
                    if (!wasDone) {
                        sound.playBlip(700);
                        setXp(prev => prev + 5);
                        setGold(prev => prev + 1);
                    }
                    
                    return { ...t, subtasks: newSubs };
                }));
            };

            const handleDeleteTask = (id) => {
                sound.playError();
                setTasks(tasks.filter(t => t.id !== id));
            };

            const handleRerollTask = (id) => {
                if (gold < 5) {
                    sound.playError();
                    alert("Not enough Gold!");
                    return;
                }
                setGold(prev => prev - 5);
                sound.playMagic();
                setTasks(tasks.map(t => t.id === id ? { ...t, dueDate: getTomorrowStr() } : t));
            };

            const handleBuyReward = (cost) => {
                if (gold >= cost) {
                    setGold(prev => prev - cost);
                    sound.playCoin();
                } else {
                    sound.playError();
                }
            };

            const handleBuyTheme = (themeId, cost) => {
                if (gold >= cost) {
                    setGold(prev => prev - cost);
                    setUnlockedThemes([...unlockedThemes, themeId]);
                    setThemeKey(themeId);
                    sound.playCoin();
                } else {
                    sound.playError();
                }
            };

            const handleDeleteBoard = (boardId) => {
                if (boardId === 'all') return;
                
                // Move tasks to general
                setTasks(tasks.map(t => t.boardId === boardId ? { ...t, boardId: 'general' } : t));
                
                // Remove board
                setBoards(boards.filter(b => b.id !== boardId));
                setActiveBoardId('all');
                sound.playError();
            };

            // --- RENDER HELPERS ---
            const filteredTasks = useMemo(() => {
                if (activeBoardId === 'all') return tasks;
                return tasks.filter(t => t.boardId === activeBoardId);
            }, [tasks, activeBoardId]);

            const activeBoardObj = boards.find(b => b.id === activeBoardId);
            const oldestFocusTask = useMemo(() => {
                const active = tasks.filter(t => t.status !== 'done');
                if (active.length === 0) return null;
                return active.sort((a, b) => new Date(a.dueDate || '2099-01-01') - new Date(b.dueDate || '2099-01-01'))[0];
            }, [tasks]);

            // --- LOADING STATE ---
            if (!isDataLoaded) {
                return (
                    <div className="min-h-screen flex items-center justify-center font-arcade text-xl" style={{ backgroundColor: activeTheme.bg, color: activeTheme.border }}>
                        <div className="animate-pulse">LOADING SAVE FILE...</div>
                    </div>
                );
            }

            // --- CSS VARIABLES ---
            const appStyle = {
                backgroundColor: activeTheme.bg,
                color: activeTheme.border,
                '--app-bg': activeTheme.bg,
                '--app-border': activeTheme.border,
                '--pixel-font': APP_FONTS[appFont] || APP_FONTS.silkscreen
            };

            return (
                <div className="min-h-screen h-screen flex flex-col overflow-hidden relative" style={appStyle}>
                    
                    {/* --- HEADER --- */}
                    <header className="flex-shrink-0 z-20 transition-all duration-300" style={{ backgroundColor: activeTheme.hudBg, color: activeTheme.hudText, borderBottom: `4px solid ${activeTheme.border}` }}>
                        {/* Expandable Stats Drawer */}
                        {isHeaderExpanded && (
                            <div className="px-4 py-3 border-b-4 bg-black/10" style={{ borderColor: activeTheme.border }}>
                                <div className="flex justify-between items-end mb-2">
                                    <div>
                                        <p className="font-arcade text-[10px] opacity-70">HERO RANK</p>
                                        <p className="font-arcade text-lg">LVL {level} TYLER</p>
                                    </div>
                                    <div className="text-right">
                                        <p className="font-arcade text-[10px] text-yellow-400">XP TO NEXT LVL</p>
                                        <p className="font-arcade text-sm">{xp % 100} / 100</p>
                                    </div>
                                </div>
                                <div className="w-full h-3 pixel-box bg-black/30 p-0.5">
                                    <div className="h-full bg-green-400 transition-all duration-500" style={{ width: `${Math.max(5, xp % 100)}%` }}></div>
                                </div>
                            </div>
                        )}

                        {/* Main Top Bar */}
                        <div className="px-4 py-3 flex justify-between items-center pt-safe">
                            <div className="flex items-center gap-3">
                                <button onClick={() => { sound.playBlip(); setIsHeaderExpanded(!isHeaderExpanded); }} className="active:scale-95 transition-transform">
                                    <img src={`https://api.dicebear.com/7.x/pixel-art/svg?seed=Tyler${level}`} alt="Avatar" className="w-10 h-10 pixel-box bg-white" style={{ borderColor: activeTheme.hudText }} />
                                </button>
                                <div>
                                    <h1 className="font-arcade text-sm leading-tight">TYLER</h1>
                                    <p className="font-arcade text-[10px] opacity-80">LVL {level}</p>
                                </div>
                            </div>

                            <div className="flex items-center gap-2">
                                <div className="pixel-box-sm bg-black/30 px-2 py-1 flex items-center gap-1 h-10">
                                    <span className="text-yellow-400 text-sm">🪙</span>
                                    <span className="font-arcade text-xs text-yellow-400">{Number.isNaN(gold) ? 0 : gold}</span>
                                </div>
                                <div className="flex gap-1 h-10">
                                    {oldestFocusTask && (
                                        <button onClick={() => { sound.playMagic(); setFocusTaskId(oldestFocusTask.id); }} className="w-10 h-10 pixel-box bg-red-900 border-red-500 flex items-center justify-center text-lg active:scale-95 animate-pulse" title="Focus Boss">
                                            💀
                                        </button>
                                    )}
                                    <button onClick={() => { sound.playBlip(); setActiveTab('board'); }} className={`w-10 h-10 pixel-box flex items-center justify-center text-lg active:scale-95 ${activeTab === 'board' ? 'bg-white/20' : 'bg-black/20'}`} style={{ borderColor: activeTheme.hudText }}>⚔️</button>
                                    <button onClick={() => { sound.playBlip(); setActiveTab('list'); }} className={`w-10 h-10 pixel-box flex items-center justify-center text-lg active:scale-95 ${activeTab === 'list' ? 'bg-white/20' : 'bg-black/20'}`} style={{ borderColor: activeTheme.hudText }}>📝</button>
                                    <button onClick={() => { sound.playBlip(); setActiveTab('shop'); }} className={`w-10 h-10 pixel-box flex items-center justify-center text-lg active:scale-95 ${activeTab === 'shop' ? 'bg-white/20' : 'bg-black/20'}`} style={{ borderColor: activeTheme.hudText }}>🏪</button>
                                </div>
                            </div>
                        </div>

                        {/* Board Tabs */}
                        {(activeTab === 'board' || activeTab === 'list') && (
                            <div className="flex overflow-x-auto hide-scrollbar px-2 py-2 gap-2 bg-black/20 items-center">
                                {boards.map(b => (
                                    <div key={b.id} className="flex items-center">
                                        <button 
                                            onClick={() => { sound.playBlip(); setActiveBoardId(b.id); }}
                                            className={`px-3 py-2 pixel-box-sm font-arcade text-[10px] whitespace-nowrap active:scale-95 flex items-center gap-1 ${activeBoardId === b.id ? 'bg-white text-black' : 'bg-black/40 text-white'}`}
                                            style={{ borderColor: activeTheme.hudText }}
                                        >
                                            <span>{b.icon}</span> {b.name}
                                        </button>
                                        {b.id !== 'all' && activeBoardId === b.id && (
                                            <button 
                                                onClick={() => handleDeleteBoard(b.id)}
                                                className="ml-1 p-2 text-red-500 hover:bg-red-500/20 rounded pixel-box-sm border-transparent active:scale-90"
                                                title="Delete Board"
                                            >
                                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                                            </button>
                                        )}
                                    </div>
                                ))}
                                <button 
                                    onClick={() => { sound.playBlip(); setIsManagingBoard(true); }}
                                    className="px-3 py-2 pixel-box-sm font-arcade text-[10px] whitespace-nowrap bg-black/40 text-white active:scale-95"
                                    style={{ borderColor: activeTheme.hudText }}
                                >
                                    + NEW BOARD
                                </button>
                            </div>
                        )}
                    </header>

                    {/* --- MAIN CONTENT AREA --- */}
                    <main className="flex-1 overflow-hidden relative flex flex-col min-h-0 h-full">
                        
                        {/* TAB: KANBAN BOARD */}
                        {activeTab === 'board' && (
                            <div className="flex-1 overflow-x-auto snap-x snap-mandatory hide-scrollbar p-4 flex gap-4 items-stretch h-full">
                                {['todo', 'doing', 'done'].map(colId => {
                                    const colTasks = filteredTasks.filter(t => t.status === colId);
                                    const colLabel = colId === 'todo' 
                                        ? (activeBoardId !== 'all' ? `${activeBoardObj.icon} ${activeBoardObj.name}` : 'QUEST LOG')
                                        : colId === 'doing' ? 'IN BATTLE' : 'VICTORY';
                                    const colColor = activeTheme[`col${colId.charAt(0).toUpperCase() + colId.slice(1)}`];

                                    return (
                                        <div key={colId} className="w-[88vw] max-w-[360px] h-full flex-shrink-0 snap-center flex flex-col pixel-box relative" style={{ backgroundColor: colColor }}>
                                            <div className="p-3 border-b-4 border-black/50 bg-black/20 flex items-center justify-between text-white font-arcade text-xs sticky top-0 z-10 backdrop-blur-sm">
                                                <span className="truncate pr-2">{colLabel} <span className="opacity-50 text-[10px]">({colTasks.length})</span></span>
                                                {colId === 'todo' && (
                                                    <button onClick={() => { sound.playBlip(); setIsAddingQuest(true); }} className="bg-yellow-400 text-black px-2 py-1 pixel-box-sm active:scale-90 flex-shrink-0">
                                                        + ADD
                                                    </button>
                                                )}
                                            </div>
                                            <div className="p-3 overflow-y-auto hide-scrollbar flex-1 flex flex-col gap-3 pb-safe">
                                                {colTasks.length === 0 && (
                                                    <div className="text-center opacity-50 font-arcade text-[10px] py-8 text-black">
                                                        {colId === 'todo' ? 'CLEAR!\n+ Add a task' : 'NO ACTIVE QUESTS'}
                                                    </div>
                                                )}
                                                {colTasks.map(task => <TaskCard key={task.id} task={task} />)}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        )}

                        {/* TAB: LIST VIEW */}
                        {activeTab === 'list' && (
                            <div className="flex-1 overflow-y-auto p-4 pb-safe hide-scrollbar bg-black/5 h-full">
                                <div className="max-w-[500px] mx-auto pixel-box bg-white/50 p-4" style={{ backgroundColor: activeTheme.windowBg }}>
                                    <div className="flex justify-between items-center mb-6 border-b-4 pb-2" style={{ borderColor: activeTheme.border }}>
                                        <h2 className="font-arcade text-sm">{activeBoardId !== 'all' ? `${activeBoardObj.icon} ${activeBoardObj.name}` : 'ALL QUESTS'}</h2>
                                        <button onClick={() => { sound.playBlip(); setIsAddingQuest(true); }} className="bg-yellow-400 text-black px-2 py-1 pixel-box-sm font-arcade text-[10px] active:scale-90">
                                            + ADD QUEST
                                        </button>
                                    </div>
                                    
                                    {['Overdue', 'Today', 'Tomorrow', 'Upcoming', 'No Date'].map(group => {
                                        const groupedTasks = filteredTasks.filter(t => t.status !== 'done' && getTaskGroup(t.dueDate) === group);
                                        if (groupedTasks.length === 0) return null;
                                        
                                        return (
                                            <div key={group} className="mb-6">
                                                <h3 className="font-arcade text-[10px] opacity-60 mb-2 uppercase tracking-widest flex items-center gap-2">
                                                    <span className="w-full h-0.5 bg-black/20 block"></span>
                                                    <span className="whitespace-nowrap">{group}</span>
                                                    <span className="w-full h-0.5 bg-black/20 block"></span>
                                                </h3>
                                                <div className="flex flex-col gap-2">
                                                    {groupedTasks.map(t => <TaskCard key={t.id} task={t} compact={true} />)}
                                                </div>
                                            </div>
                                        );
                                    })}

                                    {filteredTasks.filter(t => t.status === 'done').length > 0 && (
                                        <div className="mt-8 opacity-60">
                                            <h3 className="font-arcade text-[10px] mb-2 uppercase text-center">VICTORY (DONE)</h3>
                                            <div className="flex flex-col gap-2">
                                                {filteredTasks.filter(t => t.status === 'done').map(t => <TaskCard key={t.id} task={t} compact={true} />)}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* TAB: TAVERN (SHOP) */}
                        {activeTab === 'shop' && (
                            <div className="flex-1 overflow-y-auto p-4 pb-safe hide-scrollbar tavern-rewards h-full">
                                <style>{`
                                    .tavern-rewards .pixel-box-sm {
                                        background-color: ${activeTheme.bg} !important;
                                        border-color: ${activeTheme.border} !important;
                                        color: ${activeTheme.border} !important;
                                    }
                                    .tavern-rewards button.buy-btn {
                                        background-color: ${activeTheme.primary} !important;
                                        color: ${activeTheme.bg} !important;
                                    }
                                `}</style>

                                <div className="max-w-[500px] mx-auto">
                                    <div className="text-center mb-6 p-4 pixel-box bg-white/20" style={{ borderColor: activeTheme.border }}>
                                        <h2 className="font-arcade text-lg mb-2">THE TAVERN 🏪</h2>
                                        <p className="font-arcade text-[10px] mb-4">SPEND HARD EARNED GOLD!</p>
                                        <div className="inline-block pixel-box-sm bg-black text-yellow-400 px-4 py-2 font-arcade text-xl">
                                            🪙 {Number.isNaN(gold) ? 0 : gold} G
                                        </div>
                                    </div>

                                    {/* Rewards Section */}
                                    <div className="pixel-box-sm p-4 mb-6" style={{ backgroundColor: activeTheme.windowBg }}>
                                        <h3 className="font-arcade text-[12px] mb-4" style={{ color: activeTheme.primary }}>REAL LIFE REWARDS</h3>
                                        <div className="grid grid-cols-1 gap-3">
                                            {SHOP_REWARDS.map(r => (
                                                <div key={r.id} className="flex justify-between items-center p-3 pixel-box-sm bg-white/50">
                                                    <div className="flex items-center gap-3">
                                                        <span className="text-xl">{r.icon}</span>
                                                        <span className="font-arcade text-[10px] max-w-[150px] leading-tight">{r.name}</span>
                                                    </div>
                                                    <button 
                                                        onClick={() => handleBuyReward(r.cost)}
                                                        className={`buy-btn pixel-box-sm px-3 py-2 font-arcade text-[10px] active:scale-90 flex-shrink-0 ${gold >= r.cost ? '' : 'opacity-50'}`}
                                                    >
                                                        {r.cost}G
                                                    </button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    {/* Font Settings */}
                                    <div className="pixel-box-sm p-4 mb-6" style={{ backgroundColor: activeTheme.windowBg }}>
                                        <h3 className="font-arcade text-[12px] mb-4" style={{ color: activeTheme.primary }}>🔤 ACTIVE FONT</h3>
                                        <select 
                                            value={appFont} 
                                            onChange={(e) => { sound.playBlip(); setAppFont(e.target.value); }}
                                            className="w-full pixel-box-sm p-3 font-arcade text-[10px] focus:outline-none bg-white"
                                        >
                                            <option value="silkscreen">SILKSCREEN</option>
                                            <option value="vt323">VT323 (Terminal)</option>
                                            <option value="jetbrains">JETBRAINS MONO</option>
                                            <option value="plex">IBM PLEX MONO</option>
                                        </select>
                                    </div>

                                    {/* Themes Section */}
                                    <div className="pixel-box-sm p-4 mb-6" style={{ backgroundColor: activeTheme.windowBg }}>
                                        <h3 className="font-arcade text-[12px] mb-4" style={{ color: activeTheme.primary }}>🎨 UNLOCK THEMES</h3>
                                        <div className="grid grid-cols-1 gap-3">
                                            {Object.values(RETRO_THEMES).map(t => {
                                                const isUnlocked = unlockedThemes.includes(t.id);
                                                const isActive = themeKey === t.id;
                                                return (
                                                    <div key={t.id} className="flex justify-between items-center p-3 pixel-box-sm bg-white/50">
                                                        <div className="flex items-center gap-3">
                                                            <div className="w-6 h-6 pixel-box-sm flex-shrink-0" style={{ backgroundColor: t.bg, borderColor: t.border }}></div>
                                                            <span className="font-arcade text-[10px]">{t.name}</span>
                                                        </div>
                                                        {isUnlocked ? (
                                                            <button 
                                                                onClick={() => { sound.playBlip(); setThemeKey(t.id); }}
                                                                className={`pixel-box-sm px-3 py-2 font-arcade text-[10px] active:scale-90 ${isActive ? 'bg-green-500 text-white' : 'bg-gray-200 text-black'}`}
                                                            >
                                                                {isActive ? 'ACTIVE' : 'EQUIP'}
                                                            </button>
                                                        ) : (
                                                            <button 
                                                                onClick={() => handleBuyTheme(t.id, t.cost)}
                                                                className={`buy-btn pixel-box-sm px-3 py-2 font-arcade text-[10px] active:scale-90 flex-shrink-0 ${gold >= t.cost ? '' : 'opacity-50'}`}
                                                            >
                                                                {t.cost}G
                                                            </button>
                                                        )}
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>

                                </div>
                            </div>
                        )}
                        
                    </main>

                    {/* --- ABSOLUTE BOSS FIGHT MODE --- */}
                    {focusTaskId && (
                        <div className="fixed inset-0 z-[100] flex flex-col items-center justify-center bg-black/95 p-4 sm:p-6 font-arcade text-white overflow-hidden">
                            <style>{`
                                @keyframes shake { 0% { transform: translate(1px, 1px) rotate(0deg); } 10% { transform: translate(-1px, -2px) rotate(-1deg); } 20% { transform: translate(-3px, 0px) rotate(1deg); } 30% { transform: translate(3px, 2px) rotate(0deg); } 40% { transform: translate(1px, -1px) rotate(1deg); } 50% { transform: translate(-1px, 2px) rotate(-1deg); } 60% { transform: translate(-3px, 1px) rotate(0deg); } 70% { transform: translate(3px, 1px) rotate(-1deg); } 80% { transform: translate(-1px, -1px) rotate(1deg); } 90% { transform: translate(1px, 2px) rotate(0deg); } 100% { transform: translate(1px, -2px) rotate(-1deg); } }
                                .boss-shake { animation: shake 0.5s; animation-iteration-count: infinite; }
                                .scanlines { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06)); background-size: 100% 4px, 3px 100%; pointer-events: none; z-index: 10; }
                            `}</style>
                            <div className="scanlines"></div>
                            
                            <div className="relative z-20 w-full max-w-sm flex flex-col items-center text-center">
                                <h2 className="text-red-500 text-lg sm:text-xl mb-8 animate-pulse">WARNING! ENEMY APPROACHING</h2>
                                
                                {tasks.find(t => t.id === focusTaskId) && (
                                    <div className="boss-shake pixel-box bg-red-900 border-red-500 p-6 sm:p-8 mb-8 w-full">
                                        <div className="text-5xl mb-6">👾</div>
                                        <p className="text-sm leading-loose mb-6 break-words">{tasks.find(t => t.id === focusTaskId).text}</p>
                                        
                                        <div className="flex gap-4 mt-6">
                                            <button 
                                                onClick={() => handleToggleTaskStatus(tasks.find(t => t.id === focusTaskId))}
                                                className="flex-1 bg-red-500 text-white pixel-box-sm py-4 active:bg-white active:text-red-500 text-xs"
                                            >
                                                ATTACK (COMPLETE)
                                            </button>
                                            <button 
                                                onClick={() => { sound.playError(); setFocusTaskId(null); }}
                                                className="flex-1 bg-gray-700 text-white pixel-box-sm py-4 active:bg-gray-500 text-xs"
                                            >
                                                FLEE
                                            </button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* --- ADD QUEST MODAL --- */}
                    {isAddingQuest && (
                        <div className="fixed inset-0 z-[60] bg-black/60 backdrop-blur-sm flex items-end sm:items-center justify-center p-4">
                            <div className="w-full max-w-md pixel-box bg-white p-6 animate-pop pb-safe max-h-[90vh] overflow-y-auto hide-scrollbar" style={{ backgroundColor: activeTheme.windowBg }}>
                                <h2 className="font-arcade text-sm mb-4">NEW QUEST</h2>
                                <form onSubmit={(e) => {
                                    e.preventDefault();
                                    const fd = new FormData(e.target);
                                    
                                    const subs = [];
                                    if(fd.get('sub1').trim()) subs.push({id: 's1_'+Date.now(), text: fd.get('sub1').trim(), done: false});
                                    if(fd.get('sub2').trim()) subs.push({id: 's2_'+Date.now(), text: fd.get('sub2').trim(), done: false});
                                    if(fd.get('sub3').trim()) subs.push({id: 's3_'+Date.now(), text: fd.get('sub3').trim(), done: false});

                                    handleAddTask(fd.get('text'), fd.get('date'), fd.get('boardId'), subs);
                                }}>
                                    <textarea 
                                        name="text" required autoFocus
                                        placeholder="What needs doing?"
                                        className="w-full pixel-box-sm p-3 font-sans text-sm mb-4 min-h-[80px] bg-white text-black focus:outline-none"
                                    ></textarea>

                                    <div className="mb-4 space-y-2">
                                        <p className="font-arcade text-[8px] opacity-70">SUBTASKS (OPTIONAL)</p>
                                        <input type="text" name="sub1" placeholder="- Subtask 1" className="w-full pixel-box-sm p-2 font-sans text-xs bg-white/70 text-black focus:outline-none" />
                                        <input type="text" name="sub2" placeholder="- Subtask 2" className="w-full pixel-box-sm p-2 font-sans text-xs bg-white/70 text-black focus:outline-none" />
                                        <input type="text" name="sub3" placeholder="- Subtask 3" className="w-full pixel-box-sm p-2 font-sans text-xs bg-white/70 text-black focus:outline-none" />
                                    </div>
                                    
                                    <div className="flex gap-2 mb-4">
                                        <button type="button" onClick={(e) => { e.currentTarget.parentElement.nextElementSibling.value = getTodayStr(); }} className="flex-1 pixel-box-sm py-2 font-arcade text-[10px] bg-gray-200 text-black active:bg-yellow-400">TODAY</button>
                                        <button type="button" onClick={(e) => { e.currentTarget.parentElement.nextElementSibling.value = getTomorrowStr(); }} className="flex-1 pixel-box-sm py-2 font-arcade text-[10px] bg-gray-200 text-black active:bg-yellow-400">TMRW</button>
                                    </div>
                                    <input type="date" name="date" defaultValue={getTodayStr()} className="w-full pixel-box-sm p-3 font-arcade text-[10px] mb-4 bg-white text-black" />
                                    
                                    <select name="boardId" defaultValue={activeBoardId} className="w-full pixel-box-sm p-3 font-arcade text-[10px] mb-6 bg-white text-black">
                                        {boards.map(b => <option key={b.id} value={b.id}>{b.icon} {b.name}</option>)}
                                    </select>
                                    
                                    <div className="flex gap-3">
                                        <button type="button" onClick={() => { sound.playBlip(); setIsAddingQuest(false); }} className="flex-1 pixel-box-sm py-3 font-arcade text-xs bg-gray-300 text-black active:scale-95">CANCEL</button>
                                        <button type="submit" className="flex-1 pixel-box-sm py-3 font-arcade text-xs bg-green-500 text-white active:scale-95">SAVE</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* --- MANAGE BOARD MODAL --- */}
                    {isManagingBoard && (
                        <div className="fixed inset-0 z-[60] bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="w-full max-w-md pixel-box bg-white p-6 animate-pop" style={{ backgroundColor: activeTheme.windowBg }}>
                                <h2 className="font-arcade text-sm mb-4">CREATE BOARD</h2>
                                <form onSubmit={(e) => {
                                    e.preventDefault();
                                    const fd = new FormData(e.target);
                                    const newBoard = { id: 'b_'+Date.now(), name: fd.get('name').toUpperCase(), icon: fd.get('icon') };
                                    setBoards([...boards, newBoard]);
                                    setActiveBoardId(newBoard.id);
                                    sound.playCoin();
                                    setIsManagingBoard(false);
                                }}>
                                    <input type="text" name="name" required placeholder="BOARD NAME" maxLength="15" className="w-full pixel-box-sm p-3 font-arcade text-[10px] mb-4 bg-white text-black focus:outline-none" />
                                    <select name="icon" className="w-full pixel-box-sm p-3 font-arcade text-[12px] mb-6 bg-white text-black text-center">
                                        <option value="⚔️">⚔️ Swords</option>
                                        <option value="🧹">🧹 Broom</option>
                                        <option value="💻">💻 Laptop</option>
                                        <option value="🛒">🛒 Cart</option>
                                        <option value="🔮">🔮 Crystal</option>
                                        <option value="🏋️">🏋️ Weights</option>
                                    </select>
                                    <div className="flex gap-3">
                                        <button type="button" onClick={() => { sound.playBlip(); setIsManagingBoard(false); }} className="flex-1 pixel-box-sm py-3 font-arcade text-xs bg-gray-300 text-black active:scale-95">CANCEL</button>
                                        <button type="submit" className="flex-1 pixel-box-sm py-3 font-arcade text-xs bg-blue-500 text-white active:scale-95">CREATE</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                </div>
            );

            // Helper component for tasks
            function TaskCard({ task, compact = false }) {
                const isOverdue = task.dueDate && task.dueDate < getTodayStr() && task.status !== 'done';
                const isDone = task.status === 'done';
                
                return (
                    <div className={`pixel-box p-3 relative group transition-opacity ${isDone ? 'opacity-50' : 'bg-white text-black'}`} style={{ backgroundColor: isDone ? activeTheme.tagBg : activeTheme.windowBg }}>
                        
                        <div className="flex items-start gap-3">
                            <button 
                                onClick={() => handleToggleTaskStatus(task)}
                                className={`w-6 h-6 flex-shrink-0 pixel-box-sm flex items-center justify-center font-sans text-xs active:scale-90 mt-0.5 ${isDone ? 'bg-black text-white' : 'bg-white'}`}
                            >
                                {task.status === 'doing' ? 'O' : task.status === 'done' ? 'X' : ''}
                            </button>
                            
                            <div className="flex-1 min-w-0">
                                <p className={`font-sans text-sm mb-2 break-words leading-tight ${isDone ? 'line-through' : ''}`}>
                                    {task.text}
                                </p>
                                
                                {task.subtasks && task.subtasks.length > 0 && (
                                    <div className="mb-3 space-y-1.5 border-l-2 pl-2" style={{ borderColor: activeTheme.border }}>
                                        {task.subtasks.map((sub, idx) => (
                                            <div key={sub.id} className="flex items-center gap-2">
                                                <button
                                                    onClick={(e) => { e.stopPropagation(); handleToggleSubtask(task.id, idx); }}
                                                    className={`w-3.5 h-3.5 flex-shrink-0 pixel-box-sm flex items-center justify-center ${sub.done ? 'bg-green-500 text-white' : 'bg-white'}`}
                                                >
                                                    {sub.done && <span className="text-[8px] font-sans leading-none">X</span>}
                                                </button>
                                                <span className={`font-sans text-xs leading-tight ${sub.done ? 'line-through opacity-50' : ''}`}>{sub.text}</span>
                                            </div>
                                        ))}
                                    </div>
                                )}
                                
                                <div className="flex flex-wrap gap-2 items-center">
                                    <span className="bg-yellow-200 text-black px-1.5 py-0.5 pixel-box-sm font-arcade text-[8px]">+50XP</span>
                                    {task.dueDate && !isDone && (
                                        <span className={`px-1.5 py-0.5 pixel-box-sm font-arcade text-[8px] flex items-center gap-1 ${isOverdue ? 'bg-red-500 text-white animate-pulse' : 'bg-white text-black'}`}>
                                            📅 {task.dueDate === getTodayStr() ? 'TODAY' : task.dueDate === getTomorrowStr() ? 'TMRW' : task.dueDate}
                                        </span>
                                    )}
                                    {activeBoardId === 'all' && task.boardId !== 'general' && (
                                        <span className="px-1.5 py-0.5 pixel-box-sm font-arcade text-[8px] bg-blue-200 text-black">
                                            {boards.find(b => b.id === task.boardId)?.icon} {boards.find(b => b.id === task.boardId)?.name}
                                        </span>
                                    )}
                                </div>
                            </div>
                        </div>

                        {/* Hover/Active Actions */}
                        <div className="mt-3 pt-3 border-t-2 border-black/10 flex justify-between items-center opacity-0 group-hover:opacity-100 focus-within:opacity-100 transition-opacity">
                            {isOverdue ? (
                                <button onClick={() => handleRerollTask(task.id)} className="bg-purple-500 text-white px-2 py-1 pixel-box-sm font-arcade text-[8px] active:scale-95 flex items-center gap-1">
                                    🎲 REROLL (5G)
                                </button>
                            ) : <div></div>}
                            
                            <button onClick={() => handleDeleteTask(task.id)} className="text-red-500 active:scale-90 p-1">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                            </button>
                        </div>
                    </div>
                );
            }

            // Date Group Helper
            function getTaskGroup(dateStr) {
                if (!dateStr) return 'No Date';
                if (dateStr === getTodayStr()) return 'Today';
                if (dateStr === getTomorrowStr()) return 'Tomorrow';
                if (dateStr < getTodayStr()) return 'Overdue';
                return 'Upcoming';
            }
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
