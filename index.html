<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TyQuest - 8-Bit ADHD Quest Log & Kanban</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Silkscreen, Press Start 2P, VT323, Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&family=VT323&family=Inter:wght@500;700&display=swap" rel="stylesheet">
  
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone CDN -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --pixel-font: 'Silkscreen', cursive;
      --arcade-font: 'Press Start 2P', monospace;
      --sub-font: 'VT323', monospace;
    }

    body {
      font-family: var(--pixel-font);
      background-color: var(--app-bg, #ebdccb);
      overscroll-behavior-y: none;
      transition: background-color 0.25s steps(4, end);
      -webkit-tap-highlight-color: transparent;
      image-rendering: pixelated;
    }

    .font-pixel { font-family: var(--pixel-font); }
    .font-arcade { font-family: var(--arcade-font); }
    .font-retro { font-family: var(--sub-font); }

    /* Retro 8-bit Pixel Border Box Styles */
    .pixel-box {
      border: 4px solid #1a1528;
      box-shadow: 4px 4px 0px #1a1528;
    }

    .pixel-box-sm {
      border: 3px solid #1a1528;
      box-shadow: 3px 3px 0px #1a1528;
    }

    .pixel-btn {
      border: 3px solid #1a1528;
      box-shadow: 0 4px 0 #1a1528;
      transition: transform 0.08s ease, box-shadow 0.08s ease;
    }

    .pixel-btn:active {
      transform: translateY(4px);
      box-shadow: 0 0 0 #1a1528;
    }

    .pixel-inset {
      border: 3px solid #1a1528;
      box-shadow: inset 2px 2px 0px rgba(0,0,0,0.25), inset -2px -2px 0px rgba(255,255,255,0.4);
    }

    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Cute Retro Animations */
    @keyframes pixelBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    .animate-pixel-bounce {
      animation: pixelBounce 1s steps(2, start) infinite;
    }

    @keyframes floatXp {
      0% { transform: translate(-50%, 0) scale(0.8); opacity: 1; }
      50% { transform: translate(-50%, -30px) scale(1.1); opacity: 1; }
      100% { transform: translate(-50%, -55px) scale(1); opacity: 0; }
    }
    .animate-float-xp {
      animation: floatXp 1.2s ease-out forwards;
    }

    @keyframes scanline {
      0% { transform: translateY(-100%); }
      100% { transform: translateY(1000%); }
    }

    .pb-safe { 
      padding-bottom: env(safe-area-inset-bottom, 20px); 
    }
  </style>
</head>
<body class="select-none text-slate-900">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, Fragment } = React;

    // --- 8-Bit Web Audio Retro Sound Synthesizer (Zero External Dependencies) ---
    class RetroAudio {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
      }

      playBlip(freq = 440, type = 'square', duration = 0.08) {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(freq * 1.5, this.ctx.currentTime + duration);

          gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch(e) {}
      }

      playJump() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(160, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(520, this.ctx.currentTime + 0.15);

          gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.15);
        } catch(e) {}
      }

      playVictoryFanfare() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99]; // C E G C E G
          notes.forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.08);

            gain.gain.setValueAtTime(0.12, this.ctx.currentTime + idx * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.08 + 0.16);

            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(this.ctx.currentTime + idx * 0.08);
            osc.stop(this.ctx.currentTime + idx * 0.08 + 0.16);
          });
        } catch(e) {}
      }
    }

    const soundManager = new RetroAudio();

    const PixelIconBase = ({ children, className = "w-4 h-4" }) => (
      <svg 
        xmlns="http://www.w3.org/2000/svg" 
        viewBox="0 0 24 24" 
        fill="currentColor"
        className={className}
      >
        {children}
      </svg>
    );

    const PixelSword = (props) => (
      <PixelIconBase {...props}>
        <path d="M19 3v2h-2V3h2zm-2 2v2h-2V5h2zm-2 2v2h-2V7h2zm-2 2v2h-2V9h2zm-2 2v2H9v-2h2zm-2 2v2H7v-2h2zm-2 2v2H5v-2h2zm-2 2v2H3v-2h2zm8-2h2v2h-2v-2zm-6-6h2v2H7V9zm-4 8h2v2H3v-2zm-2 2h2v2H1v-2zm0 2h2v2H1v-2z"/>
      </PixelIconBase>
    );

    const PixelShield = (props) => (
      <PixelIconBase {...props}>
        <path d="M4 3h16v3h-2v3h-2v3h-2v4h-2v4h-2v-4H8v-4H6V9H4V6H2V3h2zm2 3v3h2v3h2v4h2v-4h2V9h2V6H6z"/>
      </PixelIconBase>
    );

    const PixelCoin = (props) => (
      <PixelIconBase {...props}>
        <path d="M7 2h10v2h4v4h2v8h-2v4h-4v2H7v-2H3v-4H1V8h2V4h4V2zm2 4v12h6V6H9zm2 2h2v8h-2V8z"/>

    );

    const PixelHeart = (props) => (
      <PixelIconBase {...props}>
        <path d="M5 3h4v2H5V3zm10 0h4v2h-4V3zM3 5h2v2H3V5zm16 0h2v2h-2V5zM1 7h2v6H1V7zm20 0h2v6h-2V7zM3 13h2v2H3v-2zm16 0h2v2h-2v-2zM5 15h2v2H5v-2zm12 0h2v2h-2v-2zM7 17h2v2H7v-2zm8 0h2v2h-2v-2zM9 19h2v2H9v-2zm4 0h2v2h-2v-2zm-2 2h2v2h-2v-2z"/>
      </PixelIconBase>
    );

    const PixelPotion = (props) => (
      <PixelIconBase {...props}>
        <path d="M10 2h4v2h-1v2h3v2h2v4h2v8h-2v2H6v-2H4v-8h2V8h2V6H7V4h3V2zm-2 8v8h8v-8H8zm2 2h4v4h-4v-4z"/>
      </PixelIconBase>
    );

    const PixelScroll = (props) => (
      <PixelIconBase {...props}>
        <path d="M4 3h14v2h2v14h-2v2H4v-2H2V5h2V3zm2 4v10h10V7H6zm2 2h6v2H8V9zm0 4h6v2H8v-2z"/>
      </PixelIconBase>
    );

    const PixelTrophy = (props) => (
      <PixelIconBase {...props}>
        <path d="M4 2h16v4h2v6h-4v4h-4v4h4v2H6v-2h4v-4H6v-4H2V6h2V2zm2 4v4h2V6H6zm10 0v4h2V6h-2zm-8 0v4h8V6H8z"/>

    const PixelPlus = (props) => (
      <PixelIconBase {...props}>
        <path d="M10 4h4v6h6v4h-6v6h-4v-6H4v-4h6V4z"/>
      </PixelIconBase>
    );

    const PixelTrash = (props) => (
      <PixelIconBase {...props}>
        <path d="M6 3h12v2h4v2H2V5h4V3zm2 4h8v12h-2V9h-2v10h-2V9H8v10H6V7h2zm0 14h8v2H8v-2z"/>
      </PixelIconBase>
    );

    const PixelConfetti = ({ active }) => {
      const canvasRef = useRef(null);

      useEffect(() => {
        if (!active) return;
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const colors = ['#f43f5e', '#3b82f6', '#10b981', '#facc15', '#a855f7', '#fb923c', '#ffffff'];
        const particles = Array.from({ length: 60 }).map(() => ({
          x: canvas.width / 2 + (Math.random() * 80 - 40),
          y: canvas.height * 0.25,
          vx: (Math.random() - 0.5) * 12,
          vy: Math.random() * -7 - 4,
          size: Math.floor(Math.random() * 8) + 6,
          color: colors[Math.floor(Math.random() * colors.length)],
          life: 1.0
        }));

        let animationFrameId;

        const render = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          let alive = false;

          particles.forEach(p => {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.35; // gravity
            p.life -= 0.018;

            if (p.life > 0) {
              alive = true;
              ctx.fillStyle = p.color;
              // Pixel-perfect square block
              ctx.fillRect(Math.floor(p.x), Math.floor(p.y), p.size, p.size);
              // Dark retro pixel shadow
              ctx.fillStyle = 'rgba(0,0,0,0.5)';
              ctx.fillRect(Math.floor(p.x + 2), Math.floor(p.y + 2), p.size, 2);
            }
          });

          if (alive) {
            animationFrameId = requestAnimationFrame(render);
          }
        };

        render();

        return () => {
          if (animationFrameId) cancelAnimationFrame(animationFrameId);
        };
      }, [active]);

      if (!active) return null;

      return (
        <canvas 
          ref={canvasRef} 
          className="fixed inset-0 pointer-events-none z-[120] w-full h-full"
        />
      );
    };

    const RETRO_THEMES = {
      snes16bit: {
        name: '16-Bit Town',
        bg: '#edd9c0',
        windowBg: '#fffbf0',
        hudBg: '#3d253b',
        hudText: '#fce4a6',
        border: '#1b122c',
        primary: '#477d61',
        primaryText: '#ffffff',
        accentGold: '#f4b41b',
        colTodo: '#d88554',
        colDoing: '#4d8093',
        colDone: '#4b7d5f',
        tagBg: '#ebcfad'
      },
      gameboy: {
        name: 'GameBoy DMG',
        bg: '#8bac0f',
        windowBg: '#9bbc0f',
        hudBg: '#0f380f',
        hudText: '#9bbc0f',
        border: '#0f380f',
        primary: '#306230',
        primaryText: '#9bbc0f',
        accentGold: '#8bac0f',
        colTodo: '#306230',
        colDoing: '#306230',
        colDone: '#0f380f',
        tagBg: '#8bac0f'
      },
      cyberArcade: {
        name: 'Neon Arcade',
        bg: '#140c24',
        windowBg: '#21163a',
        hudBg: '#090414',
        hudText: '#00f0ff',
        border: '#ff007f',
        primary: '#00f0ff',
        primaryText: '#090414',
        accentGold: '#ffe600',
        colTodo: '#e02875',
        colDoing: '#8c25e2',
        colDone: '#00b894',
        tagBg: '#2f1f52'
      }
    };

    const todayStr = new Date().toISOString().split('T')[0];
    const tomorrowDate = new Date(Date.now() + 86400000);
    const tomorrowStr = tomorrowDate.toISOString().split('T')[0];

    const INITIAL_TASKS = [
      { id: 't1', text: 'Fold armor & organize chest', status: 'todo', xp: 50, dueDate: todayStr },
      { id: 't2', text: 'Visit potion master (dentist)', status: 'todo', xp: 100, dueDate: tomorrowStr },
      { id: 't3', text: 'Cook HP ration meals for week', status: 'doing', xp: 120, dueDate: todayStr },
      { id: 't4', text: 'Pay electric crystal tax bill', status: 'done', xp: 80, dueDate: todayStr },
      { id: 't5', text: 'Clean alchemy station', status: 'done', xp: 40, dueDate: todayStr },
    ];

    const RETRO_ACHIEVEMENTS = [
      { id: 'rec_1', title: 'Novice Adventurer', desc: 'Clear 1 quest', req: 1, type: 'completed', icon: PixelSword },
      { id: 'rec_2', title: 'Dungeon Crawler', desc: 'Clear 5 quests', req: 5, type: 'completed', icon: PixelShield },
      { id: 'rec_3', title: 'Master of Grind', desc: 'Clear 15 quests', req: 15, type: 'completed', icon: PixelPotion },
      { id: 'rec_4', title: 'Dragon Slayer', desc: 'Clear 30 quests', req: 30, type: 'completed', icon: PixelTrophy },
      { id: 'rec_5', title: 'Legendary Hero', desc: 'Clear 50 quests', req: 50, type: 'completed', icon: PixelHeart },
      { id: 'cre_1', title: 'Quest Giver', desc: 'Log 10 quests', req: 10, type: 'created', icon: PixelScroll },
      { id: 'cre_2', title: 'Guildmaster', desc: 'Log 30 quests', req: 30, type: 'created', icon: PixelPlus },
      { id: 'jug_1', title: 'Multi-Caster', desc: 'Fight 3 quests in DOING', req: 3, type: 'maxDoing', icon: PixelPotion },
    ];

    function App() {
      const [tasks, setTasks] = useState(INITIAL_TASKS);
      const [xp, setXp] = useState(380);
      const [gold, setGold] = useState(250);
      const [stats, setStats] = useState({ completed: 14, created: 22, maxDoing: 3, maxTodo: 7 });
      
      const [activeTab, setActiveTab] = useState('board'); // 'board' | 'calendar' | 'achievements'
      const [isAdding, setIsAdding] = useState(false);
      const [newTaskText, setNewTaskText] = useState("");
      const [newTaskDate, setNewTaskDate] = useState("");
      
      const [themeKey, setThemeKey] = useState('snes16bit');
      const [isMuted, setIsMuted] = useState(false);
      const [showCelebration, setShowCelebration] = useState(false);
      const [floatingXp, setFloatingXp] = useState(null);
      const [currentMonth, setCurrentMonth] = useState(new Date());
      const [selectedCalDate, setSelectedCalDate] = useState(todayStr);

      const activeTheme = RETRO_THEMES[themeKey] || RETRO_THEMES.snes16bit;

      // RPG Calculations
      const level = Math.floor(xp / 200) + 1;
      const currentLevelXp = xp % 200;
      const xpPercent = Math.min(100, Math.round((currentLevelXp / 200) * 100));

      useEffect(() => {
        const savedTasks = localStorage.getItem('tyquest_retro_tasks');
        const savedXp = localStorage.getItem('tyquest_retro_xp');
        const savedGold = localStorage.getItem('tyquest_retro_gold');
        const savedTheme = localStorage.getItem('tyquest_retro_theme');

        if (savedTasks) try { setTasks(JSON.parse(savedTasks)); } catch(e) {}
        if (savedXp) setXp(parseInt(savedXp, 10));
        if (savedGold) setGold(parseInt(savedGold, 10));
        if (savedTheme && RETRO_THEMES[savedTheme]) setThemeKey(savedTheme);
      }, []);

      useEffect(() => {
        localStorage.setItem('tyquest_retro_tasks', JSON.stringify(tasks));
        localStorage.setItem('tyquest_retro_xp', xp.toString());
        localStorage.setItem('tyquest_retro_gold', gold.toString());
        localStorage.setItem('tyquest_retro_theme', themeKey);
      }, [tasks, xp, gold, themeKey]);

      const toggleSound = () => {
        soundManager.muted = !isMuted;
        setIsMuted(!isMuted);
        if (isMuted) soundManager.playBlip(600);
      };

      const handleAddTask = (e) => {
        e.preventDefault();
        if (!newTaskText.trim()) return;

        soundManager.playJump();
        const assignedDate = newTaskDate.trim() ? newTaskDate : todayStr;
        const newTask = {
          id: Date.now().toString(),
          text: newTaskText.trim(),
          status: 'todo',
          xp: 50 + Math.floor(Math.random() * 30),
          dueDate: assignedDate
        };

        const nextTasks = [newTask, ...tasks];
        setTasks(nextTasks);
        setStats(s => ({
          ...s,
          created: s.created + 1,
          maxTodo: Math.max(s.maxTodo, nextTasks.filter(t => t.status === 'todo').length)
        }));

        setNewTaskText("");
        setNewTaskDate("");
        setIsAdding(false);
      };

      const advanceTask = (task) => {
        let nextStatus = 'doing';
        if (task.status === 'todo') {
          nextStatus = 'doing';
          soundManager.playBlip(500);
        } else if (task.status === 'doing') {
          nextStatus = 'done';
          soundManager.playVictoryFanfare();
          
          // Reward XP and Gold!
          const gainXp = task.xp || 60;
          const gainGold = 25;
          setXp(x => x + gainXp);
          setGold(g => g + gainGold);
          
          setFloatingXp(`+${gainXp} XP! +${gainGold} G`);
          setShowCelebration(true);
          setTimeout(() => setFloatingXp(null), 1200);
          setTimeout(() => setShowCelebration(false), 2400);
        } else {
          nextStatus = 'todo';
          soundManager.playBlip(350);
        }

        const nextTasks = tasks.map(t => t.id === task.id ? { ...t, status: nextStatus } : t);
        setTasks(nextTasks);

        const doingCount = nextTasks.filter(t => t.status === 'doing').length;
        const todoCount = nextTasks.filter(t => t.status === 'todo').length;

        setStats(s => ({
          ...s,
          completed: nextStatus === 'done' ? s.completed + 1 : s.completed,
          maxDoing: Math.max(s.maxDoing, doingCount),
          maxTodo: Math.max(s.maxTodo, todoCount)
        }));
      };

      const deleteTask = (id) => {
        soundManager.playBlip(200, 'sawtooth');
        setTasks(tasks.filter(t => t.id !== id));
      };

      const columns = [
        { id: 'todo', label: 'QUEST LOG', subtitle: 'To Do', color: activeTheme.colTodo, badge: '📜 READY' },
        { id: 'doing', label: 'IN BATTLE', subtitle: 'Doing', color: activeTheme.colDoing, badge: '⚔️ ACTIVE' },
        { id: 'done', label: 'VICTORY!', subtitle: 'Done', color: activeTheme.colDone, badge: '🏆 CLEARED' }
      ];

      return (
        <div 
          className="min-h-screen flex flex-col overflow-hidden relative"
          style={{ 
            backgroundColor: activeTheme.bg, 
            color: activeTheme.border,
            '--app-bg': activeTheme.bg 
          }}
        >
          {/* Confetti Animation Canvas */}
          <PixelConfetti active={showCelebration} />

          <header 
            className="p-3 sm:p-4 pixel-box m-2 sm:m-4 mb-0 flex flex-col gap-2 relative z-10"
            style={{ backgroundColor: activeTheme.hudBg, color: activeTheme.hudText }}
          >
            <div className="flex justify-between items-center">
              <div className="flex items-center gap-2">
                {/* Cute Pixel Mascot */}
                <div className="w-8 h-8 rounded-none border-2 border-white/40 flex items-center justify-center bg-black/40 text-sm animate-pixel-bounce">
                  👾
                </div>
                <div>
                  <h1 className="text-sm sm:text-base font-arcade tracking-wider text-amber-300">
                    TyQuest
                  </h1>
                  <p className="text-[10px] sm:text-xs opacity-75 font-pixel">
                    LVL {level} HERO • TYLER
                  </p>
                </div>
              </div>

              {/* Gold & Sound Controls */}
              <div className="flex items-center gap-2 sm:gap-3">
                <div className="px-2 py-1 bg-black/40 border border-white/20 text-[11px] sm:text-xs flex items-center gap-1.5 font-arcade text-yellow-300">
                  <PixelCoin className="w-3.5 h-3.5 text-yellow-400" />
                  <span>{gold}G</span>
                </div>

                <button 
                  onClick={toggleSound}
                  className="p-1.5 px-2 bg-black/40 border border-white/20 text-xs font-arcade hover:bg-black/60 transition-colors"
                  title="Toggle 8-bit sound"
                >
                  {isMuted ? '🔇' : '🔊'}
                </button>

                {/* Theme Selector */}
                <select 
                  value={themeKey} 
                  onChange={(e) => { soundManager.playBlip(400); setThemeKey(e.target.value); }}
                  className="bg-black/50 border border-white/20 text-[10px] sm:text-xs px-2 py-1 font-pixel text-white focus:outline-none"
                >
                  <option value="snes16bit">16-BIT</option>
                  <option value="gameboy">GAMEBOY</option>
                  <option value="cyberArcade">NEON</option>
                </select>
              </div>
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 items-center pt-1 border-t border-white/10">
              {/* XP Gauge */}
              <div className="flex items-center gap-2 text-[10px] sm:text-xs">
                <span className="font-arcade text-cyan-300">EXP:</span>
                <div className="flex-1 h-3 bg-black/60 border border-white/30 p-0.5 overflow-hidden">
                  <div 
                    className="h-full bg-gradient-to-r from-emerald-400 to-cyan-400 transition-all duration-300"
                    style={{ width: `${xpPercent}%` }}
                  />
                </div>
                <span className="font-arcade text-[9px] opacity-80">{currentLevelXp}/200</span>
              </div>

              {/* View Switchers */}
              <div className="flex justify-end gap-1.5">
                <button
                  onClick={() => { soundManager.playBlip(500); setActiveTab('board'); }}
                  className={`px-3 py-1 text-[10px] font-arcade transition-all ${activeTab === 'board' ? 'bg-amber-400 text-black shadow-[2px_2px_0_#000]' : 'bg-black/40 text-white/70 hover:text-white'}`}
                >
                  ⚔️ BOARDS
                </button>
                <button
                  onClick={() => { soundManager.playBlip(550); setActiveTab('calendar'); }}
                  className={`px-3 py-1 text-[10px] font-arcade transition-all ${activeTab === 'calendar' ? 'bg-amber-400 text-black shadow-[2px_2px_0_#000]' : 'bg-black/40 text-white/70 hover:text-white'}`}
                >
                  📅 RADAR
                </button>
                <button
                  onClick={() => { soundManager.playBlip(600); setActiveTab('achievements'); }}
                  className={`px-3 py-1 text-[10px] font-arcade transition-all ${activeTab === 'achievements' ? 'bg-amber-400 text-black shadow-[2px_2px_0_#000]' : 'bg-black/40 text-white/70 hover:text-white'}`}
                >
                  🏆 RELICS
                </button>
              </div>
            </div>
          </header>

          <main className="flex-1 overflow-hidden relative p-2 sm:p-4">
            
            {/* --- TAB 1: RETRO KANBAN QUEST BOARD --- */}
            {activeTab === 'board' && (
              <div className="flex h-full overflow-x-auto lg:overflow-x-visible snap-x snap-mandatory hide-scrollbar lg:justify-center">
                <div className="flex lg:grid lg:grid-cols-3 gap-3 sm:gap-4 h-full min-w-max lg:min-w-0 lg:w-full lg:max-w-6xl">
                  {columns.map(col => {
                    const colTasks = tasks.filter(t => t.status === col.id);

                    return (
                      <div 
                        key={col.id}
                        className="w-[85vw] max-w-[340px] lg:w-full lg:max-w-none flex-shrink-0 flex flex-col snap-center pixel-box"
                        style={{ backgroundColor: col.color }}
                      >
                        {/* Retro Column Banner */}
                        <div className="p-3 border-b-4 border-[#1a1528] bg-black/20 flex items-center justify-between text-white font-arcade text-xs">
                          <div className="flex items-center gap-1.5">
                            <span>{col.label}</span>
                          </div>
                          <span className="px-2 py-0.5 bg-black/40 text-[10px] border border-white/20">
                            {colTasks.length}
                          </span>
                        </div>

                        {/* Quest Items Container */}
                        <div 
                          className="flex-1 overflow-y-auto hide-scrollbar p-3 space-y-2.5"
                          style={{ backgroundColor: activeTheme.windowBg }}
                        >
                          {colTasks.length === 0 ? (
                            <div className="h-40 flex flex-col items-center justify-center gap-2 text-slate-500 font-pixel text-xs text-center opacity-60">
                              <span className="text-2xl">✨</span>
                              <p>NO QUESTS ACTIVE</p>
                            </div>
                          ) : (
                            colTasks.map(task => (
                              <div 
                                key={task.id}
                                className="pixel-box-sm p-3 flex flex-col gap-2 transition-transform hover:-translate-y-0.5"
                                style={{ backgroundColor: activeTheme.tagBg }}
                              >
                                <div className="flex items-start justify-between gap-2">
                                  {/* Custom Checkbox Button */}
                                  <button
                                    onClick={() => advanceTask(task)}
                                    className="w-6 h-6 flex-shrink-0 pixel-box-sm flex items-center justify-center text-xs font-arcade transition-colors active:scale-90"
                                    style={{ 
                                      backgroundColor: task.status === 'done' ? '#10b981' : task.status === 'doing' ? '#3b82f6' : '#ffffff',
                                      color: task.status === 'done' ? '#ffffff' : '#000000'
                                    }}
                                    title="Advance quest status"
                                  >
                                    {task.status === 'done' ? '✓' : task.status === 'doing' ? '⚔' : ''}
                                  </button>

                                  <div className="flex-1 min-w-0">
                                    <p className={`text-xs font-pixel leading-snug break-words ${task.status === 'done' ? 'line-through opacity-50' : 'font-bold'}`}>
                                      {task.text}
                                    </p>
                                    <div className="flex items-center gap-2 mt-1.5 text-[10px] font-arcade">
                                      <span className="text-amber-700 bg-amber-200 px-1 py-0.5 border border-amber-800">
                                        +{task.xp || 50}XP
                                      </span>
                                      {task.dueDate && (
                                        <span className="opacity-70 font-pixel text-[11px]">
                                          📅 {task.dueDate === todayStr ? 'TODAY' : task.dueDate}
                                        </span>
                                      )}
                                    </div>
                                  </div>

                                  <button
                                    onClick={() => deleteTask(task.id)}
                                    className="opacity-40 hover:opacity-100 p-1 hover:text-red-600 transition-opacity"
                                    title="Abandon Quest"
                                  >
                                    <PixelTrash className="w-3.5 h-3.5" />
                                  </button>
                                </div>
                              </div>
                            ))
                          )}
                        </div>

                        {/* Column Footer Status */}
                        <div className="p-2 border-t-4 border-[#1a1528] bg-black/20 text-center font-arcade text-[10px] text-white/90">
                          {col.badge}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {activeTab === 'calendar' && (
              <div className="h-full overflow-y-auto p-2 sm:p-4 hide-scrollbar flex items-start justify-center">
                <div className="w-full max-w-lg pixel-box p-4" style={{ backgroundColor: activeTheme.windowBg }}>
                  <div className="flex justify-between items-center mb-4 border-b-4 border-[#1a1528] pb-2">
                    <h2 className="font-arcade text-xs sm:text-sm text-amber-800">⚔️ QUEST TIMELINE</h2>
                    <div className="flex gap-2">
                      <button 
                        onClick={() => setCurrentMonth(new Date(currentMonth.getFullYear(), currentMonth.getMonth() - 1))}
                        className="pixel-btn px-2 py-1 bg-amber-300 font-arcade text-xs"
                      >
                        ◀
                      </button>
                      <button 
                        onClick={() => setCurrentMonth(new Date(currentMonth.getFullYear(), currentMonth.getMonth() + 1))}
                        className="pixel-btn px-2 py-1 bg-amber-300 font-arcade text-xs"
                      >
                        ▶
                      </button>
                    </div>
                  </div>

                  <div className="text-center font-arcade text-xs mb-3">
                    {currentMonth.toLocaleString('default', { month: 'short' }).toUpperCase()} {currentMonth.getFullYear()}
                  </div>

                  {/* Calendar Grid */}
                  <div className="grid grid-cols-7 gap-1 text-center font-arcade text-[10px] mb-4">
                    {['MO', 'TU', 'WE', 'TH', 'FR', 'SA', 'SU'].map(d => (
                      <div key={d} className="p-1 bg-black/10 font-bold">{d}</div>
                    ))}
                    {Array.from({ length: 31 }).map((_, i) => {
                      const dayNum = i + 1;
                      const dateString = `${currentMonth.getFullYear()}-${String(currentMonth.getMonth() + 1).padStart(2, '0')}-${String(dayNum).padStart(2, '0')}`;
                      const hasTasks = tasks.some(t => t.dueDate === dateString && t.status !== 'done');
                      const isSelected = dateString === selectedCalDate;

                      return (
                        <button
                          key={dayNum}
                          onClick={() => { soundManager.playBlip(480); setSelectedCalDate(dateString); }}
                          className={`h-9 border-2 flex flex-col items-center justify-center font-pixel text-xs transition-all ${isSelected ? 'border-red-600 bg-amber-200 scale-105 font-bold' : 'border-[#1a1528] bg-white hover:bg-amber-50'}`}
                        >
                          <span>{dayNum}</span>
                          {hasTasks && <span className="text-[8px] text-red-600 leading-none">⚔️</span>}
                        </button>
                      );
                    })}
                  </div>

                  <div className="border-t-4 border-[#1a1528] pt-3">
                    <h3 className="font-arcade text-[10px] mb-2 text-slate-700">
                      QUEUED FOR {selectedCalDate}:
                    </h3>
                    <div className="space-y-1.5 max-h-40 overflow-y-auto hide-scrollbar">
                      {tasks.filter(t => t.dueDate === selectedCalDate).length === 0 ? (
                        <p className="text-xs font-pixel opacity-60 text-center py-2">NO QUEST DEADLINES TODAY</p>
                      ) : (
                        tasks.filter(t => t.dueDate === selectedCalDate).map(t => (
                          <div key={t.id} className="p-2 pixel-box-sm bg-white flex justify-between items-center text-xs font-pixel">
                            <span className={t.status === 'done' ? 'line-through opacity-50' : ''}>{t.text}</span>
                            <span className="font-arcade text-[9px] px-1.5 py-0.5 bg-black text-white">{t.status.toUpperCase()}</span>
                          </div>
                        ))
                      )}
                    </div>
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'achievements' && (
              <div className="h-full overflow-y-auto p-2 sm:p-4 hide-scrollbar max-w-5xl mx-auto">
                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                  {RETRO_ACHIEVEMENTS.map(ach => {
                    const val = stats[ach.type] || 0;
                    const unlocked = val >= ach.req;
                    const Icon = ach.icon;

                    return (
                      <div 
                        key={ach.id}
                        className={`pixel-box p-3 flex items-center gap-3 transition-all ${unlocked ? 'bg-amber-100 text-slate-900' : 'bg-slate-300 text-slate-500 opacity-60'}`}
                      >
                        <div className={`w-10 h-10 pixel-box-sm flex items-center justify-center flex-shrink-0 ${unlocked ? 'bg-amber-400' : 'bg-slate-400'}`}>
                          <Icon className="w-5 h-5 text-black" />
                        </div>
                        <div className="flex-1 min-w-0">
                          <h4 className="font-arcade text-xs text-amber-900">{ach.title}</h4>
                          <p className="font-pixel text-xs mt-0.5">{ach.desc}</p>
                        </div>
                        <div className="font-arcade text-[10px] font-bold">
                          {unlocked ? '🏆 UNLOCKED' : `${val}/${ach.req}`}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}
          </main>

          {activeTab === 'board' && (
            <button
              onClick={() => { soundManager.playJump(); setIsAdding(true); }}
              className="fixed bottom-6 right-6 w-14 h-14 pixel-btn bg-amber-400 text-black flex items-center justify-center z-40 text-xl font-bold"
              title="Add New Quest"
            >
              +
            </button>
          )}

          {/* New Quest Modal */}
          {isAdding && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4">
              <div className="w-full max-w-sm pixel-box p-5 animate-pixel-bounce" style={{ backgroundColor: activeTheme.windowBg }}>
                <h3 className="font-arcade text-xs sm:text-sm mb-4 text-amber-900 flex items-center gap-2">
                  <span>📜</span> NEW QUEST ENTRY
                </h3>

                <form onSubmit={handleAddTask} className="space-y-3">
                  <div>
                    <label className="block font-arcade text-[9px] mb-1 opacity-80">QUEST OBJECTIVE:</label>
                    <input
                      type="text"
                      autoFocus
                      value={newTaskText}
                      onChange={(e) => setNewTaskText(e.target.value)}
                      placeholder="e.g. Slay the laundry dragon..."
                      className="w-full p-2.5 pixel-box-sm bg-white font-pixel text-xs focus:outline-none"
                    />
                  </div>

                  <div>
                    <label className="block font-arcade text-[9px] mb-1 opacity-80">DEADLINE (OPTIONAL):</label>
                    <input
                      type="date"
                      value={newTaskDate}
                      onChange={(e) => setNewTaskDate(e.target.value)}
                      className="w-full p-2 pixel-box-sm bg-white font-pixel text-xs focus:outline-none"
                    />
                  </div>

                  <div className="flex justify-end gap-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setIsAdding(false)}
                      className="pixel-btn px-3 py-2 bg-slate-300 font-arcade text-[10px]"
                    >
                      CANCEL
                    </button>
                    <button
                      type="submit"
                      disabled={!newTaskText.trim()}
                      className="pixel-btn px-4 py-2 bg-emerald-400 text-black font-arcade text-[10px] disabled:opacity-50"
                    >
                      ACCEPT QUEST!
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Floating XP Reward Notification */}
          {floatingXp && (
            <div className="fixed top-24 left-1/2 z-[100] -translate-x-1/2 pixel-box bg-yellow-300 text-black px-4 py-2 font-arcade text-xs animate-float-xp whitespace-nowrap shadow-lg">
              ✨ {floatingXp}
            </div>
          )}
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
