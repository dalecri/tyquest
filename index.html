<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Optimized for Razr 2026's tall 22:9 aspect ratio -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>TyQuest - 8-Bit ADHD Quest Log & Kanban</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Silkscreen, Press Start 2P, VT323, Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&family=VT323&family=Inter:wght@500;700&display=swap" rel="stylesheet">
  
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone CDN -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --pixel-font: 'Silkscreen', cursive;
      --arcade-font: 'Press Start 2P', monospace;
      --sub-font: 'VT323', monospace;
    }

    body {
      font-family: var(--pixel-font);
      background-color: var(--app-bg, #edd9c0);
      overscroll-behavior-y: none;
      transition: background-color 0.4s ease;
      -webkit-tap-highlight-color: transparent;
      image-rendering: pixelated;
    }

    .font-pixel { font-family: var(--pixel-font); }
    .font-arcade { font-family: var(--arcade-font); }
    .font-retro { font-family: var(--sub-font); }

    /* Retro 8-bit Pixel Border Box Styles */
    .pixel-box {
      border: 4px solid #1a1528;
      box-shadow: 4px 4px 0px #1a1528;
    }

    .pixel-box-sm {
      border: 3px solid #1a1528;
      box-shadow: 3px 3px 0px #1a1528;
    }

    .pixel-btn {
      border: 3px solid #1a1528;
      box-shadow: 0 4px 0 #1a1528;
      transition: transform 0.08s ease, box-shadow 0.08s ease;
    }
    
    .pixel-btn:disabled {
        opacity: 0.5;
        box-shadow: 0 0 0 #1a1528;
        transform: translateY(4px);
    }

    .pixel-btn:not(:disabled):active {
      transform: translateY(4px);
      box-shadow: 0 0 0 #1a1528;
    }

    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Cute Retro Animations */
    @keyframes pixelBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }
    .animate-pixel-bounce {
      animation: pixelBounce 1.2s steps(2, start) infinite;
    }

    @keyframes floatXp {
      0% { transform: translate(-50%, 0) scale(0.8); opacity: 1; }
      50% { transform: translate(-50%, -25px) scale(1.1); opacity: 1; }
      100% { transform: translate(-50%, -50px) scale(1); opacity: 0; }
    }
    .animate-float-xp {
      animation: floatXp 1.2s ease-out forwards;
    }
    
    @keyframes flashDamage {
        0%, 100% { background-color: transparent; }
        50% { background-color: rgba(255, 0, 0, 0.4); }
    }
    .animate-damage {
        animation: flashDamage 0.2s steps(2, start) 3;
    }

    .pb-safe { 
      padding-bottom: env(safe-area-inset-bottom, 24px); 
    }
    .pt-safe {
      padding-top: env(safe-area-inset-top, 12px);
    }
  </style>
</head>
<body class="select-none text-slate-900">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    class RetroAudio {
      constructor() {
        this.ctx = null;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
      }

      playBlip(freq = 440, type = 'square', duration = 0.08) {
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(freq * 1.5, this.ctx.currentTime + duration);

          gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch(e) {}
      }

      playJump() {
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(160, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(520, this.ctx.currentTime + 0.15);

          gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.15);
        } catch(e) {}
      }

      playVictoryFanfare() {
        this.init();
        if (!this.ctx) return;
        try {
          const notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99];
          notes.forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.08);

            gain.gain.setValueAtTime(0.12, this.ctx.currentTime + idx * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.08 + 0.16);

            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(this.ctx.currentTime + idx * 0.08);
            osc.stop(this.ctx.currentTime + idx * 0.08 + 0.16);
          });
        } catch(e) {}
      }
      
      playMagic() {
        this.init();
        if (!this.ctx) return;
        try {
            const notes = [880, 1046.50, 1318.51, 1567.98]; // A5, C6, E6, G6
            notes.forEach((freq, idx) => {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime + (idx * 0.05));
                gain.gain.setValueAtTime(0.1, this.ctx.currentTime + (idx * 0.05));
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + (idx * 0.05) + 0.3);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(this.ctx.currentTime + (idx * 0.05));
                osc.stop(this.ctx.currentTime + (idx * 0.05) + 0.3);
            });
        } catch (e) {}
      }
      
      playHit() {
        this.init();
        if (!this.ctx) return;
        try {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(100, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.1);
        } catch(e) {}
      }
    }

    const soundManager = new RetroAudio();

    const PixelIconBase = ({ children, className = "w-4 h-4" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" className={className}>
        {children}
      </svg>
    );

    const PixelSword = (props) => (
      <PixelIconBase {...props}>
        <path d="M19 3v2h-2V3h2zm-2 2v2h-2V5h2zm-2 2v2h-2V7h2zm-2 2v2h-2V9h2zm-2 2v2H9v-2h2zm-2 2v2H7v-2h2zm-2 2v2H5v-2h2zm-2 2v2H3v-2h2zm8-2h2v2h-2v-2zm-6-6h2v2H7V9zm-4 8h2v2H3v-2zm-2 2h2v2H1v-2zm0 2h2v2H1v-2z"/>
      </PixelIconBase>
    );
    const PixelCoin = (props) => (
      <PixelIconBase {...props}>
        <path d="M7 2h10v2h4v4h2v8h-2v4h-4v2H7v-2H3v-4H1V8h2V4h4V2zm2 4v12h6V6H9zm2 2h2v8h-2V8z"/>
      </PixelIconBase>
    );
    const PixelTrash = (props) => (
      <PixelIconBase {...props}>
        <path d="M6 3h12v2h4v2H2V5h4V3zm2 4h8v12h-2V9h-2v10h-2V9H8v10H6V7h2zm0 14h8v2H8v-2z"/>
      </PixelIconBase>
    );
    const PixelSkull = (props) => (
        <PixelIconBase {...props}>
            <path d="M6 2h12v2h2v2h2v6h-2v2h-2v2h-2v2h-8v-2H6v-2H4v-2H2V6h2V4h2V2zm2 4v4h4V6H8zm6 0v4h4V6h-4zm-4 8h4v2h-4v-2z" />
        </PixelIconBase>
    );

    const RETRO_THEMES = {
      snes16bit: {
        id: 'snes16bit', name: '16-Bit Town', isDark: false, cost: 0,
        bg: '#edd9c0', windowBg: '#fffbf0', hudBg: '#3d253b', hudText: '#fce4a6',
        border: '#1b122c', primary: '#477d61', colTodo: '#d88554', colDoing: '#4d8093', colDone: '#4b7d5f', tagBg: '#ebcfad'
      },
      gameboy: {
        id: 'gameboy', name: 'GameBoy DMG', isDark: false, cost: 50,
        bg: '#8bac0f', windowBg: '#9bbc0f', hudBg: '#0f380f', hudText: '#9bbc0f',
        border: '#0f380f', primary: '#306230', colTodo: '#306230', colDoing: '#306230', colDone: '#0f380f', tagBg: '#8bac0f'
      },
      cyberArcade: {
        id: 'cyberArcade', name: 'Neon Arcade', isDark: true, cost: 100,
        bg: '#140c24', windowBg: '#21163a', hudBg: '#090414', hudText: '#00f0ff',
        border: '#ff007f', primary: '#00f0ff', colTodo: '#e02875', colDoing: '#8c25e2', colDone: '#00b894', tagBg: '#2f1f52'
      },
      vampireCastle: {
        id: 'vampireCastle', name: 'Vampire Keep', isDark: true, cost: 250,
        bg: '#1a0b12', windowBg: '#2c121e', hudBg: '#000000', hudText: '#ff4d4d',
        border: '#8a0303', primary: '#ff4d4d', colTodo: '#5c0000', colDoing: '#8a0303', colDone: '#3b0000', tagBg: '#3b0000'
      }
    };

    const now = new Date();
    const todayStr = now.toISOString().split('T')[0];
    const tomorrowDate = new Date(Date.now() + 86400000);
    const tomorrowStr = tomorrowDate.toISOString().split('T')[0];
    const yesterdayDate = new Date(Date.now() - 86400000);
    const yesterdayStr = yesterdayDate.toISOString().split('T')[0];

    const DEFAULT_BOARDS = [
      { id: 'all', name: 'All Quests', icon: '⚔️' },
      { id: 'house', name: 'Housekeeping', icon: '🧹' }
    ];

    const INITIAL_TASKS = [
      { id: 't1', text: 'Fold armor & tidy chest', status: 'todo', xp: 50, dueDate: todayStr, boardId: 'house', subQuests: [{id:'sq1', text:'Shirts', done:false}, {id:'sq2', text:'Pants', done:false}] },
      { id: 't2', text: 'Visit potion master (dentist)', status: 'todo', xp: 100, dueDate: tomorrowStr, boardId: 'all', subQuests: [] },
      { id: 't3', text: 'Cook HP ration meals for week', status: 'doing', xp: 120, dueDate: todayStr, boardId: 'house', subQuests: [] },
      { id: 't4', text: 'Pay electric crystal tax bill', status: 'todo', xp: 80, dueDate: yesterdayStr, boardId: 'all', subQuests: [] }
    ];

    const DEFAULT_SHOP_ITEMS = [
      { id: 'r1', name: '1Hr Guilt-Free Gaming', type: 'reward', cost: 150, icon: '🎮' },
      { id: 'r2', name: 'Skip a Chore Card', type: 'reward', cost: 300, icon: '🃏' },
      { id: 'r3', name: 'Wife Cooks Dinner', type: 'reward', cost: 500, icon: '🍲' },
    ];

    function App() {
      const [tasks, setTasks] = useState(INITIAL_TASKS);
      const [boards, setBoards] = useState(DEFAULT_BOARDS);
      const [activeBoardId, setActiveBoardId] = useState('all');
      
      const [xp, setXp] = useState(150);
      const [gold, setGold] = useState(400);
      
      const [activeTab, setActiveTab] = useState('board'); 
      const [isAdding, setIsAdding] = useState(false);
      const [newTaskStatus, setNewTaskStatus] = useState('todo');
      const [newTaskText, setNewTaskText] = useState("");
      const [newTaskDate, setNewTaskDate] = useState("");
      const [newTaskBoard, setNewTaskBoard] = useState("all");
      const [newSubQuests, setNewSubQuests] = useState([]);
      const [tempSubText, setTempSubText] = useState("");

      // Board creation modal state
      const [isAddingBoard, setIsAddingBoard] = useState(false);
      const [newBoardName, setNewBoardName] = useState("");
      const [newBoardIcon, setNewBoardIcon] = useState("⭐");

      // Board editing & deleting modal state
      const [editingBoard, setEditingBoard] = useState(null);
      
      const [themeKey, setThemeKey] = useState('snes16bit');
      const [unlockedThemes, setUnlockedThemes] = useState(['snes16bit']);
      
      // Mobile sliding header state
      const [isHeaderExpanded, setIsHeaderExpanded] = useState(false);
      
      const [floatingXp, setFloatingXp] = useState(null);
      const [focusEnemy, setFocusEnemy] = useState(null);
      const [focusDamage, setFocusDamage] = useState(false);

      useEffect(() => {
          const checkTime = () => {
              const currentHour = new Date().getHours();
              if (currentHour >= 20 || currentHour < 6) {
                  if (themeKey === 'snes16bit' || themeKey === 'gameboy') {
                      if (unlockedThemes.includes('cyberArcade')) {
                          setThemeKey('cyberArcade');
                      }
                  }
              }
          };
          checkTime();
          const interval = setInterval(checkTime, 3600000);
          return () => clearInterval(interval);
      }, [themeKey, unlockedThemes]);

      useEffect(() => {
        const savedTasks = localStorage.getItem('tq_tasks');
        const savedBoards = localStorage.getItem('tq_boards');
        const savedXp = localStorage.getItem('tq_xp');
        const savedGold = localStorage.getItem('tq_gold');
        const savedTheme = localStorage.getItem('tq_theme');
        const savedUnlockedThemes = localStorage.getItem('tq_unlocked_themes');

        if (savedTasks) try { setTasks(JSON.parse(savedTasks)); } catch(e) {}
        if (savedBoards) try { setBoards(JSON.parse(savedBoards)); } catch(e) {}
        if (savedXp) setXp(parseInt(savedXp, 10));
        if (savedGold) setGold(parseInt(savedGold, 10));
        if (savedTheme) setThemeKey(savedTheme);
        if (savedUnlockedThemes) try { setUnlockedThemes(JSON.parse(savedUnlockedThemes)); } catch(e) {}
      }, []);

      useEffect(() => {
        localStorage.setItem('tq_tasks', JSON.stringify(tasks));
        localStorage.setItem('tq_boards', JSON.stringify(boards));
        localStorage.setItem('tq_xp', xp.toString());
        localStorage.setItem('tq_gold', gold.toString());
        localStorage.setItem('tq_theme', themeKey);
        localStorage.setItem('tq_unlocked_themes', JSON.stringify(unlockedThemes));
      }, [tasks, boards, xp, gold, themeKey, unlockedThemes]);

      const activeTheme = RETRO_THEMES[themeKey] || RETRO_THEMES.snes16bit;
      const level = Math.floor(xp / 200) + 1;
      const currentLevelXp = xp % 200;
      const xpPercent = Math.min(100, Math.round((currentLevelXp / 200) * 100));

      const handleAddSubQuest = (e) => {
          e.preventDefault();
          if(!tempSubText.trim() || newSubQuests.length >= 3) return;
          soundManager.playBlip(700);
          setNewSubQuests([...newSubQuests, {id: Date.now().toString(), text: tempSubText.trim(), done: false}]);
          setTempSubText("");
      }

      const openAddTaskModal = (status = 'todo') => {
        soundManager.playJump();
        setNewTaskStatus(status);
        setNewTaskBoard(activeBoardId === 'all' ? 'all' : activeBoardId);
        setIsAdding(true);
      };

      const handleAddBoard = (e) => {
        e.preventDefault();
        if (!newBoardName.trim()) return;
        soundManager.playMagic();
        const newBoard = {
          id: 'b_' + Date.now(),
          name: newBoardName.trim(),
          icon: newBoardIcon.trim() || '⭐'
        };
        setBoards([...boards, newBoard]);
        setActiveBoardId(newBoard.id);
        setNewBoardName("");
        setNewBoardIcon("⭐");
        setIsAddingBoard(false);
      };

      const handleEditBoard = (e) => {
        e.preventDefault();
        if (!editingBoard || !editingBoard.name.trim()) return;
        soundManager.playMagic();
        setBoards(boards.map(b => b.id === editingBoard.id ? { ...b, name: editingBoard.name.trim(), icon: editingBoard.icon || '⭐' } : b));
        setEditingBoard(null);
      };

      const handleDeleteBoard = (boardId) => {
        if (boardId === 'all') return;
        soundManager.playBlip(200, 'sawtooth');
        setTasks(tasks.map(t => t.boardId === boardId ? { ...t, boardId: 'all' } : t));
        setBoards(boards.filter(b => b.id !== boardId));
        if (activeBoardId === boardId) {
          setActiveBoardId('all');
        }
        setEditingBoard(null);
      };

      const handleAddTask = (e) => {
        e.preventDefault();
        if (!newTaskText.trim()) return;

        soundManager.playJump();
        const assignedDate = newTaskDate.trim() ? newTaskDate : todayStr;
        const assignedBoard = newTaskBoard === 'all' && activeBoardId !== 'all' ? activeBoardId : newTaskBoard;

        const newTask = {
          id: Date.now().toString(),
          text: newTaskText.trim(),
          status: newTaskStatus || 'todo',
          xp: 50 + Math.floor(Math.random() * 30) + (newSubQuests.length * 10),
          dueDate: assignedDate,
          boardId: assignedBoard,
          subQuests: newSubQuests
        };

        setTasks([newTask, ...tasks]);
        setNewTaskText("");
        setNewTaskDate("");
        setNewSubQuests([]);
        setIsAdding(false);
      };

      const handleReroll = (taskId, e) => {
          e.stopPropagation();
          if (gold < 5) return;
          
          soundManager.playMagic();
          setGold(g => g - 5);
          
          setTasks(tasks.map(t => {
              if (t.id === taskId) {
                  return { ...t, dueDate: tomorrowStr };
              }
              return t;
          }));
          
          setFloatingXp("-5G Rerolled!");
          setTimeout(() => setFloatingXp(null), 1200);
      };

      const handleSubQuestToggle = (taskId, subQuestId, e) => {
          e.stopPropagation();
          setTasks(tasks.map(t => {
              if (t.id === taskId) {
                  const updatedSubs = t.subQuests.map(sq => {
                      if (sq.id === subQuestId) {
                          if(!sq.done) {
                              soundManager.playBlip(600, 'sine');
                              setXp(x => x + 5); 
                          }
                          return { ...sq, done: !sq.done };
                      }
                      return sq;
                  });
                  return { ...t, subQuests: updatedSubs };
              }
              return t;
          }));
      }

      const advanceTask = (task) => {
        let nextStatus = 'doing';
        if (task.status === 'todo') {
          nextStatus = 'doing';
          soundManager.playBlip(500);
        } else if (task.status === 'doing') {
          nextStatus = 'done';
          soundManager.playVictoryFanfare();
          
          const gainXp = task.xp || 60;
          const gainGold = 25 + Math.floor(Math.random() * 10);
          setXp(x => x + gainXp);
          setGold(g => g + gainGold);
          
          setFloatingXp(`+${gainXp} XP! +${gainGold} G`);
          setTimeout(() => setFloatingXp(null), 1200);
        } else {
          nextStatus = 'todo';
          soundManager.playBlip(350);
        }

        setTasks(tasks.map(t => t.id === task.id ? { ...t, status: nextStatus } : t));
      };

      const deleteTask = (id, e) => {
        e.stopPropagation();
        soundManager.playBlip(200, 'sawtooth');
        setTasks(tasks.filter(t => t.id !== id));
        if (focusEnemy && focusEnemy.id === id) setFocusEnemy(null);
      };

      const startFocusMode = () => {
          const activeTasks = tasks.filter(t => t.status !== 'done');
          if (activeTasks.length === 0) return;
          
          const sorted = [...activeTasks].sort((a, b) => {
              if (!a.dueDate) return 1;
              if (!b.dueDate) return -1;
              return new Date(a.dueDate) - new Date(b.dueDate);
          });
          
          soundManager.playJump();
          setFocusEnemy(sorted[0]);
          setActiveTab('focus');
      };

      const attackBoss = () => {
          if(!focusEnemy) return;
          
          soundManager.playHit();
          setFocusDamage(true);
          setTimeout(() => setFocusDamage(false), 200);
          
          advanceTask({...focusEnemy, status: 'doing'});
          
          setTimeout(() => {
              const remaining = tasks.filter(t => t.id !== focusEnemy.id && t.status !== 'done');
              if (remaining.length > 0) {
                  const sorted = [...remaining].sort((a, b) => new Date(a.dueDate || '2099-01-01') - new Date(b.dueDate || '2099-01-01'));
                  setFocusEnemy(sorted[0]);
              } else {
                  setFocusEnemy(null);
                  setActiveTab('board');
              }
          }, 800);
      };

      const buyItem = (item) => {
          if (gold < item.cost) {
              soundManager.playBlip(200, 'sawtooth');
              return;
          }
          
          soundManager.playMagic();
          setGold(g => g - item.cost);
          
          if (item.type === 'theme') {
              setUnlockedThemes([...unlockedThemes, item.id]);
              setThemeKey(item.id);
          } else {
              setFloatingXp(`${item.name} Purchased!`);
              setTimeout(() => setFloatingXp(null), 1500);
          }
      };

      const filteredTasks = useMemo(() => {
        if (activeBoardId === 'all') return tasks;
        return tasks.filter(t => t.boardId === activeBoardId);
      }, [tasks, activeBoardId]);

      const getDateCategory = (dateString) => {
        if (!dateString) return 'NO DATE';
        if (dateString < todayStr) return 'OVERDUE';
        if (dateString === todayStr) return 'TODAY';
        if (dateString === tomorrowStr) return 'TOMORROW';
        return 'UPCOMING';
      };

      return (
        <div 
          className="min-h-screen flex flex-col overflow-hidden relative"
          style={{ backgroundColor: activeTheme.bg, color: activeTheme.border, '--app-bg': activeTheme.bg }}
        >
          {/* SLIDING HEADER & MINIBAR */}
          <header className="sticky top-0 z-30 shadow-md transition-colors w-full flex flex-col" style={{ backgroundColor: activeTheme.hudBg, color: activeTheme.hudText }}>
            
            {/* Expanded Content Drawer */}

                    <div className="flex gap-2">
                      <button type="button" onClick={() => setEditingBoard(null)} className="pixel-btn px-4 py-2.5 bg-slate-300 font-arcade text-[10px]">CANCEL</button>
                      <button type="submit" disabled={!editingBoard.name.trim()} className="pixel-btn px-5 py-2.5 bg-emerald-400 text-black font-arcade text-[10px]">SAVE</button>
                    </div>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Add Task Modal */}
          {isAdding && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 p-4 backdrop-blur-sm">
              <div className="w-full max-w-md pixel-box p-6 animate-pixel-bounce" style={{ backgroundColor: activeTheme.windowBg }}>
                <h3 className="font-arcade text-sm mb-4 text-black">📜 NEW QUEST</h3>

                <form onSubmit={handleAddTask} className="space-y-4">
                  <div>
                    <input type="text" autoFocus value={newTaskText} onChange={(e) => setNewTaskText(e.target.value)} placeholder="Main Objective..." className="w-full p-4 pixel-box-sm bg-white font-pixel text-sm focus:outline-none" />
                  </div>
                  
                  <div className="pixel-box-sm p-3 bg-black/5">
                      <div className="font-arcade text-[10px] mb-2 opacity-70">SUB-QUESTS ({newSubQuests.length}/3)</div>
                      {newSubQuests.map((sq, i) => (
                          <div key={i} className="font-pixel text-xs bg-white border-2 border-black p-2 mb-2">• {sq.text}</div>
                      ))}
                      {newSubQuests.length < 3 && (
                          <div className="flex gap-2 mt-2">
                              <input type="text" value={tempSubText} onChange={e => setTempSubText(e.target.value)} placeholder="Add sub-task..." className="flex-1 bg-white border-2 border-black p-2 font-pixel text-xs focus:outline-none" />
                              <button onClick={handleAddSubQuest} type="button" className="bg-black text-white px-3 font-pixel text-sm border-2 border-black">+</button>
                          </div>
                      )}
                  </div>

                  <div className="flex gap-3">
                      <div className="flex-1">
                        <label className="block font-arcade text-[10px] mb-2 opacity-80">DEADLINE:</label>
                        <input type="date" value={newTaskDate} onChange={(e) => setNewTaskDate(e.target.value)} className="w-full p-3 pixel-box-sm bg-white font-pixel text-xs focus:outline-none" />
                      </div>
                      <div className="flex-1">
                        <label className="block font-arcade text-[10px] mb-2 opacity-80">BOARD:</label>
                        <select value={newTaskBoard} onChange={(e) => setNewTaskBoard(e.target.value)} className="w-full p-3 pixel-box-sm bg-white font-pixel text-xs focus:outline-none">
                          <option value="all">⭐ General</option>
                          {boards.filter(b => b.id !== 'all').map(b => <option key={b.id} value={b.id}>{b.icon} {b.name}</option>)}
                        </select>
                      </div>
                  </div>

                  <div className="flex justify-end gap-3 pt-4">
                    <button type="button" onClick={() => setIsAdding(false)} className="pixel-btn px-4 py-3 bg-slate-300 font-arcade text-[10px]">CANCEL</button>
                    <button type="submit" disabled={!newTaskText.trim()} className="pixel-btn px-5 py-3 bg-emerald-400 text-black font-arcade text-[10px]">ACCEPT!</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Floating XP Notifications */}
          {floatingXp && (
            <div className="fixed top-32 left-1/2 z-[100] -translate-x-1/2 pixel-box bg-yellow-300 text-black px-5 py-3 font-arcade text-xs animate-float-xp whitespace-nowrap shadow-xl">
              ✨ {floatingXp}
            </div>
          )}
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
