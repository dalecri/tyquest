<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TyQuest - 8-Bit ADHD Quest Log & Kanban</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Silkscreen, Press Start 2P, VT323, Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&family=VT323&family=Inter:wght@500;700&display=swap" rel="stylesheet">
  
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone CDN -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --pixel-font: 'Silkscreen', cursive;
      --arcade-font: 'Press Start 2P', monospace;
      --sub-font: 'VT323', monospace;
    }

    body {
      font-family: var(--pixel-font);
      background-color: var(--app-bg, #edd9c0);
      overscroll-behavior-y: none;
      transition: background-color 0.25s steps(4, end);
      -webkit-tap-highlight-color: transparent;
      image-rendering: pixelated;
    }

    .font-pixel { font-family: var(--pixel-font); }
    .font-arcade { font-family: var(--arcade-font); }
    .font-retro { font-family: var(--sub-font); }

    /* Retro 8-bit Pixel Border Box Styles */
    .pixel-box {
      border: 4px solid #1a1528;
      box-shadow: 4px 4px 0px #1a1528;
    }

    .pixel-box-sm {
      border: 3px solid #1a1528;
      box-shadow: 3px 3px 0px #1a1528;
    }

    .pixel-btn {
      border: 3px solid #1a1528;
      box-shadow: 0 4px 0 #1a1528;
      transition: transform 0.08s ease, box-shadow 0.08s ease;
    }

    .pixel-btn:active {
      transform: translateY(4px);
      box-shadow: 0 0 0 #1a1528;
    }

    .pixel-inset {
      border: 3px solid #1a1528;
      box-shadow: inset 2px 2px 0px rgba(0,0,0,0.25), inset -2px -2px 0px rgba(255,255,255,0.4);
    }

    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Cute Retro Animations */
    @keyframes pixelBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }
    .animate-pixel-bounce {
      animation: pixelBounce 1.2s steps(2, start) infinite;
    }

    @keyframes floatXp {
      0% { transform: translate(-50%, 0) scale(0.8); opacity: 1; }
      50% { transform: translate(-50%, -25px) scale(1.1); opacity: 1; }
      100% { transform: translate(-50%, -50px) scale(1); opacity: 0; }
    }
    .animate-float-xp {
      animation: floatXp 1.2s ease-out forwards;
    }

    .pb-safe { 
      padding-bottom: env(safe-area-inset-bottom, 20px); 
    }
  </style>
</head>
<body class="select-none text-slate-900">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    class RetroAudio {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
      }

      playBlip(freq = 440, type = 'square', duration = 0.08) {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(freq * 1.5, this.ctx.currentTime + duration);

          gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch(e) {}
      }

      playJump() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(160, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(520, this.ctx.currentTime + 0.15);

          gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.15);
        } catch(e) {}
      }

      playVictoryFanfare() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99];
          notes.forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.08);

            gain.gain.setValueAtTime(0.12, this.ctx.currentTime + idx * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.08 + 0.16);

            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(this.ctx.currentTime + idx * 0.08);
            osc.stop(this.ctx.currentTime + idx * 0.08 + 0.16);
          });
        } catch(e) {}
      }
    }

    const soundManager = new RetroAudio();

    const PixelConfetti = ({ active }) => {
      const canvasRef = useRef(null);

      useEffect(() => {
        if (!active) return;
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const colors = ['#f43f5e', '#3b82f6', '#10b981', '#facc15', '#a855f7', '#fb923c', '#ffffff'];
        const particles = Array.from({ length: 60 }).map(() => ({
          x: canvas.width / 2 + (Math.random() * 80 - 40),
          y: canvas.height * 0.25,
          vx: (Math.random() - 0.5) * 12,
          vy: Math.random() * -7 - 4,
          size: Math.floor(Math.random() * 8) + 6,
          color: colors[Math.floor(Math.random() * colors.length)],
          life: 1.0
        }));

        let animationFrameId;

        const render = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          let alive = false;

          particles.forEach(p => {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.35;
            p.life -= 0.018;

            if (p.life > 0) {
              alive = true;
              ctx.fillStyle = p.color;
              ctx.fillRect(Math.floor(p.x), Math.floor(p.y), p.size, p.size);
              ctx.fillStyle = 'rgba(0,0,0,0.5)';
              ctx.fillRect(Math.floor(p.x + 2), Math.floor(p.y + 2), p.size, 2);
            }
          });

          if (alive) {
            animationFrameId = requestAnimationFrame(render);
          }
        };

        render();

        return () => {
          if (animationFrameId) cancelAnimationFrame(animationFrameId);
        };
      }, [active]);

      if (!active) return null;

      return (
        <canvas 
          ref={canvasRef} 
          className="fixed inset-0 pointer-events-none z-[120] w-full h-full"
        />
      );
    };

    const RETRO_THEMES = {

        tagBg: '#8bac0f'

        bg: '#140c24',

        primary: '#00f0ff',

    const today = new Date();
    const todayStr = today.toISOString().split('T')[0];
    
    const yesterdayDate = new Date(Date.now() - 86400000);
    const yesterdayStr = yesterdayDate.toISOString().split('T')[0];

    const tomorrowDate = new Date(Date.now() + 86400000);
    const tomorrowStr = tomorrowDate.toISOString().split('T')[0];

    const DEFAULT_BOARDS = [
      { id: 'all', name: 'All Quests', icon: '⚔️' },
      { id: 'house', name: 'Housekeeping', icon: '🧹' },
      { id: 'side', name: 'Side Quests', icon: '🔮' }
    ];

    const INITIAL_TASKS = [
      { id: 't1', text: 'Fold armor & tidy chest', status: 'todo', xp: 50, dueDate: todayStr, boardId: 'house' },
      { id: 't2', text: 'Visit potion master (dentist)', status: 'todo', xp: 100, dueDate: tomorrowStr, boardId: 'side' },
      { id: 't3', text: 'Cook HP ration meals for week', status: 'doing', xp: 120, dueDate: todayStr, boardId: 'house' },
      { id: 't4', text: 'Pay electric crystal tax bill', status: 'todo', xp: 80, dueDate: yesterdayStr, boardId: 'all' },
      { id: 't5', text: 'Scrub alchemy station counters', status: 'done', xp: 40, dueDate: yesterdayStr, boardId: 'house' },
      { id: 't6', text: 'Defeat laundry goblin mountain', status: 'todo', xp: 60, dueDate: todayStr, boardId: 'house' }
    ];

    const RETRO_ACHIEVEMENTS = [
      { id: 'rec_1', title: 'Novice Adventurer', desc: 'Clear 1 quest', req: 1, type: 'completed', icon: PixelSword },
      { id: 'rec_2', title: 'Dungeon Crawler', desc: 'Clear 5 quests', req: 5, type: 'completed', icon: PixelShield },
      { id: 'rec_3', title: 'Master of Grind', desc: 'Clear 15 quests', req: 15, type: 'completed', icon: PixelPotion },
      { id: 'rec_4', title: 'Dragon Slayer', desc: 'Clear 30 quests', req: 30, type: 'completed', icon: PixelTrophy },
      { id: 'rec_5', title: 'Legendary Hero', desc: 'Clear 50 quests', req: 50, type: 'completed', icon: PixelHeart },
      { id: 'cre_1', title: 'Quest Giver', desc: 'Log 10 quests', req: 10, type: 'created', icon: PixelScroll },
      { id: 'cre_2', title: 'Guildmaster', desc: 'Log 30 quests', req: 30, type: 'created', icon: PixelPlus },
      { id: 'jug_1', title: 'Multi-Caster', desc: 'Fight 3 quests in DOING', req: 3, type: 'maxDoing', icon: PixelPotion },
    ];

    function App() {
      const [tasks, setTasks] = useState(INITIAL_TASKS);
      const [boards, setBoards] = useState(DEFAULT_BOARDS);
      const [activeBoardId, setActiveBoardId] = useState('all');
      
      const [xp, setXp] = useState(380);
      const [gold, setGold] = useState(250);
      const [stats, setStats] = useState({ completed: 14, created: 22, maxDoing: 3, maxTodo: 7 });
      
      const [activeTab, setActiveTab] = useState('board'); // 'board' | 'list' | 'calendar' | 'achievements'
      const [isAdding, setIsAdding] = useState(false);
      const [newTaskText, setNewTaskText] = useState("");
      const [newTaskDate, setNewTaskDate] = useState("");
      const [newTaskBoard, setNewTaskBoard] = useState("all");

      const [isCreatingBoard, setIsCreatingBoard] = useState(false);
      const [newBoardName, setNewBoardName] = useState("");
      
      const [themeKey, setThemeKey] = useState('snes16bit');
      const [isMuted, setIsMuted] = useState(false);
      const [isSettingsOpen, setIsSettingsOpen] = useState(false);
      const [showCelebration, setShowCelebration] = useState(false);
      const [floatingXp, setFloatingXp] = useState(null);
      const [currentMonth, setCurrentMonth] = useState(new Date());
      const [selectedCalDate, setSelectedCalDate] = useState(todayStr);

      const activeTheme = RETRO_THEMES[themeKey] || RETRO_THEMES.snes16bit;

      const level = Math.floor(xp / 200) + 1;
      const currentLevelXp = xp % 200;
      const xpPercent = Math.min(100, Math.round((currentLevelXp / 200) * 100));

      useEffect(() => {
        const savedTasks = localStorage.getItem('tyquest_retro_tasks_v2');
        const savedBoards = localStorage.getItem('tyquest_retro_boards_v2');
        const savedXp = localStorage.getItem('tyquest_retro_xp_v2');
        const savedGold = localStorage.getItem('tyquest_retro_gold_v2');
        const savedTheme = localStorage.getItem('tyquest_retro_theme_v2');

        if (savedTasks) try { setTasks(JSON.parse(savedTasks)); } catch(e) {}
        if (savedBoards) try { setBoards(JSON.parse(savedBoards)); } catch(e) {}
        if (savedXp) setXp(parseInt(savedXp, 10));
        if (savedGold) setGold(parseInt(savedGold, 10));
        if (savedTheme && RETRO_THEMES[savedTheme]) setThemeKey(savedTheme);
      }, []);

      useEffect(() => {
        localStorage.setItem('tyquest_retro_tasks_v2', JSON.stringify(tasks));
        localStorage.setItem('tyquest_retro_boards_v2', JSON.stringify(boards));
        localStorage.setItem('tyquest_retro_xp_v2', xp.toString());
        localStorage.setItem('tyquest_retro_gold_v2', gold.toString());
        localStorage.setItem('tyquest_retro_theme_v2', themeKey);
      }, [tasks, boards, xp, gold, themeKey]);

      const toggleSound = () => {
        soundManager.muted = !isMuted;
        setIsMuted(!isMuted);
        if (isMuted) soundManager.playBlip(600);
      };

      const handleAddTask = (e) => {
        e.preventDefault();
        if (!newTaskText.trim()) return;

        soundManager.playJump();
        const assignedDate = newTaskDate.trim() ? newTaskDate : todayStr;
        const assignedBoard = newTaskBoard === 'all' && activeBoardId !== 'all' ? activeBoardId : newTaskBoard;

        const newTask = {
          id: Date.now().toString(),
          text: newTaskText.trim(),
          status: 'todo',
          xp: 50 + Math.floor(Math.random() * 30),
          dueDate: assignedDate,
          boardId: assignedBoard
        };

        const nextTasks = [newTask, ...tasks];
        setTasks(nextTasks);
        setStats(s => ({
          ...s,
          created: s.created + 1,
          maxTodo: Math.max(s.maxTodo, nextTasks.filter(t => t.status === 'todo').length)
        }));

        setNewTaskText("");
        setNewTaskDate("");
        setIsAdding(false);
      };

      const handleCreateBoard = (e) => {
        e.preventDefault();
        if (!newBoardName.trim()) return;
        soundManager.playJump();
        const newBoard = {
          id: 'b_' + Date.now().toString(),
          name: newBoardName.trim(),
          icon: '📜'
        };
        const updatedBoards = [...boards, newBoard];
        setBoards(updatedBoards);
        setActiveBoardId(newBoard.id);
        setNewBoardName("");
        setIsCreatingBoard(false);
      };

      const advanceTask = (task) => {
        let nextStatus = 'doing';
        if (task.status === 'todo') {
          nextStatus = 'doing';
          soundManager.playBlip(500);
        } else if (task.status === 'doing') {
          nextStatus = 'done';
          soundManager.playVictoryFanfare();
          
          const gainXp = task.xp || 60;
          const gainGold = 25;
          setXp(x => x + gainXp);
          setGold(g => g + gainGold);
          
          setFloatingXp(`+${gainXp} XP! +${gainGold} G`);
          setShowCelebration(true);
          setTimeout(() => setFloatingXp(null), 1200);
          setTimeout(() => setShowCelebration(false), 2400);
        } else {
          nextStatus = 'todo';
          soundManager.playBlip(350);
        }

        const nextTasks = tasks.map(t => t.id === task.id ? { ...t, status: nextStatus } : t);
        setTasks(nextTasks);

        const doingCount = nextTasks.filter(t => t.status === 'doing').length;
        const todoCount = nextTasks.filter(t => t.status === 'todo').length;

        setStats(s => ({
          ...s,
          completed: nextStatus === 'done' ? s.completed + 1 : s.completed,
          maxDoing: Math.max(s.maxDoing, doingCount),
          maxTodo: Math.max(s.maxTodo, todoCount)
        }));
      };

      const deleteTask = (id) => {
        soundManager.playBlip(200, 'sawtooth');
        setTasks(tasks.filter(t => t.id !== id));
      };

      const filteredTasks = useMemo(() => {
        if (activeBoardId === 'all') return tasks;
        return tasks.filter(t => t.boardId === activeBoardId || t.boardId === 'all');
      }, [tasks, activeBoardId]);

      const getDateCategory = (dateString) => {
        if (!dateString) return 'NO DATE';
        if (dateString < todayStr) return 'OVERDUE';
        if (dateString === todayStr) return 'TODAY';
        if (dateString === tomorrowStr) return 'TOMORROW';
        return 'UPCOMING';
      };

      const groupTasksByDate = (taskList) => {
        const categories = {
          'OVERDUE': [],
          'TODAY': [],
          'TOMORROW': [],
          'UPCOMING': [],
          'NO DATE': []
        };

        taskList.forEach(task => {
          const cat = getDateCategory(task.dueDate);
          if (categories[cat]) {
            categories[cat].push(task);
          } else {
            categories['UPCOMING'].push(task);
          }
        });

        return categories;
      };

      const columns = [
        { id: 'todo', label: 'QUEST LOG', subtitle: 'To Do', color: activeTheme.colTodo, badge: '📜 READY' },
        { id: 'doing', label: 'IN BATTLE', subtitle: 'Doing', color: activeTheme.colDoing, badge: '⚔️ ACTIVE' },
        { id: 'done', label: 'VICTORY!', subtitle: 'Done', color: activeTheme.colDone, badge: '🏆 CLEARED' }
      ];

      return (
        <div 
          className="min-h-screen flex flex-col overflow-hidden relative"
          style={{ 
            backgroundColor: activeTheme.bg, 
            color: activeTheme.border,
            '--app-bg': activeTheme.bg 
          }}
        >
          <PixelConfetti active={showCelebration} />

          {/* Fixed Sticky Top Header */}
          <header 
            className="sticky top-0 z-30 p-2 sm:p-3 pixel-box m-2 sm:m-3 mb-0 flex flex-col gap-1.5 shadow-md"
            style={{ backgroundColor: activeTheme.hudBg, color: activeTheme.hudText }}
          >
            <div className="flex justify-between items-center">
              {/* Hero Status Line */}
              <div className="flex items-center gap-2">
                <div className="w-6 h-6 rounded-none border border-white/40 flex items-center justify-center bg-black/40 text-xs animate-pixel-bounce">
                  👾

                <form onSubmit={handleCreateBoard} className="space-y-3">
                  <div>
                    <label className="block font-arcade text-[9px] mb-1 opacity-80">BOARD NAME:</label>
                    <input
                      type="text"
                      autoFocus
                      value={newBoardName}
                      onChange={(e) => setNewBoardName(e.target.value)}
                      placeholder="e.g. Work, Studio, Yardwork..."
                      className="w-full p-2.5 pixel-box-sm bg-white font-pixel text-xs focus:outline-none"
                    />
                  </div>
                  <div className="flex justify-end gap-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setIsCreatingBoard(false)}
                      className="pixel-btn px-3 py-1.5 bg-slate-300 font-arcade text-[10px]"
                    >
                      CANCEL
                    </button>
                    <button
                      type="submit"
                      disabled={!newBoardName.trim()}
                      className="pixel-btn px-4 py-1.5 bg-amber-400 text-black font-arcade text-[10px] disabled:opacity-50"
                    >
                      CREATE
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Floating XP Reward Notification */}
          {floatingXp && (
            <div className="fixed top-24 left-1/2 z-[100] -translate-x-1/2 pixel-box bg-yellow-300 text-black px-4 py-2 font-arcade text-xs animate-float-xp whitespace-nowrap shadow-lg">
              ✨ {floatingXp}
            </div>
          )}
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
