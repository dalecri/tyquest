    <style>
        body {
            overscroll-behavior-y: none;
            -webkit-tap-highlight-color: transparent;
        }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .pixel-box {
            border: 4px solid var(--app-border);
            box-shadow: 4px 4px 0px rgba(0,0,0,0.25);
            border-radius: 4px;
        }

        .pixel-box-sm {
            border: 2px solid var(--app-border);
            box-shadow: 2px 2px 0px rgba(0,0,0,0.25);
            border-radius: 2px;
        }

        .font-arcade { font-family: 'Silkscreen', cursive, system-ui, sans-serif, Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji; }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
            100% { transform: translateY(0px); }
        }
        .animate-float { animation: float 3s ease-in-out infinite; }

        @keyframes pop {
            0% { transform: scale(0.9); opacity: 0; }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop { animation: pop 0.2s ease-out forwards; }

        @keyframes flicker {
            0%, 100% { opacity: 1; transform: scale(1); }
            45% { opacity: 0.85; transform: scale(0.94); }
            50% { opacity: 1; transform: scale(1.08); }
            55% { opacity: 0.92; transform: scale(0.97); }
        }
        .animate-flicker { animation: flicker 1.8s ease-in-out infinite; }

        @keyframes shutterDown {
            from { transform: translateY(-100%); }
            to { transform: translateY(0); }
        }
        @keyframes shutterUp {
            from { transform: translateY(0); }
            to { transform: translateY(-100%); }
        }
        .animate-shutter-down { animation: shutterDown 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
        .animate-shutter-up { animation: shutterUp 0.35s cubic-bezier(0.5, 0, 0.75, 0) forwards; }

        @keyframes slideUpIn {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        @keyframes slideDownOut {
            from { transform: translateY(0); }
            to { transform: translateY(100%); }
        }
        .animate-slide-up-in { animation: slideUpIn 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
        .animate-slide-down-out { animation: slideDownOut 0.3s cubic-bezier(0.5, 0, 0.75, 0) forwards; }

        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 24px); }
        .pt-safe { padding-top: env(safe-area-inset-top, 12px); }
        
        input[type="date"] {
            box-sizing: border-box;
            appearance: none;
            -webkit-appearance: none;
        }
    </style>
</head>

    <script type="text/babel" data-type="module">
        const { useState, useEffect, useMemo, useRef } = React;

        class SoundManager {
            constructor() {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            }
            playTone(freq, type, duration, vol = 0.1) {
                if (this.ctx.state === 'suspended') this.ctx.resume();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + duration);
            }
            playBlip(freq = 400) { this.playTone(freq, 'square', 0.1, 0.05); }
            playCoin() {
                this.playTone(987.77, 'square', 0.1, 0.05);
                setTimeout(() => this.playTone(1318.51, 'square', 0.3, 0.05), 100);
            }
            playMagic() {
                this.playTone(400, 'sine', 0.1, 0.05);
                setTimeout(() => this.playTone(600, 'sine', 0.1, 0.05), 50);
                setTimeout(() => this.playTone(800, 'sine', 0.2, 0.05), 100);
            }
            playError() { this.playTone(150, 'sawtooth', 0.2, 0.05); }
        }

        const DB_NAME = 'TyQuestDB';
        const STORE_NAME = 'appData';

        const initDB = () => {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, 1);
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME);
                    }
                };
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        };

        const saveToDB = async (key, data) => {
            try {
                const db = await initDB();
                const tx = db.transaction(STORE_NAME, 'readwrite');
                tx.objectStore(STORE_NAME).put(data, key);
            } catch (e) { console.error('IDB Save Error:', e); }
        };

        const loadFromDB = async (key) => {
            try {
                const db = await initDB();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(STORE_NAME, 'readonly');
                    const req = tx.objectStore(STORE_NAME).get(key);
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => reject(req.error);
                });
            } catch (e) { return null; }
        };

        const getTodayStr = () => new Date().toISOString().split('T')[0];
        const getTomorrowStr = () => {
            const d = new Date();
            d.setDate(d.getDate() + 1);
            return d.toISOString().split('T')[0];
        };
        const addDays = (dateStr, days) => {
            const d = new Date(dateStr);
            d.setUTCDate(d.getUTCDate() + days);
            return d.toISOString().split('T')[0];
        };

        // --- JSONBin.io sync (no email account needed, just an API key + a shared Bin ID) ---
        const JSONBIN_BASE = 'https://api.jsonbin.io/v3/b';
        const SYNC_CONFIG_KEY = 'tyquest_sync_config';

        const loadSyncConfig = () => {
            try {
                const raw = localStorage.getItem(SYNC_CONFIG_KEY);
                return raw ? JSON.parse(raw) : null;
            } catch (e) { return null; }
        };

        const saveSyncConfig = (config) => {
            try {
                if (config) localStorage.setItem(SYNC_CONFIG_KEY, JSON.stringify(config));
                else localStorage.removeItem(SYNC_CONFIG_KEY);
            } catch (e) { /* ignore */ }
        };

        // All sync calls go through this so a slow/dead connection times out fast instead of hanging —
        // the app already has your data locally (IndexedDB), sync is a background bonus, never a blocker.
        const fetchWithTimeout = (url, options = {}, timeoutMs = 6000) => {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeoutMs);
            return fetch(url, { ...options, signal: controller.signal }).finally(() => clearTimeout(timer));
        };

        const jsonbinFetch = async (config) => {
            const res = await fetchWithTimeout(`${JSONBIN_BASE}/${config.binId}/latest`, {
                headers: { 'X-Master-Key': config.apiKey }
            });
            if (!res.ok) throw new Error('Fetch failed: ' + res.status);
            const data = await res.json();
            return data.record;
        };

        const jsonbinPush = async (config, snapshot) => {
            const res = await fetchWithTimeout(`${JSONBIN_BASE}/${config.binId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'X-Master-Key': config.apiKey },
                body: JSON.stringify(snapshot)
            });
            if (!res.ok) throw new Error('Push failed: ' + res.status);
        };

        const jsonbinCreate = async (apiKey, snapshot) => {
            const res = await fetchWithTimeout(JSONBIN_BASE, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-Master-Key': apiKey, 'X-Bin-Name': 'TyQuest Sync' },
                body: JSON.stringify(snapshot)
            });
            if (!res.ok) throw new Error('Create failed: ' + res.status);
            const data = await res.json();
            return data.metadata.id;
        };

        // Seed data — defined once at module scope instead of being rebuilt on every render
        const initialTasks = [

        function App() {
            const [isDataLoaded, setIsDataLoaded] = useState(false);
            
            const [tasks, setTasks] = useState([]);
            const [boards, setBoards] = useState([]);

            // Tavern & Activity are full-screen overlays now, separate from the main board/list/archive tabs
            const [showTavern, setShowTavern] = useState(false);
            const [tavernClosing, setTavernClosing] = useState(false);
            const [showActivity, setShowActivity] = useState(false);
            const [activityClosing, setActivityClosing] = useState(false);

            const openTavern = () => { setTavernClosing(false); setShowTavern(true); sound.playMagic(); };
            const closeTavern = () => { setTavernClosing(true); sound.playBlip(300); };
            const openActivity = () => { setActivityClosing(false); setShowActivity(true); sound.playBlip(500); };
            const closeActivity = () => { setActivityClosing(true); sound.playBlip(300); };
            const toggleActivity = () => { if (showActivity) closeActivity(); else openActivity(); };
            
            const [isAddingQuest, setIsAddingQuest] = useState(false);
            const [showSubtasksInput, setShowSubtasksInput] = useState(false);
            const [questDateChoice, setQuestDateChoice] = useState('today'); // 'today' | 'tomorrow' | 'custom'
            const [questDateValue, setQuestDateValue] = useState(getTodayStr());
            const [questRecurrenceType, setQuestRecurrenceType] = useState(null); // null | 'daily' | 'weekly' | 'custom'
            const [questCustomValue, setQuestCustomValue] = useState(2);
            const [questCustomUnit, setQuestCustomUnit] = useState('days'); // 'days' | 'weeks'

            // Reset the quick-pick date + recurrence choice each time the New Quest form opens
            useEffect(() => {
                if (isAddingQuest) {
                    setQuestDateChoice('today');
                    setQuestDateValue(getTodayStr());
                    setQuestRecurrenceType(null);
                    setQuestCustomValue(2);
                    setQuestCustomUnit('days');
                }
            }, [isAddingQuest]);

            // Turns the New Quest form's repeat picker into the { type, intervalDays } shape stored on the task
            const buildRecurrence = () => {
                if (!questRecurrenceType) return null;
                if (questRecurrenceType === 'daily') return { type: 'daily', intervalDays: 1 };
                if (questRecurrenceType === 'weekly') return { type: 'weekly', intervalDays: 7 };
                const n = Math.max(1, parseInt(questCustomValue, 10) || 1);
                return { type: 'custom', value: n, unit: questCustomUnit, intervalDays: questCustomUnit === 'weeks' ? n * 7 : n };
            };
            
            const [isManagingBoard, setIsManagingBoard] = useState(false);
            const [isAddingLibCat, setIsAddingLibCat] = useState(false);
            
            const [focusTaskId, setFocusTaskId] = useState(null);
            
            // Delete Dialog State
            const [deleteConfirm, setDeleteConfirm] = useState({ show: false, type: '', id: '', name: '' });

            const [dragState, setDragState] = useState(null); // { taskId, x, y, offsetX, offsetY, width, hoverColId }
            const dragCandidateRef = useRef(null); // pending drag before the hold threshold clears
            const dragTimerRef = useRef(null);

            // Cross-device sync (JSONBin.io) state
            const [syncConfig, setSyncConfig] = useState(null); // { apiKey, binId }
            const [syncStatus, setSyncStatus] = useState('offline'); // offline | syncing | synced | error
            const [syncFormKey, setSyncFormKey] = useState('');
            const [syncFormBinId, setSyncFormBinId] = useState('');
            const [syncError, setSyncError] = useState('');
            const [justCreatedBinId, setJustCreatedBinId] = useState(null);
            const pushTimerRef = useRef(null);
            const pendingPushRef = useRef(false);
            const isRemoteApplyRef = useRef(false);
            const hasSyncedOnceRef = useRef(false);

            // Level calculation
            useEffect(() => {
                setLevel(Math.floor(xp / 100) + 1);
            }, [xp]);

            // Data Loading
            useEffect(() => {
                const loadData = async () => {
                    const savedTasks = await loadFromDB('tq_tasks');
                    const savedBoards = await loadFromDB('tq_boards');
                    const savedLibCats = await loadFromDB('tq_libCats');
                    const savedLibItems = await loadFromDB('tq_libItems');
                    
                    const savedXp = await loadFromDB('tq_xp');
                    const savedGold = await loadFromDB('tq_gold');
                    const savedTheme = await loadFromDB('tq_theme');
                    const savedUnlockedThemes = await loadFromDB('tq_unlocked_themes');

                    if (savedTasks && savedTasks.length > 0) setTasks(savedTasks); else setTasks(initialTasks);
                    if (savedBoards && savedBoards.length > 0) setBoards(savedBoards); else setBoards(initialBoards);
                    if (savedLibCats && savedLibCats.length > 0) setLibraryCategories(savedLibCats); else setLibraryCategories(initialLibraryCategories);
                    if (savedLibItems && savedLibItems.length > 0) setLibraryItems(savedLibItems); else setLibraryItems(initialLibraryItems);
                    
                    if (savedXp !== null && !isNaN(parseInt(savedXp, 10))) setXp(parseInt(savedXp, 10)); else setXp(0);
                    if (savedGold !== null && !isNaN(parseInt(savedGold, 10))) setGold(parseInt(savedGold, 10)); else setGold(0);
                    
                    if (savedTheme) setThemeKey(savedTheme);
                    if (savedUnlockedThemes) setUnlockedThemes(savedUnlockedThemes);

                    setIsDataLoaded(true);
                };
                loadData();

                const cfg = loadSyncConfig();
                if (cfg) setSyncConfig(cfg);
            }, []);

            const applySnapshotToState = (snap) => {
                if (!snap) return;
                if (snap.tasks) setTasks(snap.tasks);
                if (snap.boards) setBoards(snap.boards);
                if (snap.libraryCategories) setLibraryCategories(snap.libraryCategories);
                if (snap.libraryItems) setLibraryItems(snap.libraryItems);
                if (typeof snap.xp === 'number') setXp(snap.xp);
                if (typeof snap.gold === 'number') setGold(snap.gold);
                if (snap.themeKey) setThemeKey(snap.themeKey);
                if (snap.unlockedThemes) setUnlockedThemes(snap.unlockedThemes);
            };

            const pullNow = async (cfgOverride) => {
                const cfg = cfgOverride || syncConfig;
                if (!cfg || pendingPushRef.current) return;
                try {
                    setSyncStatus('syncing');
                    const snap = await jsonbinFetch(cfg);
                    isRemoteApplyRef.current = true;
                    applySnapshotToState(snap);
                    hasSyncedOnceRef.current = true;
                    setSyncStatus('synced');
                } catch (e) {
                    setSyncStatus('error');
                }
            };

            // Pull once we have a config (loaded from storage or just connected), then again whenever
            // the app is brought back to the foreground — deliberately NOT constant polling, to stay
            // well inside JSONBin's free-tier request quota.
            useEffect(() => {
                if (!syncConfig || !isDataLoaded) return;
                pullNow();
                const onVisible = () => { if (document.visibilityState === 'visible') pullNow(); };
                document.addEventListener('visibilitychange', onVisible);
                return () => document.removeEventListener('visibilitychange', onVisible);
            }, [syncConfig, isDataLoaded]);

            const connectToBin = async (apiKey, binId) => {
                setSyncError('');
                setSyncStatus('syncing');
                try {
                    const cfg = { apiKey: apiKey.trim(), binId: binId.trim() };
                    const snap = await jsonbinFetch(cfg);
                    isRemoteApplyRef.current = true;
                    applySnapshotToState(snap);
                    hasSyncedOnceRef.current = true;
                    saveSyncConfig(cfg);
                    setSyncConfig(cfg);
                    setSyncStatus('synced');
                    setShowSyncModal(false);
                } catch (e) {
                    setSyncError('Could not connect — check the API key and Bin ID.');
                    setSyncStatus('error');
                }
            };

            const createNewBin = async (apiKey) => {
                setSyncError('');
                setSyncStatus('syncing');
                try {
                    const key = apiKey.trim();
                    const snapshot = { tasks, boards, libraryCategories, libraryItems, xp, gold, themeKey, unlockedThemes };
                    const binId = await jsonbinCreate(key, snapshot);
                    const cfg = { apiKey: key, binId };
                    hasSyncedOnceRef.current = true;
                    saveSyncConfig(cfg);
                    setSyncConfig(cfg);
                    setSyncStatus('synced');
                    setJustCreatedBinId(binId);
                } catch (e) {
                    setSyncError('Could not create a sync bin — check the API key.');
                    setSyncStatus('error');
                }
            };

            const disconnectSync = () => {
                saveSyncConfig(null);
                setSyncConfig(null);
                setJustCreatedBinId(null);
                hasSyncedOnceRef.current = false;
                setSyncStatus('offline');
            };

            // Data Saving
            useEffect(() => {
                if (!isDataLoaded) return;
                saveToDB('tq_tasks', tasks);
                saveToDB('tq_boards', boards);
                saveToDB('tq_libCats', libraryCategories);
                saveToDB('tq_libItems', libraryItems);
                saveToDB('tq_xp', xp.toString());
                saveToDB('tq_gold', gold.toString());
                saveToDB('tq_theme', themeKey);
                saveToDB('tq_unlocked_themes', unlockedThemes);

                if (!syncConfig || !hasSyncedOnceRef.current) return;
                if (isRemoteApplyRef.current) { isRemoteApplyRef.current = false; return; }

                pendingPushRef.current = true;
                clearTimeout(pushTimerRef.current);
                pushTimerRef.current = setTimeout(async () => {
                    try {
                        setSyncStatus('syncing');
                        await jsonbinPush(syncConfig, { tasks, boards, libraryCategories, libraryItems, xp, gold, themeKey, unlockedThemes });
                        setSyncStatus('synced');
                    } catch (e) {
                        setSyncStatus('error');
                    } finally {
                        pendingPushRef.current = false;
                    }
                }, 1500);
            }, [tasks, boards, libraryCategories, libraryItems, xp, gold, themeKey, unlockedThemes, isDataLoaded, syncConfig]);

            const activeTheme = RETRO_THEMES[themeKey] || RETRO_THEMES.snes16bit;

            const triggerConfetti = () => {
                if (!window.confetti) return;
                const colors = ['#FFD700', '#FF6B6B', '#4ECDC4', '#95E06C', '#A78BFA', '#FF9F1C', '#5DA9E9', '#F472B6', activeTheme.primary];
                const bursts = 7;
                // Fire several small bursts spread across the top edge, each falling straight down —
                // reads as pixel confetti raining across the screen instead of exploding from one point.
                for (let i = 0; i < bursts; i++) {
                    window.confetti({
                        particleCount: 9,
                        angle: 270,
                        spread: 60,
                        startVelocity: 9,
                        gravity: 0.55,
                        drift: (Math.random() - 0.5) * 2,
                        ticks: 220,
                        origin: { x: (i + 0.5) / bursts, y: -0.05 },
                        colors,
                        shapes: ['square'],
                        scalar: 0.85,
                        disableForReducedMotion: true
                    });
                }
            };

            const handleAddTask = (text, date, boardId, subtasksArr, recurrence) => {
                const newTask = {
                    id: Date.now().toString(),
                    text,
                    status: 'todo',
                    boardId: boardId === 'all' ? 'general' : boardId,
                    dueDate: date,
                    subtasks: subtasksArr || [],
                    recurrence: recurrence || null
                };
                setTasks([newTask, ...tasks]);
                sound.playBlip(600);
                setIsAddingQuest(false);
                setShowSubtasksInput(false);

                // Snap the view to whichever board this quest was assigned to, so it's visible right away
                if (boardId && boardId !== 'all') setActiveBoardId(boardId);
            };

            // Shared by the checkbox toggle, the boss-defeat screen, and drag-to-Victory —
            // marks a task done, pays out XP/Gold, and spawns the next occurrence if it repeats.
            const completeTask = (task) => {
                if (!task || task.status === 'done') return;

                setTasks(prevTasks => {
                    const updated = prevTasks.map(t => t.id === task.id ? { ...t, status: 'done', completedAt: getTodayStr() } : t);
                    if (!task.recurrence) return updated;

                    const nextDue = addDays(getTodayStr(), task.recurrence.intervalDays);
                    const clone = {
                        ...task,
                        id: Date.now().toString() + '_r',
                        status: 'todo',
                        completedAt: null,
                        dueDate: nextDue,
                        subtasks: (task.subtasks || []).map(s => ({ ...s, done: false }))
                    };
                    return [clone, ...updated];
                });

                sound.playCoin();
                triggerConfetti();
                setXp(prev => prev + 50);
                setGold(prev => prev + 10);

                if (focusTaskId === task.id) setFocusTaskId(null);
            };

            const handleToggleTaskStatus = (task) => {
                if (task.status === 'done') return;

                if (task.status === 'todo') {
                    setTasks(tasks.map(t => t.id === task.id ? { ...t, status: 'doing' } : t));
                    sound.playBlip(300);
                } else if (task.status === 'doing') {
                    completeTask(task);
                }
            };

            const handleDefeatBoss = (task) => completeTask(task);

            const handleToggleSubtask = (taskId, subIdx) => {
                setTasks(tasks.map(t => {
                    if (t.id !== taskId || t.status === 'done') return t;
                    const newSubs = [...t.subtasks];
                    const wasDone = newSubs[subIdx].done;
                    newSubs[subIdx].done = !wasDone;
                    
                    if (!wasDone) {
                        sound.playBlip(700);
                        setXp(prev => prev + 5);
                        setGold(prev => prev + 1);
                    }
                    
                    return { ...t, subtasks: newSubs };
                }));
            };

            const handleDeleteTask = (id) => {
                sound.playError();
                setTasks(tasks.filter(t => t.id !== id));
            };

            const handleRerollTask = (id) => {
                if (gold < 5) {
                    sound.playError();
                    alert("Not enough Gold!");
                    return;
                }
                setGold(prev => prev - 5);
                sound.playMagic();
                setTasks(tasks.map(t => t.id === id ? { ...t, dueDate: getTomorrowStr() } : t));
            };

            const moveTaskToStatus = (task, nextStatus) => {
                if (!task || task.status === nextStatus || task.status === 'done') return;

                if (nextStatus === 'done') {
                    completeTask(task);
                    return;
                }

                setTasks(prevTasks => prevTasks.map(t => t.id === task.id ? { ...t, status: nextStatus } : t));
                sound.playBlip(300);
            };

            // Hold-to-drag: works the same for mouse and touch via the Pointer Events API.
            // A short hold-and-still window disambiguates "starting a drag" from "scrolling the column".
            const handleCardPointerDown = (e, task) => {
                if (task.status === 'done') return;
                if (e.pointerType === 'mouse' && e.button !== 0) return;

                const rect = e.currentTarget.getBoundingClientRect();
                const candidate = {
                    taskId: task.id,
                    startX: e.clientX,
                    startY: e.clientY,
                    offsetX: e.clientX - rect.left,
                    offsetY: e.clientY - rect.top,
                    width: rect.width,
                    sourceStatus: task.status
                };
                dragCandidateRef.current = candidate;

                clearTimeout(dragTimerRef.current);
                dragTimerRef.current = setTimeout(() => {
                    if (dragCandidateRef.current !== candidate) return;
                    setDragState({ ...candidate, x: candidate.startX, y: candidate.startY, hoverColId: candidate.sourceStatus });
                    if (navigator.vibrate) navigator.vibrate(10);
                }, 260);
            };

            // Window-level listeners drive the drag once it's live (or cancel the candidate on early scroll movement)
            useEffect(() => {
                const handleMove = (e) => {
                    const candidate = dragCandidateRef.current;
                    if (!candidate) return;

                    if (!dragState) {
                        const dx = Math.abs(e.clientX - candidate.startX);
                        const dy = Math.abs(e.clientY - candidate.startY);
                        if (dx > 8 || dy > 8) {
                            clearTimeout(dragTimerRef.current);
                            dragCandidateRef.current = null;
                        }
                        return;
                    }

                    e.preventDefault();
                    const el = document.elementFromPoint(e.clientX, e.clientY);
                    const colEl = el && el.closest('[data-colid]');
                    setDragState(prev => prev ? { ...prev, x: e.clientX, y: e.clientY, hoverColId: colEl ? colEl.dataset.colid : prev.hoverColId } : prev);
                };

                const handleUp = () => {
                    clearTimeout(dragTimerRef.current);
                    setDragState(prev => {
                        if (prev) {
                            const task = tasks.find(t => t.id === prev.taskId);
                            if (task && prev.hoverColId) moveTaskToStatus(task, prev.hoverColId);
                        }
                        return null;
                    });
                    dragCandidateRef.current = null;
                };

                window.addEventListener('pointermove', handleMove, { passive: false });
                window.addEventListener('pointerup', handleUp);
                window.addEventListener('pointercancel', handleUp);
                return () => {
                    window.removeEventListener('pointermove', handleMove);
                    window.removeEventListener('pointerup', handleUp);
                    window.removeEventListener('pointercancel', handleUp);
                };
            }, [dragState, tasks]);

            const handleBuyTheme = (themeId, cost) => {
                if (gold >= cost) {
                    setGold(prev => prev - cost);
                    setUnlockedThemes([...unlockedThemes, themeId]);
                    setThemeKey(themeId);
                    sound.playCoin();
                } else {
                    sound.playError();
                }
            };

            const handleDeleteBoard = (boardId) => {
                if (boardId === 'all') return;
                setTasks(tasks.map(t => t.boardId === boardId ? { ...t, boardId: 'general' } : t));
                setBoards(boards.filter(b => b.id !== boardId));
                setActiveBoardId('all');
                sound.playError();
            };

            const handleAddLibraryItem = (text, categoryId) => {
                if(!text) return;
                const newItem = {
                    id: 'l_'+Date.now(),
                    text,
                    categoryId: categoryId === 'all' ? (libraryCategories[1]?.id || 'misc') : categoryId,
                    done: false
                };
                setLibraryItems([newItem, ...libraryItems]);
                sound.playBlip(600);
            };

            const handleToggleLibraryItem = (itemId) => {
                setLibraryItems(libraryItems.map(i => i.id === itemId ? { ...i, done: !i.done } : i));
                sound.playBlip(650);
            };

            const handleDeleteLibraryItem = (id) => {
                setLibraryItems(libraryItems.filter(i => i.id !== id));
                sound.playError();
            };

            const handleDeleteLibCategory = (id) => {
                if(id === 'all') return;
                setLibraryCategories(libraryCategories.filter(c => c.id !== id));
                setLibraryItems(libraryItems.filter(i => i.categoryId !== id));
                setActiveLibCat('all');
                sound.playError();
            };

            const executeDelete = () => {
                if (deleteConfirm.type === 'board') {
                    handleDeleteBoard(deleteConfirm.id);
                } else if (deleteConfirm.type === 'libCat') {
                    handleDeleteLibCategory(deleteConfirm.id);
                }
                setDeleteConfirm({ show: false, type: '', id: '', name: '' });
            };

            const filteredTasks = useMemo(() => {
                if (activeBoardId === 'all') return tasks;
                return tasks.filter(t => t.boardId === activeBoardId);
            }, [tasks, activeBoardId]);

            const filteredLibItems = useMemo(() => {
                if (activeLibCat === 'all') return libraryItems;
                return libraryItems.filter(i => i.categoryId === activeLibCat);
            }, [libraryItems, activeLibCat]);

            const activeBoardObj = boards.find(b => b.id === activeBoardId);
            const oldestFocusTask = useMemo(() => {
                const active = tasks.filter(t => t.status !== 'done');
                if (active.length === 0) return null;
                return active.sort((a, b) => new Date(a.dueDate || '2099-01-01') - new Date(b.dueDate || '2099-01-01'))[0];
            }, [tasks]);

            const achievementStats = useMemo(() => ({
                completedCount: tasks.filter(t => t.status === 'done').length,
                level,
                gold,
                unlockedThemesCount: unlockedThemes.length,
                totalThemesCount: Object.keys(RETRO_THEMES).length
            }), [tasks, level, gold, unlockedThemes]);

            // Completions-per-day grid, GitHub-contributions style. Counts only tasks currently
            // marked done — if a completed quest gets deleted later, its day no longer counts.
            const activityWeeks = useMemo(() => {
                const counts = {};
                tasks.forEach(t => {
                    if (t.status === 'done' && t.completedAt) {
                        counts[t.completedAt] = (counts[t.completedAt] || 0) + 1;
                    }
                });

                const today = new Date();
                today.setHours(0, 0, 0, 0);
                const totalDays = 371; // 53 weeks, matches GitHub's span
                const start = new Date(today);
                start.setDate(start.getDate() - (totalDays - 1));
                start.setDate(start.getDate() - start.getDay()); // snap back to the preceding Sunday

                const days = [];
                const cursor = new Date(start);
                while (cursor <= today) {
                    const dateStr = cursor.toISOString().split('T')[0];
                    days.push({ date: dateStr, count: counts[dateStr] || 0, month: cursor.getMonth() });
                    cursor.setDate(cursor.getDate() + 1);
                }
                while (days.length % 7 !== 0) days.push(null); // pad the final partial week

                const weeks = [];
                for (let i = 0; i < days.length; i += 7) weeks.push(days.slice(i, i + 7));

                const monthLabels = weeks.map((week, i) => {
                    const firstDay = week.find(d => d);
                    if (!firstDay) return null;
                    const prevFirstDay = i > 0 ? weeks[i - 1].find(d => d) : null;
                    if (!prevFirstDay || prevFirstDay.month !== firstDay.month) {
                        return new Date(firstDay.date).toLocaleString('en-US', { month: 'short' });
                    }
                    return null;
                });

                return { weeks, monthLabels, totalCompleted: Object.values(counts).reduce((a, b) => a + b, 0) };
            }, [tasks]);

            const activityIntensityStyle = (count) => {
                if (!count) return { backgroundColor: activeTheme.border, opacity: 0.12 };
                const opacityByLevel = [0, 0.4, 0.6, 0.8, 1];
                return { backgroundColor: activeTheme.primary, opacity: opacityByLevel[Math.min(count, 4)] };
            };

            if (!isDataLoaded) {
                return (
                    <div className="min-h-screen flex items-center justify-center font-arcade text-xl" style={{ backgroundColor: activeTheme.bg, color: activeTheme.border }}>
                        <div className="animate-pulse">LOADING SAVE FILE...</div>
                    </div>
                );
            }

            return (
                <div 
                    className="min-h-screen h-screen flex flex-col overflow-hidden relative font-arcade" 
                    style={{ 
                        backgroundColor: activeTheme.bg, 
                        color: activeTheme.border, 
                        '--app-bg': activeTheme.bg, 
                        '--app-border': activeTheme.border,
                        '--app-hudBg': activeTheme.hudBg
                    }}
                >
                    
                    {/* --- HEADER --- */}
                    <header className="flex-shrink-0 z-20 transition-all duration-300 relative" style={{ backgroundColor: activeTheme.hudBg, color: activeTheme.hudText, borderBottom: `4px solid ${activeTheme.border}` }}>
                        
                        {/* Top Bar (Collapsible) */}
                        {isNavVisible && (
                            <div className="px-4 py-3 flex justify-between items-center pt-safe border-b-4" style={{ borderColor: activeTheme.border }}>
                                <div className="flex items-center gap-3">
                                    <button onClick={() => { sound.playBlip(); setShowStatsModal(true); }} className="active:scale-95 transition-transform flex-shrink-0">
                                        <HeroAvatar />
                                    </button>
                                    <div>
                                        <h1 className="text-sm leading-tight">TYLER</h1>
                                        <p className="text-[10px] opacity-80">LVL {level}</p>
                                    </div>
                                </div>

                                <div className="flex items-center gap-4">
                                    <div className="flex items-center gap-1.5 px-2">
                                        <GoldBadge amount={Number.isNaN(gold) ? 0 : gold} />
                                    </div>
                                    
                                    <div className="flex items-center gap-3 h-10">
                                        <button onClick={() => { sound.playBlip(); setActiveTab('board'); }} className={`p-1 active:scale-95 transition-colors`} style={{ color: activeTheme.hudText }}>
                                            <IconBoard active={activeTab === 'board'} />
                                        </button>
                                        <button onClick={() => { sound.playBlip(); setActiveTab('list'); }} className={`p-1 active:scale-95 transition-colors`} style={{ color: activeTheme.hudText }}>
                                            <IconList active={activeTab === 'list'} />
                                        </button>
                                        <button onClick={() => { sound.playBlip(); setActiveTab('archive'); }} className={`p-1 active:scale-95 transition-colors`} style={{ color: activeTheme.hudText }}>
                                            <IconArchive active={activeTab === 'archive'} />
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Persistent Header Secondary Bar + Toggle */}
                        <div className={`flex justify-between items-center bg-black/10`}>
                            
                            {!isNavVisible && (
                                <button 
                                    onClick={() => { sound.playBlip(); setShowStatsModal(true); }} 
                                    className="px-2 py-1 active:scale-95 flex items-center gap-2 border-r-4 flex-shrink-0"
                                    style={{ borderColor: activeTheme.border }}
                                    title="View Profile"
                                >
                                    <div className="flex-shrink-0"><HeroAvatar /></div>
                                </button>
                            )}

                            {(activeTab === 'board' || activeTab === 'list') && (
                                <div className="flex overflow-x-auto hide-scrollbar px-2 py-2 gap-2 items-center flex-1">
                                    {boards.map(b => (
                                        <div key={b.id} className="flex items-center">
                                            <button 
                                                onClick={() => { sound.playBlip(); setActiveBoardId(b.id); }}
                                                className={`px-3 py-2 pixel-box-sm text-[10px] whitespace-nowrap active:scale-95 ${activeBoardId === b.id ? 'bg-white text-black' : 'bg-transparent text-inherit'}`}
                                                style={{ borderColor: activeTheme.hudText, color: activeBoardId !== b.id ? activeTheme.hudText : 'black' }}
                                            >
                                                {b.name}
                                            </button>
                                            {b.id !== 'all' && activeBoardId === b.id && (
                                                <button 
                                                    onClick={() => { sound.playBlip(); setDeleteConfirm({ show: true, type: 'board', id: b.id, name: b.name }); }}
                                                    className="ml-1 p-2 text-red-400 hover:bg-red-500/20 rounded active:scale-90"
                                                    title="Delete Board"
                                                >
                                                    <span className="text-[10px] font-bold">X</span>
                                                </button>
                                            )}
                                        </div>
                                    ))}
                                    <button 
                                        onClick={() => { sound.playBlip(); setIsManagingBoard(true); }}
                                        className="px-3 py-2 pixel-box-sm text-[10px] whitespace-nowrap bg-black/40 text-white active:scale-95 border-dashed"
                                        style={{ borderColor: activeTheme.hudText }}
                                    >
                                        + NEW BOARD
                                    </button>
                                </div>
                            )}

                            {activeTab === 'archive' && (
                                <div className="flex overflow-x-auto hide-scrollbar px-2 py-2 gap-2 items-center flex-1">
                                    {libraryCategories.map(cat => (
                                        <div key={cat.id} className="flex items-center">
                                            <button 
                                                onClick={() => { sound.playBlip(); setActiveLibCat(cat.id); }}
                                                className={`px-3 py-2 pixel-box-sm text-[10px] whitespace-nowrap active:scale-95 flex items-center gap-1 ${activeLibCat === cat.id ? 'bg-white text-black' : 'bg-transparent text-inherit'}`}
                                                style={{ borderColor: activeTheme.hudText, color: activeLibCat !== cat.id ? activeTheme.hudText : 'black' }}
                                            >
                                                <span>{cat.emoji}</span> <span>{cat.name}</span>
                                            </button>
                                            {activeLibCat === cat.id && cat.id !== 'all' && (
                                                <button 
                                                    onClick={() => { sound.playBlip(); setDeleteConfirm({ show: true, type: 'libCat', id: cat.id, name: cat.name }); }}
                                                    className="ml-1 p-2 text-red-400 hover:bg-red-500/20 active:scale-90 rounded"
                                                    title="Delete List"
                                                >
                                                    <span className="text-[10px] font-bold">X</span>
                                                </button>
                                            )}
                                        </div>
                                    ))}
                                    <button 
                                        onClick={() => { sound.playBlip(); setIsAddingLibCat(true); }}
                                        className="px-3 py-2 pixel-box-sm text-[10px] whitespace-nowrap bg-black/40 text-white active:scale-95 border-dashed"
                                        style={{ borderColor: activeTheme.hudText }}
                                    >
                                        + NEW LIST
                                    </button>
                                </div>
                            )}

                            {/* Nav Toggle Button */}
                            <button 
                                onClick={() => { sound.playBlip(); setIsNavVisible(!isNavVisible); }}
                                className="px-4 py-2.5 active:scale-95 border-l-4 flex items-center justify-center flex-shrink-0"
                                style={{ borderColor: activeTheme.border, color: activeTheme.hudText }}
                            >
                                {isNavVisible ? <IconChevronUp /> : <IconChevronDown />}
                            </button>
                        </div>
                    </header>

                    {}
                    <main className="flex-1 overflow-hidden relative flex flex-col min-h-0 h-full">
                        
                        {activeTab === 'board' && (
                            <div className="flex-1 overflow-x-auto snap-x snap-mandatory hide-scrollbar p-4 flex gap-4 items-start h-full pb-8">
                                {['todo', 'doing', 'done'].map(colId => {
                                    const colTasks = filteredTasks.filter(t => t.status === colId);
                                    const colLabel = colId === 'todo' 
                                        ? (activeBoardId !== 'all' ? `${activeBoardObj.name}` : 'QUEST LOG')
                                        : colId === 'doing' ? 'IN BATTLE' : 'VICTORY';
                                    const colColor = activeTheme[`col${colId.charAt(0).toUpperCase() + colId.slice(1)}`];

                                    const isDropTarget = dragState && dragState.hoverColId === colId && dragState.sourceStatus !== colId;

                                    return (
                                        <div

                                                onClick={() => syncFormKey && createNewBin(syncFormKey)}
                                                disabled={!syncFormKey || syncStatus === 'syncing'}
                                                className={`w-full pixel-box-sm py-2 text-[10px] bg-green-500 text-white active:scale-95 mb-3 ${(!syncFormKey || syncStatus === 'syncing') ? 'opacity-50' : ''}`}
                                            >
                                                CREATE NEW SYNC
                                            </button>

                                            <div className="text-center text-[7px] opacity-50 mb-3">— OR, if the other device already made one —</div>

                                            <input
                                                type="text" value={syncFormBinId} onChange={(e) => setSyncFormBinId(e.target.value)}
                                                placeholder="PASTE BIN ID HERE"
                                                className="w-full pixel-box-sm p-2 text-[10px] mb-2 bg-white text-black focus:outline-none"
                                            />
                                            <button
                                                type="button"
                                                onClick={() => syncFormKey && syncFormBinId && connectToBin(syncFormKey, syncFormBinId)}
                                                disabled={!syncFormKey || !syncFormBinId || syncStatus === 'syncing'}
                                                className={`w-full pixel-box-sm py-2 text-[10px] bg-blue-500 text-white active:scale-95 ${(!syncFormKey || !syncFormBinId || syncStatus === 'syncing') ? 'opacity-50' : ''}`}
                                            >
                                                CONNECT TO EXISTING
                                            </button>

                                            {syncError && <p className="text-[9px] text-red-500 mt-2">{syncError}</p>}
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {focusTaskId && (
                        <div className="fixed inset-0 z-[100] flex flex-col items-center justify-center bg-black/95 p-4 sm:p-6 text-white overflow-hidden">
                            <style>{`
                                @keyframes shake { 0% { transform: translate(1px, 1px) rotate(0deg); } 10% { transform: translate(-1px, -2px) rotate(-1deg); } 20% { transform: translate(-3px, 0px) rotate(1deg); } 30% { transform: translate(3px, 2px) rotate(0deg); } 40% { transform: translate(1px, -1px) rotate(1deg); } 50% { transform: translate(-1px, 2px) rotate(-1deg); } 60% { transform: translate(-3px, 1px) rotate(0deg); } 70% { transform: translate(3px, 1px) rotate(-1deg); } 80% { transform: translate(-1px, -1px) rotate(1deg); } 90% { transform: translate(1px, 2px) rotate(0deg); } 100% { transform: translate(1px, -2px) rotate(-1deg); } }
                                .boss-shake { animation: shake 0.5s; animation-iteration-count: infinite; }
                                .scanlines { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06)); background-size: 100% 4px, 3px 100%; pointer-events: none; z-index: 10; }
                            `}</style>
                            <div className="scanlines"></div>
                            
                            <div className="relative z-20 w-full max-w-sm flex flex-col items-center text-center">
                                <h2 className="text-red-500 text-lg sm:text-xl mb-8 animate-pulse">WARNING! ENEMY APPROACHING</h2>
                                
                                {tasks.find(t => t.id === focusTaskId) && (
                                    <div className="boss-shake pixel-box bg-red-900 border-red-500 p-6 sm:p-8 mb-8 w-full">
                                        <div className="flex justify-center mb-6">
                                            <svg width="48" height="48" viewBox="0 0 16 16" fill="white">
                                                <rect x="4" y="2" width="8" height="8" />
                                                <rect x="5" y="10" width="6" height="4" />
                                                <rect x="5" y="5" width="2" height="2" fill="var(--app-hudBg, #000)"/>
                                                <rect x="9" y="5" width="2" height="2" fill="var(--app-hudBg, #000)"/>
                                                <rect x="7" y="8" width="2" height="1" fill="var(--app-hudBg, #000)"/>
                                                <rect x="5" y="11" width="1" height="3" fill="var(--app-hudBg, #000)"/>
                                                <rect x="7" y="11" width="2" height="3" fill="var(--app-hudBg, #000)"/>
                                                <rect x="10" y="11" width="1" height="3" fill="var(--app-hudBg, #000)"/>
                                            </svg>
                                        </div>
                                        <p className="text-sm leading-loose mb-6 break-words">{tasks.find(t => t.id === focusTaskId).text}</p>
                                        
                                        <div className="flex gap-4 mt-6">
                                            <button 
                                                onClick={() => handleDefeatBoss(tasks.find(t => t.id === focusTaskId))}
                                                className="flex-1 bg-red-500 text-white pixel-box-sm py-4 active:bg-white active:text-red-500 text-xs"
                                            >
                                                DEFEAT
                                            </button>
                                            <button 
                                                onClick={() => { sound.playError(); setFocusTaskId(null); }}
                                                className="flex-1 bg-gray-700 text-white pixel-box-sm py-4 active:bg-gray-500 text-xs"
                                            >
                                                FLEE
                                            </button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {isAddingQuest && (
                        <div className="fixed inset-0 z-[60] bg-black/60 backdrop-blur-sm flex items-end sm:items-center justify-center p-4">
                            <div className="w-full max-w-md pixel-box bg-white p-6 animate-pop pb-safe max-h-[90vh] overflow-y-auto hide-scrollbar" style={{ backgroundColor: activeTheme.windowBg }}>
                                <h2 className="text-sm mb-4">NEW QUEST</h2>
                                <form onSubmit={(e) => {
                                    e.preventDefault();
                                    const fd = new FormData(e.target);
                                    
                                    const subs = [];
                                    if(fd.get('sub1') && fd.get('sub1').trim()) subs.push({id: 's1_'+Date.now(), text: fd.get('sub1').trim(), done: false});
                                    if(fd.get('sub2') && fd.get('sub2').trim()) subs.push({id: 's2_'+Date.now(), text: fd.get('sub2').trim(), done: false});
                                    if(fd.get('sub3') && fd.get('sub3').trim()) subs.push({id: 's3_'+Date.now(), text: fd.get('sub3').trim(), done: false});

                                    handleAddTask(fd.get('text'), questDateValue, fd.get('boardId'), subs, buildRecurrence());
                                }}>
                                    <textarea 
                                        name="text" required autoFocus
                                        placeholder="What needs doing?"
                                        className="w-full pixel-box-sm p-3 text-sm mb-4 min-h-[80px] bg-white text-black focus:outline-none"
                                    ></textarea>

                                    {!showSubtasksInput ? (
                                        <button 
                                            type="button" 
                                            onClick={() => setShowSubtasksInput(true)} 
                                            className="w-full pixel-box-sm py-3 text-[10px] bg-white/50 text-black mb-4 border-dashed border-2 active:bg-gray-100"
                                        >
                                            + ADD SUBTASKS
                                        </button>
                                    ) : (
                                        <div className="mb-4 space-y-2">
                                            <div className="flex justify-between items-center opacity-70">
                                                <p className="text-[8px]">SUBTASKS (OPTIONAL)</p>
                                                <button type="button" onClick={() => setShowSubtasksInput(false)} className="text-red-500 text-[10px]">X</button>
                                            </div>
                                            <input type="text" name="sub1" placeholder="- Subtask 1" className="w-full pixel-box-sm p-2 text-xs bg-white/70 text-black focus:outline-none" />
                                            <input type="text" name="sub2" placeholder="- Subtask 2" className="w-full pixel-box-sm p-2 text-xs bg-white/70 text-black focus:outline-none" />
                                            <input type="text" name="sub3" placeholder="- Subtask 3" className="w-full pixel-box-sm p-2 text-xs bg-white/70 text-black focus:outline-none" />
                                        </div>
                                    )}
                                    
                                    <div className="flex gap-2 mb-4">
                                        <button 
                                            type="button" 
                                            onClick={() => { setQuestDateChoice('today'); setQuestDateValue(getTodayStr()); }} 
                                            className={`flex-1 pixel-box-sm py-2 text-[10px] active:scale-95 ${questDateChoice === 'today' ? 'bg-yellow-400 text-black' : 'bg-gray-200 text-black'}`}
                                        >
                                            TODAY
                                        </button>
                                        <button 
                                            type="button" 
                                            onClick={() => { setQuestDateChoice('tomorrow'); setQuestDateValue(getTomorrowStr()); }} 
                                            className={`flex-1 pixel-box-sm py-2 text-[10px] active:scale-95 ${questDateChoice === 'tomorrow' ? 'bg-yellow-400 text-black' : 'bg-gray-200 text-black'}`}
                                        >
                                            TMRW
                                        </button>
                                    </div>
                                    <div className="w-full mb-4">
                                        <input 
                                            type="date" name="date" 
                                            value={questDateValue} 
                                            onChange={(e) => { setQuestDateValue(e.target.value); setQuestDateChoice('custom'); }} 
                                            className="w-full pixel-box-sm p-3 text-[10px] bg-white text-black block" 
                                        />
                                    </div>

                                    <div className="mb-6">
                                        <p className="text-[8px] mb-2 opacity-70">REPEAT (OPTIONAL)</p>
                                        <div className="flex gap-2 mb-2">
                                            {[{ key: null, label: 'NONE' }, { key: 'daily', label: 'DAILY' }, { key: 'weekly', label: 'WEEKLY' }, { key: 'custom', label: 'CUSTOM' }].map(opt => (
                                                <button
                                                    key={opt.label}
                                                    type="button"
                                                    onClick={() => setQuestRecurrenceType(opt.key)}
                                                    className={`flex-1 pixel-box-sm py-2 text-[9px] active:scale-95 ${questRecurrenceType === opt.key ? 'bg-purple-400 text-white' : 'bg-gray-200 text-black'}`}
                                                >
                                                    {opt.label}
                                                </button>
                                            ))}
                                        </div>
                                        {questRecurrenceType === 'custom' && (
                                            <div className="flex gap-2 items-center p-2 pixel-box-sm bg-purple-50">
                                                <span className="text-[9px] text-black flex-shrink-0">EVERY</span>
                                                <input
                                                    type="number" min="1" max="365"
                                                    value={questCustomValue}
                                                    onChange={(e) => setQuestCustomValue(e.target.value)}
                                                    className="w-14 pixel-box-sm p-1 text-[10px] text-black text-center"
                                                />
                                                <div className="flex gap-1 flex-1">
                                                    {['days', 'weeks'].map(u => (
                                                        <button
                                                            key={u}
                                                            type="button"
                                                            onClick={() => setQuestCustomUnit(u)}
                                                            className={`flex-1 pixel-box-sm py-1 text-[9px] active:scale-95 ${questCustomUnit === u ? 'bg-purple-400 text-white' : 'bg-gray-200 text-black'}`}
                                                        >
                                                            {u.toUpperCase()}
                                                        </button>
                                                    ))}
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                    
                                    <select name="boardId" defaultValue={activeBoardId} className="w-full pixel-box-sm p-3 text-[10px] mb-6 bg-white text-black">
                                        {boards.map(b => <option key={b.id} value={b.id}>{b.name}</option>)}
                                    </select>
                                    
                                    <div className="flex gap-3">
                                        <button type="button" onClick={() => { sound.playBlip(); setIsAddingQuest(false); setShowSubtasksInput(false); }} className="flex-1 pixel-box-sm py-3 text-xs bg-gray-300 text-black active:scale-95">CANCEL</button>
                                        <button type="submit" className="flex-1 pixel-box-sm py-3 text-xs bg-green-500 text-white active:scale-95">SAVE</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {isManagingBoard && (
                        <div className="fixed inset-0 z-[60] bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="w-full max-w-md pixel-box bg-white p-6 animate-pop" style={{ backgroundColor: activeTheme.windowBg }}>
                                <h2 className="text-sm mb-4">CREATE BOARD</h2>
                                <form onSubmit={(e) => {
                                    e.preventDefault();
                                    const fd = new FormData(e.target);
                                    const newBoard = { id: 'b_'+Date.now(), name: fd.get('name').toUpperCase() };
                                    setBoards([...boards, newBoard]);
                                    setActiveBoardId(newBoard.id);
                                    sound.playCoin();
                                    setIsManagingBoard(false);
                                }}>
                                    <input type="text" name="name" required placeholder="BOARD NAME" maxLength="15" className="w-full pixel-box-sm p-3 text-[10px] mb-6 bg-white text-black focus:outline-none" />
                                    <div className="flex gap-3">
                                        <button type="button" onClick={() => { sound.playBlip(); setIsManagingBoard(false); }} className="flex-1 pixel-box-sm py-3 text-xs bg-gray-300 text-black active:scale-95">CANCEL</button>
                                        <button type="submit" className="flex-1 pixel-box-sm py-3 text-xs bg-blue-500 text-white active:scale-95">CREATE</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {isAddingLibCat && (
                        <div className="fixed inset-0 z-[60] bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="w-full max-w-md pixel-box bg-white p-6 animate-pop" style={{ backgroundColor: activeTheme.windowBg }}>
                                <h2 className="text-sm mb-4">CREATE LIST</h2>
                                <form onSubmit={(e) => {
                                    e.preventDefault();
                                    const fd = new FormData(e.target);
                                    const newCat = { 
                                        id: 'c_'+Date.now(), 
                                        name: fd.get('name').toUpperCase(),
                                        emoji: fd.get('emoji') || '📝'
                                    };
                                    setLibraryCategories([...libraryCategories, newCat]);
                                    setActiveLibCat(newCat.id);
                                    sound.playCoin();
                                    setIsAddingLibCat(false);
                                }}>
                                    <div className="flex gap-2 mb-6">
                                        <input 
                                            type="text" 
                                            name="emoji" 
                                            placeholder="Emoji" 
                                            maxLength="2"
                                            defaultValue="📝"
                                            className="w-16 pixel-box-sm p-3 text-sm text-center bg-white text-black focus:outline-none" 
                                        />
                                        <input 
                                            type="text" 
                                            name="name" 
                                            required 
                                            placeholder="LIST NAME" 
                                            maxLength="15" 
                                            className="flex-1 pixel-box-sm p-3 text-[10px] bg-white text-black focus:outline-none" 
                                        />
                                    </div>
                                    <div className="flex gap-3">
                                        <button type="button" onClick={() => { sound.playBlip(); setIsAddingLibCat(false); }} className="flex-1 pixel-box-sm py-3 text-xs bg-gray-300 text-black active:scale-95">CANCEL</button>
                                        <button type="submit" className="flex-1 pixel-box-sm py-3 text-xs bg-blue-500 text-white active:scale-95">CREATE</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* --- DELETE CONFIRMATION MODAL --- */}
                    {deleteConfirm.show && (
                        <div className="fixed inset-0 z-[110] bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="w-full max-w-sm pixel-box bg-white p-6 animate-pop text-center" style={{ backgroundColor: activeTheme.windowBg }}>
                                <h2 className="text-red-500 text-lg mb-4 animate-pulse font-bold">WARNING!</h2>
                                <p className="text-sm mb-6 leading-relaxed">
                                    Are you sure you want to delete <br/>
                                    <span className="text-blue-500 font-bold">{deleteConfirm.name}</span>?
                                </p>
                                <div className="flex gap-4">
                                    <button 
                                        onClick={() => { sound.playBlip(); setDeleteConfirm({ show: false, type: '', id: '', name: '' }); }}
                                        className="flex-1 bg-gray-500 text-white pixel-box-sm py-3 active:scale-95 text-xs"
                                    >
                                        CANCEL
                                    </button>
                                    <button 
                                        onClick={() => { executeDelete(); }}
                                        className="flex-1 bg-red-500 text-white pixel-box-sm py-3 active:scale-95 text-xs"
                                    >
                                        DELETE
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* --- DRAG GHOST (follows pointer while a quest is being dragged) --- */}
                    {dragState && (() => {
                        const draggedTask = tasks.find(t => t.id === dragState.taskId);
                        if (!draggedTask) return null;
                        return (
                            <div
                                className="fixed z-[200] pixel-box p-3 pointer-events-none"
                                style={{
                                    left: dragState.x - dragState.offsetX,
                                    top: dragState.y - dragState.offsetY,
                                    width: dragState.width,
                                    backgroundColor: activeTheme.windowBg,
                                    color: activeTheme.border,
                                    transform: 'rotate(-2deg) scale(1.03)',
                                    opacity: 0.95
                                }}
                            >
                                <p className="text-sm break-words leading-tight">{draggedTask.text}</p>
                            </div>
                        );
                    })()}
                </div>
            );

            function TaskCard({ task, compact = false }) {
                const isOverdue = task.dueDate && task.dueDate < getTodayStr() && task.status !== 'done';
                const isDone = task.status === 'done';
                const isBeingDragged = dragState && dragState.taskId === task.id;
                
                return (
                    <div 
                        className={`pixel-box p-3 relative group transition-opacity ${isDone ? 'opacity-70' : 'bg-white text-black'} ${isBeingDragged ? 'opacity-30' : ''}`} 
                        style={{ backgroundColor: isDone ? activeTheme.tagBg : activeTheme.windowBg, cursor: isDone ? 'default' : 'grab' }}
                        onPointerDown={(e) => !isDone && handleCardPointerDown(e, task)}
                    >
                        
                        <button 
                            onClick={() => handleDeleteTask(task.id)} 
                            className="absolute top-2 right-2 text-red-500 font-bold px-1.5 py-0.5 pixel-box-sm bg-white/80 active:scale-90 text-[10px]"
                            title="Delete Task"
                        >
                            X
                        </button>

                        <div className="flex items-start gap-3 pr-6">
                            <button 
                                onClick={() => handleToggleTaskStatus(task)}
                                disabled={isDone}
                                className={`w-6 h-6 flex-shrink-0 pixel-box-sm flex items-center justify-center text-xs mt-0.5 ${isDone ? 'bg-black text-white cursor-not-allowed opacity-60' : 'bg-white active:scale-90'}`}
                            >
                                {task.status === 'doing' ? 'O' : task.status === 'done' ? 'X' : ''}
                            </button>
                            
                            <div className="flex-1 min-w-0">
                                <p className={`text-sm mb-2 break-words leading-tight ${isDone ? 'line-through opacity-70' : ''}`}>
                                    {task.text}
                                </p>
                                
                                {task.subtasks && task.subtasks.length > 0 && (
                                    <div className="mb-3 space-y-1.5 border-l-2 pl-2" style={{ borderColor: activeTheme.border }}>
                                        {task.subtasks.map((sub, idx) => (
                                            <div key={sub.id} className="flex items-center gap-2">
                                                <button
                                                    onClick={(e) => { e.stopPropagation(); handleToggleSubtask(task.id, idx); }}
                                                    disabled={isDone}
                                                    className={`w-3.5 h-3.5 flex-shrink-0 pixel-box-sm flex items-center justify-center ${sub.done ? 'bg-green-500 text-white' : 'bg-white'} ${isDone ? 'cursor-not-allowed opacity-70' : ''}`}
                                                >
                                                    {sub.done && <span className="text-[8px] leading-none">X</span>}
                                                </button>
                                                <span className={`text-xs leading-tight ${sub.done ? 'line-through opacity-50' : ''}`}>{sub.text}</span>
                                            </div>
                                        ))}
                                    </div>
                                )}
                                
                                <div className="flex flex-wrap gap-2 items-center">
                                    <span className="bg-yellow-200 text-black px-1.5 py-0.5 pixel-box-sm text-[8px]">+50XP</span>
                                    
                                    {isDone && task.completedAt && (
                                        <span className="px-1.5 py-0.5 pixel-box-sm text-[8px] bg-green-200 text-black">
                                            ✓ {task.completedAt}
                                        </span>
                                    )}

                                    {task.dueDate && !isDone && (
                                        <span className={`px-1.5 py-0.5 pixel-box-sm text-[8px] flex items-center gap-1 ${isOverdue ? 'bg-red-500 text-white animate-pulse' : 'bg-white text-black'}`}>
                                            📅 {task.dueDate === getTodayStr() ? 'TODAY' : task.dueDate === getTomorrowStr() ? 'TMRW' : task.dueDate}
                                        </span>
                                    )}

                                    {task.recurrence && !isDone && (
                                        <span className="px-1.5 py-0.5 pixel-box-sm text-[8px] bg-purple-200 text-black">
                                            🔁 {task.recurrence.type === 'daily' ? 'DAILY' : task.recurrence.type === 'weekly' ? 'WEEKLY' : `EVERY ${task.recurrence.value}${task.recurrence.unit === 'weeks' ? 'W' : 'D'}`}
                                        </span>
                                    )}

                                    {!isDone && (
                                        <select
                                            value={task.boardId}
                                            onChange={(e) => {
                                                const newBoardId = e.target.value;
                                                if (newBoardId === task.boardId) return;
                                                setTasks(prevTasks => prevTasks.map(t => t.id === task.id ? { ...t, boardId: newBoardId } : t));
                                                sound.playBlip(500);
                                                if (newBoardId !== 'general') setActiveBoardId(newBoardId);
                                            }}
                                            onClick={(e) => e.stopPropagation()}
                                            className="px-1 py-0.5 pixel-box-sm text-[8px] bg-blue-200 text-black"
                                            title="Move to board"
                                        >
                                            <option value="general">General</option>
                                            {boards.filter(b => b.id !== 'all').map(b => (
                                                <option key={b.id} value={b.id}>{b.name}</option>
                                            ))}
                                        </select>
                                    )}
                                </div>
                            </div>
                        </div>

                        {/* Reroll Action */}
                        {isOverdue && !isDone && (
                            <div className="mt-3 pt-3 border-t-2 border-black/10 flex justify-start items-center">
                                <button onClick={() => handleRerollTask(task.id)} className="bg-purple-500 text-white px-2 py-1 pixel-box-sm text-[8px] active:scale-95 flex items-center gap-1">
                                    🎲 REROLL (5G)
                                </button>
                            </div>
                        )}
                    </div>
                );
            }

            function getTaskGroup(dateStr) {
                if (!dateStr) return 'No Date';
                if (dateStr === getTodayStr()) return 'Today';
                if (dateStr === getTomorrowStr()) return 'Tomorrow';
                if (dateStr < getTodayStr()) return 'Overdue';
                return 'Upcoming';
            }
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
